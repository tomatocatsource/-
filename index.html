  // ---------- 配置の共有コード ----------
  // 表示中の日付で「どの配置場所に誰のチップがあるか」を送る。端末ごとにidが違うので、名前で照合する。
  // 形式: "P7:" + base64(gzip( 日付 GS 配置場所名 FS 種類 FS 左枠 RS … GS 名前 FS 配置場所の番号 FS 枠 RS … ))
  var PLACEMENT_CODE_PREFIX = "P7:";

  async function encodePlacementCode(iso){
    syncPlacementsToDay();
    var list = state.dayPlacements[iso] || [];
    var npById = Object.create(null), locById = Object.create(null), locIdx = Object.create(null), locs = [], recs = [];
    state.nameplates.forEach(function(n){ npById[n.id] = n; });
    state.locations.forEach(function(l){ locById[l.id] = l; });
    list.forEach(function(p){
      var np = npById[p[0]], loc = locById[p[1]];
      if(!np || !loc) return;
      if(!(loc.id in locIdx)){ locIdx[loc.id] = locs.length; locs.push(loc); }
      recs.push(np.name + FS + locIdx[loc.id] + FS + slotToCode(p[2]));
    });
    // 並びは画面上の配置場所の順にする（受け取った側の表示順もそろう）
    var payload = iso + GS +
      locs.map(function(l){ return l.name + FS + typeToCode(l.type) + FS + (l.leftSlot ? 1 : 0); }).join(RS) + GS +
      recs.join(RS);
    var result = { code: "", people: recs.length, locations: locs.length };
    if(typeof CompressionStream !== "undefined"){
      var stream = new Blob([new TextEncoder().encode(payload)]).stream().pipeThrough(new CompressionStream("gzip"));
      result.code = PLACEMENT_CODE_PREFIX + bytesToBase64(new Uint8Array(await new Response(stream).arrayBuffer()));
    }else{
      result.code = PLACEMENT_CODE_PREFIX + btoa(unescape(encodeURIComponent(payload)));
    }
    return result;
  }

  async function decodePlacementCode(code){
    var trimmed = fixCodePrefix((code || "").replace(/\s+/g, ""));   // チャットで折り返されていても読めるように
    if(trimmed.indexOf(TEMPLATE_CODE_PREFIX) === 0 || trimmed.indexOf("P4:") === 0){
      throw new Error("これはテンプレートの共有コードです。メニューのテンプレートにある「コードを受取」から読み込んでください。");
    }
    if(trimmed.indexOf(SHIFT_CODE_PREFIX) === 0 || trimmed.indexOf(OT_CODE_PREFIX) === 0){
      throw new Error("これはシフト表の共有コードです。シフト表の「コードを受取」から読み込んでください。");
    }
    if(trimmed.indexOf(PLACEMENT_CODE_PREFIX) !== 0){
      throw new Error("配置の共有コード（P7: で始まる）を全体貼り付けてください。");
    }
    var payload;
    try{
      var binary = atob(trimmed.slice(PLACEMENT_CODE_PREFIX.length));
      var bytes = Uint8Array.from(binary, function(c){ return c.charCodeAt(0); });
      if(bytes.length >= 2 && bytes[0] === 0x1f && bytes[1] === 0x8b){
        if(typeof DecompressionStream === "undefined") throw new Error("old");
        var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        payload = new TextDecoder().decode(await new Response(stream).arrayBuffer());
      }else{
        payload = decodeURIComponent(escape(binary));
      }
    }catch(e){
      throw new Error("コードの形式が正しくありません。途中で切れていないか確認してください。");
    }
    var sec = payload.split(GS), iso = sec[0] || "";
    if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)) throw new Error("コードの中身が正しくありません。");
    var locs = (sec[1] || "").length ? sec[1].split(RS).map(function(rec){
      var f = rec.split(FS);
      return { name: cleanText(f[0], LIMITS.locationName), type: codeToType(parseInt(f[1], 10)), leftSlot: f[2] === "1" };
    }) : [];
    var places = (sec[2] || "").length ? sec[2].split(RS).map(function(rec){
      var f = rec.split(FS);
      return { name: cleanText(f[0], LIMITS.nameplateName), loc: parseInt(f[1], 10), slot: codeToSlot(parseInt(f[2], 10)) };
    }).filter(function(p){ return p.name && locs[p.loc]; }) : [];
    return { iso: iso, locations: locs, places: places };
  }

  // 受け取った配置を、この端末の配置場所・ネームプレートに当てはめる（まだ反映はしない）
  function matchPlacementCode(dec){
    // 配置場所：同じ名前どうしで対応させる（同じ名前が複数あるときは上から順に）
    var localByKey = Object.create(null);
    state.locations.forEach(function(l){ var k = nameKey(l.name); (localByKey[k] = localByKey[k] || []).push(l); });
    var usedKey = Object.create(null), locMap = [], missingLocs = [];
    dec.locations.forEach(function(l, idx){
      var k = nameKey(l.name), n = usedKey[k] || 0, hit = (localByKey[k] || [])[n];
      usedKey[k] = n + 1;
      locMap[idx] = hit || null;
      if(!hit) missingLocs.push(l.name);
    });
    // 人：シフト表の読み込みと同じ照合（完全一致がなければ近い名前）
    var match = buildNameMatcher(), usedNp = Object.create(null);
    var list = [], unmatched = [], fuzzy = [], noLoc = [], off = [];
    dec.places.forEach(function(p){
      var loc = locMap[p.loc];
      if(!loc){ noLoc.push(p.name); return; }
      var hit = match(p.name);
      if(!hit){ unmatched.push(p.name); return; }
      var np = state.nameplates.find(function(n){ return n.name === hit.name && !usedNp[n.id]; });
      if(!np){ unmatched.push(p.name); return; }
      if(isOff(np.name, dec.iso)){ off.push(np.name); return; }
      usedNp[np.id] = true;
      if(hit.fuzzy) fuzzy.push(p.name + "→" + hit.name);
      var slot = p.slot;
      if(loc.type === "2人" || loc.type === "3人") slot = "top";
      else if(slot === "left" && !loc.leftSlot) slot = "top";
      list.push([np.id, loc.id, slot]);
    });
    return { iso: dec.iso, list: list, unmatched: unmatched, fuzzy: fuzzy, missingLocs: missingLocs, noLoc: noLoc, off: off };
  }

  // ---------- shift (休みシフト) ----------
  // state.dayoffs = { "<名前>": { "YYYY-MM-DD": 1 | "有" | "指" | "欠" | "健" | "*", ... } }   ← 休みの日を入力する
  //   1 = 休（手入力はこれだけ）。ほかは Excel・共有コードから読み込んだときの種類
  //   （有 = 有給、指 = 指定休、欠 = 欠勤、健 = 健診、* = 表で「*」）
  // 名前をキーにしているので、テンプレート適用や配置コードの読み込みで
  // ネームプレートが作り直されても、休みはそのまま残る。
  // 絞り込みがオンのときは、ボードの日付が休みになっている人が
  // ボード・未配置の両方から外れる（休みを入力していない日は出勤扱い）。
  function getDayoffs(name){
    return Object.prototype.hasOwnProperty.call(state.dayoffs, name) ? state.dayoffs[name] : null;
  }
  function isOff(name, iso){
    var m = getDayoffs(name);
    return !!(m && m[iso]);
  }
  // 休みの種類（「休」以外）と、シフト表での色分けのクラス
  var OFF_KIND_CLASS = { "有": " k-yu", "指": " k-shi", "欠": " k-ketsu", "健": " k-ken", "*": " k-ast" };
  function normalizeOffKind(k){
    return Object.prototype.hasOwnProperty.call(OFF_KIND_CLASS, k) ? k : "休";
  }
  // 休みの種類: "休" / "有" / "指" / "欠" / "健" / "*"。休みでなければ null
  function offKind(name, iso){
    var m = getDayoffs(name), v = m && m[iso];
    if(!v) return null;
    return normalizeOffKind(v);
  }
  // kind を省くと、すでに休みの日は種類をそのまま残す（週の休みパターンで「有」を「休」に変えないため）
  // ---------- 出勤の記号（「冷」など） ----------
  // Excelから読んだ「出勤として読む記号」を、シフト表にそのまま表示するために名前・日付ごとに持つ。休みの日には持たない。
  function cleanMark(v){ return String(v).replace(/[\u0000-\u001F,=]/g, "").trim().slice(0, 3); }
  // ---------- 勤務時間（開始・終了） ----------
  // state.workTimes = { 名前: { s: 開始の分, e: 終了の分 } }。Excelの「開始」「終了」の列から読むほか、手で設定できる。
  // 日をまたぐ勤務は終了を 24:00 より後（例 26:00 = 1560分）で持つ。
  function parseWorkTime(v){
    if(v == null) return null;
    var t = String(v).normalize("NFKC").replace(/\s+/g, "");
    if(t === "") return null;
    var m;
    if(/^\d*\.\d+$/.test(t) || t === "0" || t === "1"){            // Excelの時刻（1日 = 1）
      var f = parseFloat(t);
      if(f >= 0 && f <= 2 && (f < 1 || t === "1" || /^1\.\d+$/.test(t))) return Math.round(f * 1440);
    }
    if((m = /^(\d{1,2}):(\d{2})(?::\d{2})?$/.exec(t))) return toMin(+m[1], +m[2]);
    if((m = /^(\d{1,2})時(?:(\d{1,2})分?|半)?$/.exec(t))) return toMin(+m[1], /半$/.test(t) ? 30 : (m[2] ? +m[2] : 0));
    if((m = /^(\d{3,4})$/.exec(t))){ var n = +m[1]; return toMin(Math.floor(n / 100), n % 100); }
    if((m = /^(\d{1,2})(?:\.(\d+))?$/.exec(t))){ var h = parseFloat(t); if(h >= 0 && h <= 30) return Math.round(h * 60); }
    return null;
    function toMin(h, mi){ return (h >= 0 && h <= 30 && mi >= 0 && mi < 60) ? h * 60 + mi : null; }
  }
  function normWorkTime(sv, ev){
    if(sv === null || ev === null) return null;
    if(sv >= 1440) sv -= 1440;
    if(ev <= sv) ev += 1440;          // 日をまたぐ
    if(ev - sv > 1440) return null;
    return { s: sv, e: ev };
  }
  function fmtClock(min){
    var h = Math.floor(min / 60), m = min % 60;
    return h + ":" + (m < 10 ? "0" : "") + m;
  }
  function fmtEndClock(min){ return min >= 1440 ? "翌" + fmtClock(min - 1440) : fmtClock(min); }
  function workTimeOf(name){ return Object.prototype.hasOwnProperty.call(state.workTimes, name) ? state.workTimes[name] : null; }

  // ---------- 日付の印（「棚」「特」など、その日全体に付ける文字） ----------
  // state.dayMarks = { "YYYY-MM-DD": "棚" }。Excelの日付の上（または下）の行から読むほか、シフト表で手入力もできる。
  var DAY_MARK_MAX = 4;
  function cleanDayMark(v){ return String(v == null ? "" : v).normalize("NFKC").replace(/[\u0000-\u001F]/g, "").replace(/\s+/g, "").slice(0, DAY_MARK_MAX); }
  function dayMarkOf(iso){ return Object.prototype.hasOwnProperty.call(state.dayMarks, iso) ? state.dayMarks[iso] : null; }
  function setDayMark(iso, v){
    v = cleanDayMark(v);
    if(v) state.dayMarks[iso] = v; else delete state.dayMarks[iso];
  }
  function markOf(name, iso){
    var m = Object.prototype.hasOwnProperty.call(state.workMarks, name) ? state.workMarks[name] : null;
    return (m && m[iso]) || null;
  }
  function setMark(name, iso, text){
    var m = Object.prototype.hasOwnProperty.call(state.workMarks, name) ? state.workMarks[name] : null;
    text = text ? cleanMark(text) : "";
    if(text){
      if(!m){ m = {}; state.workMarks[name] = m; }
      m[iso] = text;
    } else if(m){
      delete m[iso];
      if(Object.keys(m).length === 0) delete state.workMarks[name];
    }
  }

  function setOff(name, iso, on, kind){
    var m = getDayoffs(name);
    if(on){
      setMark(name, iso, null);   // 休みの日に出勤の記号は残さない
      if(!m){ m = {}; state.dayoffs[name] = m; }
      if(kind !== undefined) m[iso] = normalizeOffKind(kind) === "休" ? 1 : kind;
      else if(!m[iso]) m[iso] = 1;
      unplaceOnDate(name, iso);   // 休みの人は未配置に戻す
    } else if(m){
      delete m[iso];
      if(Object.keys(m).length === 0) delete state.dayoffs[name];
    }
  }
  function isVisibleOnBoard(np){
    if(!state.shiftFilter) return true;
    return !isOff(np.name, state.boardDate || todayISO());
  }
  function migrateShiftName(oldName, newName){
    migrateOvertimeName(oldName, newName);
    if(state.myName === oldName) state.myName = newName;   // 個人カレンダーの選択も新しい名前に付け替える
    if(Object.prototype.hasOwnProperty.call(state.workTimes, oldName)){   // 勤務時間も新しい名前へ
      if(!Object.prototype.hasOwnProperty.call(state.workTimes, newName)) state.workTimes[newName] = state.workTimes[oldName];
      if(!state.nameplates.some(function(n){ return n.name === oldName; })) delete state.workTimes[oldName];
    }
    if(Object.prototype.hasOwnProperty.call(state.workMarks, oldName)){
      if(!Object.prototype.hasOwnProperty.call(state.workMarks, newName)) state.workMarks[newName] = JSON.parse(JSON.stringify(state.workMarks[oldName]));
      if(!state.nameplates.some(function(n){ return n.name === oldName; })) delete state.workMarks[oldName];
    }
    var m = getDayoffs(oldName);
    if(!m) return;
    if(getDayoffs(newName) === null) state.dayoffs[newName] = JSON.parse(JSON.stringify(m));
    var stillUsed = state.nameplates.some(function(n){ return n.name === oldName; });
    if(!stillUsed) delete state.dayoffs[oldName];
  }
  // 旧バージョン（出勤日を入力）のデータを休みの形式に変換する。
  // 出勤日が1日でも入力されていた月は、その月の出勤日以外を休みとして引き継ぐ。
  function convertWorkdaysToDayoffs(old){
    var out = {};
    Object.keys(old).forEach(function(name){
      var m = old[name];
      if(!m || typeof m !== "object") return;
      var months = {};
      Object.keys(m).forEach(function(iso){ if(m[iso]) months[iso.slice(0, 7)] = true; });
      var off = {}, any = false;
      Object.keys(months).forEach(function(ym){
        var y = parseInt(ym.slice(0, 4), 10), mo = parseInt(ym.slice(5, 7), 10);
        for(var d = 1, n = daysInMonth(y, mo); d <= n; d++){
          var iso = isoOf(y, mo, d);
          if(!m[iso]){ off[iso] = 1; any = true; }
        }
      });
      if(any) out[name] = off;
    });
    return out;
  }

  // ---------- 残業（試作） ----------
  // state.overtime = { "<名前>": { "YYYY-MM-DD": 時間 } }。休みと同じく名前で持つ（Excelと名前で照合するため）。
  // 時間は 0.25（15分）単位。
  var OT_MAX = 12.75, OT_STEP = 0.25;
  function getOvertimeMap(name){
    return Object.prototype.hasOwnProperty.call(state.overtime, name) ? state.overtime[name] : null;
  }
  function otHours(name, iso){
    var m = getOvertimeMap(name), v = m && m[iso];
    return (typeof v === "number" && v > 0) ? v : 0;
  }
  function setOvertime(name, iso, hours){
    var m = getOvertimeMap(name);
    if(hours > 0){
      if(!m){ m = {}; state.overtime[name] = m; }
      m[iso] = hours;
    } else if(m){
      delete m[iso];
      if(Object.keys(m).length === 0) delete state.overtime[name];
    }
  }
  function otMonthTotal(name, y, m){
    var sum = 0;
    for(var d = 1, n = daysInMonth(y, m); d <= n; d++) sum += otHours(name, isoOf(y, m, d));
    return sum;
  }
  // 1.50 → "1.5"、2.00 → "2"
  function fmtHours(h){ return String(Math.round(h * 100) / 100); }
  // ---------- 残業アラート ----------
  // 月の残業の合計が「注意」以上で黄色、「上限」以上で赤。初期値は 36協定の原則の上限（月45時間）に合わせて 40 / 45。
  var OT_ALERT_MAX = 200;
  function cleanOtAlert(v){
    var w = isObj(v) ? v.warn : null, l = isObj(v) ? v.limit : null;
    w = (typeof w === "number" && isFinite(w) && w > 0 && w <= OT_ALERT_MAX) ? w : 40;
    l = (typeof l === "number" && isFinite(l) && l > 0 && l <= OT_ALERT_MAX) ? l : 45;
    if(w > l) w = l;
    return { warn: w, limit: l };
  }
  function otAlertLevel(total){
    if(total >= state.otAlert.limit) return "over";
    if(total >= state.otAlert.warn) return "warn";
    return null;
  }
  function otAlertLabel(level){ return level === "over" ? "上限超え" : level === "warn" ? "注意" : ""; }
  // その月に注意・上限超えの人（名前ごと・重複なし）。多い順
  function otAlertPeople(y, m){
    var seen = Object.create(null), out = [];
    state.nameplates.forEach(function(np){
      if(seen[np.name]) return;
      seen[np.name] = true;
      var total = otMonthTotal(np.name, y, m), lv = otAlertLevel(total);
      if(lv) out.push({ name: np.name, total: total, level: lv });
    });
    out.sort(function(a, b){ return b.total - a.total; });
    return out;
  }
  function boardYM(){
    var p = (state.boardDate || todayISO()).split("-");
    return { y: parseInt(p[0], 10), m: parseInt(p[1], 10) };
  }
  function openOvertimeAlertModal(y, m){
    var list = otAlertPeople(y, m);
    openModal(function(box){
      var rows = list.map(function(pp){
        return '<div class="template-row"><span class="template-name">' + escapeHtml(pp.name) + '</span>' +
          '<span class="ot-lv ot-lv-' + pp.level + '">' + otAlertLabel(pp.level) + '　' + fmtHours(pp.total) + 'h</span></div>';
      }).join("");
      box.innerHTML =
        '<div class="sheet-header"><span>' + m + '月の残業アラート（' + list.length + '人）</span></div>' +
        '<p class="confirm-msg" style="font-size:12px;color:var(--ink-soft);margin:0 0 8px;">注意 ' + fmtHours(state.otAlert.warn) + '時間・上限 ' + fmtHours(state.otAlert.limit) + '時間（月の合計）</p>' +
        (list.length ? rows : '<p class="confirm-msg">該当する人はいません。</p>') +
        '<div class="modal-actions">' +
          '<button class="btn-secondary" id="otAlertSetBtn" type="button">基準を変更</button>' +
          '<button class="btn-primary" id="closeBtn" type="button">閉じる</button>' +
        '</div>';
      box.querySelector("#closeBtn").addEventListener("click", closeModal);
      box.querySelector("#otAlertSetBtn").addEventListener("click", openOvertimeAlertSettings);
    });
  }
  function openOvertimeAlertSettings(){
    openModal(function(box){
      box.innerHTML =
        '<div class="sheet-header"><span>残業アラートの基準</span></div>' +
        '<p class="confirm-msg" style="font-size:12px;color:var(--ink-soft);margin:0 0 4px;">1か月の残業の合計で判定します。36協定の原則の上限は月45時間です。</p>' +
        '<label>注意（黄色）… この時間から</label>' +
        '<input type="number" id="otWarnInput" min="1" max="' + OT_ALERT_MAX + '" step="1" inputmode="decimal">' +
        '<label>上限（赤）… この時間から</label>' +
        '<input type="number" id="otLimitInput" min="1" max="' + OT_ALERT_MAX + '" step="1" inputmode="decimal">' +
        '<p class="confirm-msg" id="otAlertError" style="display:none;color:var(--danger);"></p>' +
        '<div class="modal-actions"><button class="btn-secondary" id="otAlertResetBtn" type="button">初期値（40・45）に戻す</button></div>' +
        '<div class="modal-actions">' +
          '<button class="btn-secondary" id="cancelBtn" type="button">キャンセル</button>' +
          '<button class="btn-primary" id="okBtn" type="button">保存</button>' +
        '</div>';
      var wIn = box.querySelector("#otWarnInput"), lIn = box.querySelector("#otLimitInput"), err = box.querySelector("#otAlertError");
      wIn.value = fmtHours(state.otAlert.warn); lIn.value = fmtHours(state.otAlert.limit);
      box.querySelector("#otAlertResetBtn").addEventListener("click", function(){ wIn.value = 40; lIn.value = 45; });
      box.querySelector("#cancelBtn").addEventListener("click", closeModal);
      box.querySelector("#okBtn").addEventListener("click", function(){
        var w = parseFloat(wIn.value), l = parseFloat(lIn.value);
        function bad(v){ return !isFinite(v) || v <= 0 || v > OT_ALERT_MAX; }
        if(wIn.validity.badInput || lIn.validity.badInput || bad(w) || bad(l)){
          err.textContent = "1〜" + OT_ALERT_MAX + "の数字で入力してください。"; err.style.display = "block"; return;
        }
        if(w > l){ err.textContent = "注意は上限以下にしてください。"; err.style.display = "block"; return; }
        state.otAlert = { warn: w, limit: l };
        scheduleSave(); renderAll();
        if(shiftOverlay.classList.contains("open")) renderShiftSheet(true);
        closeModal();
      });
    });
  }

  function migrateOvertimeName(oldName, newName){
    var m = getOvertimeMap(oldName);
    if(!m) return;
    if(getOvertimeMap(newName) === null) state.overtime[newName] = JSON.parse(JSON.stringify(m));
    var stillUsed = state.nameplates.some(function(n){ return n.name === oldName; });
    if(!stillUsed) delete state.overtime[oldName];
  }

  var OT_HOUR_CHOICES = 12;             // 時間は 0〜12
  var OT_FRACS = [0, 0.25, 0.5, 0.75];  // 小数点以下
  function fracLabel(f){ return f === 0 ? ".0" : String(f).replace(/^0/, ""); }   // 0.25 → ".25"
  function hoursToJP(h){
    var hh = Math.floor(h), mm = Math.round((h - hh) * 60);
    return (hh ? hh + "時間" : "") + (mm ? mm + "分" : "") || "0分";
  }
  function openOvertimeModal(name, iso){
    var cur = otHours(name, iso);
    var offK = offKind(name, iso);
    var selH = Math.floor(cur), selF = Math.round((cur - selH) * 4) / 4;
    if(OT_FRACS.indexOf(selF) === -1) selF = 0;
    openModal(function(box){
      var hourBtns = "";
      for(var h = 0; h <= OT_HOUR_CHOICES; h++){
        hourBtns += '<div class="choice-btn ot-num-btn" data-h="' + h + '">' + h + '</div>';
      }
      box.innerHTML =
        '<div class="sheet-header"><span>' + escapeHtml(name) + '　' + mdOfISO(iso) + 'の残業</span></div>' +
        (offK ? '<p class="confirm-msg" style="font-size:12px;color:var(--ink-soft);margin:0 0 6px;">この日は「' + escapeHtml(offK) + '」になっています。</p>' : '') +
        '<label>時間</label>' +
        '<div class="choice-row ot-choice-row" id="otHour">' + hourBtns + '</div>' +
        '<label>小数点以下</label>' +
        '<div class="choice-row ot-choice-row" id="otFrac">' +
          OT_FRACS.map(function(f){ return '<div class="choice-btn ot-frac-btn" data-f="' + f + '">' + fracLabel(f) + '</div>'; }).join("") +
        '</div>' +
        '<div class="ot-total" id="otTotal"></div>' +
        (cur ? '<div class="modal-actions"><button class="btn-danger" id="otClearBtn" type="button">残業なしにする</button></div>' : '') +
        '<div class="modal-actions">' +
          '<button class="btn-secondary" id="cancelBtn" type="button">キャンセル</button>' +
          '<button class="btn-primary" id="okBtn" type="button">保存</button>' +
        '</div>';
      var totalEl = box.querySelector("#otTotal");
      function refresh(){
        box.querySelectorAll("#otHour .choice-btn").forEach(function(b){ b.classList.toggle("selected", +b.dataset.h === selH); });
        box.querySelectorAll("#otFrac .choice-btn").forEach(function(b){ b.classList.toggle("selected", +b.dataset.f === selF); });
        var total = selH + selF;
        var ymP = iso.split("-"), monthTotal = otMonthTotal(name, +ymP[0], +ymP[1]) - cur + total, lv = otAlertLevel(monthTotal);
        totalEl.innerHTML = (total
          ? '残業 <b>' + fmtHours(total) + '</b> 時間（' + hoursToJP(total) + '）'
          : '残業なし') +
          '<div class="ot-month-line' + (lv ? ' ot-lv ot-lv-' + lv : '') + '">' + (+ymP[1]) + '月の合計 ' + fmtHours(monthTotal) + '時間' +
          (lv ? '（' + otAlertLabel(lv) + '）' : '') + '</div>';
      }
      box.querySelectorAll("#otHour .choice-btn").forEach(function(b){
        b.addEventListener("click", function(){ selH = +b.dataset.h; refresh(); });
      });
      box.querySelectorAll("#otFrac .choice-btn").forEach(function(b){
        b.addEventListener("click", function(){ selF = +b.dataset.f; refresh(); });
      });
      function commit(h){
        setOvertime(name, iso, h);
        scheduleSave(); renderShiftSheet(true); renderAll(); closeModal();
      }
      var clearBtn = box.querySelector("#otClearBtn");
      if(clearBtn) clearBtn.addEventListener("click", function(){ commit(0); });
      box.querySelector("#cancelBtn").addEventListener("click", closeModal);
      box.querySelector("#okBtn").addEventListener("click", function(){ commit(selH + selF); });
      refresh();
    });
  }

  var WEEKDAYS = ["日","月","火","水","木","金","土"];
  var shiftOverlay = document.getElementById("shiftOverlay");
  var shiftBody = document.getElementById("shiftBody");
  var shiftMonth = null;   // { y, m }  m は 1〜12
  var shiftPeople = [];    // 表の行に対応する名前（重複なし）
  // 入力範囲の指定。行（名前）・列（日付）を選ぶと、選んだ行と列のマスだけ入力できる。
  // 何も選んでいないときは全マス入力可能。
  var shiftSelRows = Object.create(null);  // { 名前: true }
  var shiftSelCols = Object.create(null);  // { "YYYY-MM-DD": true }
  var shiftFs = false;     // シフト表の表だけを全画面で見ているとき true

    renderShiftSheet(false);
  }
  function closeShiftSheet(){ setShiftFs(false, true); shiftOverlay.classList.remove("open"); }
  // 表の全画面表示。noRender なら見た目のクラスだけ切り替える
  function setShiftFs(on, noRender){
    shiftFs = !!on;
    document.getElementById("shiftSheet").classList.toggle("table-fs", shiftFs);
    if(!noRender) renderShiftSheet(true);
  }

  // シフト表の読み込み・共有バーのボタン（線のアイコン＋短い文字）
  var SHIFT_TOOL_ICONS = {
    file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6"/><path d="m9 14 3 3 3-3"/>',
    send: '<path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>',
    receive: '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>'
  };
  function shiftToolBtn(id, icon, label){
    return '<button type="button" class="shift-tool" id="' + id + '">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + SHIFT_TOOL_ICONS[icon] + '</svg>' +
      '<span>' + label + '</span></button>';
  }

  function renderShiftSheet(keepScroll){
    var y = shiftMonth.y, m = shiftMonth.m, n = daysInMonth(y, m);
    var boardIso = state.boardDate || todayISO();
    var oldScroll = shiftBody.querySelector(".shift-scroll");
    var keepL = oldScroll ? oldScroll.scrollLeft : 0, keepT = oldScroll ? oldScroll.scrollTop : 0;

    var seen = Object.create(null);
    shiftPeople = [];
    sortByNumber(state.nameplates).forEach(function(np){
      if(!seen[np.name]){ seen[np.name] = true; shiftPeople.push(np.name); }
    });

    var html =
      '<div class="shift-toggle-row">' +
        '<div class="shift-toggle-title">出勤者だけをボードに表示</div>' +
        '<button type="button" class="switch-btn" id="shiftFilterSwitch" role="switch" aria-checked="' + (state.shiftFilter ? "true" : "false") + '"><i></i></button>' +
      '</div>' +
      '<div class="shift-toolbar">' +
        '<button type="button" class="date-step lg" id="shiftPrevMonth" aria-label="前の月">◀</button>' +
        '<span class="shift-month">' + y + '年' + m + '月</span>' +
        '<button type="button" class="date-step lg" id="shiftNextMonth" aria-label="次の月">▶</button>' +
      '</div>' +
      '<div class="shift-mode-row" role="tablist">' +
        '<button type="button" role="tab" class="shift-mode-btn' + (shiftMode === "off" ? ' selected' : '') + '" data-mode="off" aria-selected="' + (shiftMode === "off") + '">シフト</button>' +
        '<button type="button" role="tab" class="shift-mode-btn' + (shiftMode === "ot" ? ' selected' : '') + '" data-mode="ot" aria-selected="' + (shiftMode === "ot") + '">残業</button>' +
        '<button type="button" role="tab" class="shift-mode-btn' + (shiftMode === "me" ? ' selected' : '') + '" data-mode="me" aria-selected="' + (shiftMode === "me") + '">自分</button>' +
      '</div>' +
      (shiftMode === "me" ? '' :
      // 読み込み・共有は1本のバーにまとめる（ボタンの枠を並べるより目に入る情報を減らすため）
      '<div class="shift-tools" role="group" aria-label="読み込みと共有">' +
        shiftToolBtn(shiftMode === "off" ? "shiftImportBtn" : "shiftOtImportBtn", "file", "ファイル読込") +
        shiftToolBtn("shiftShareBtn", "send", "コードを送る") +
        shiftToolBtn("shiftReceiveBtn", "receive", "コードを受取") +
      '</div>') +
      (shiftMode === "ot"
        ? '<div class="ot-alert-row"><span class="ot-dot ot-dot-warn"></span>注意 ' + fmtHours(state.otAlert.warn) + 'h' +
          '<span class="ot-dot ot-dot-over"></span>上限 ' + fmtHours(state.otAlert.limit) + 'h' +
          '<button type="button" class="ot-alert-link" id="otAlertSettingBtn">変更</button></div>'
        : '');

    if(shiftPeople.length === 0){
      html += '<p class="confirm-msg">ネームプレートがありません。先に「＋」から追加してください。</p>';
      setShiftFs(false, true);
      shiftBody.innerHTML = html;
      return;
    }
    if(shiftMode === "me"){ setShiftFs(false, true); shiftBody.innerHTML = html + renderMyCalendarHtml(y, m, boardIso); return; }

    // 表は全画面にできるよう、見出し・案内・表をひとまとめにする
    var t = '<div class="shift-fs-wrap">' +
      '<div class="shift-fs-title">' + y + '年' + m + '月の' + (shiftMode === "ot" ? '残業' : 'シフト') + '</div>' +
      '<div class="shift-fs-row"><div class="shift-range" id="shiftRange"></div>' +
        '<button type="button" class="shift-fs-btn" id="shiftFsBtn" aria-pressed="' + (shiftFs ? 'true' : 'false') + '">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            (shiftFs ? '<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>' : '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>') +
          '</svg><span>' + (shiftFs ? '閉じる' : '全画面') + '</span></button>' +
      '</div>' +
      '<div class="shift-scroll"><table class="shift-table"><thead><tr><th class="name-col">名前</th>';
    var hasDm = false;
    for(var d = 1; d <= n; d++){
      var wd = new Date(y, m - 1, d).getDay();
      var iso = isoOf(y, m, d);
      var cls = (wd === 0 ? "sun" : wd === 6 ? "sat" : "") + (iso === boardIso ? " board-col" : "");
      var dmk = dayMarkOf(iso);
      if(dmk) hasDm = true;
      t += '<th class="' + cls + '" data-d="' + iso + '">' + (dmk ? '<div class="dm" title="' + escapeHtml(dmk) + '">' + escapeHtml(dmk) + '</div>' : '') +
        '<div>' + d + '</div><div class="wd">' + WEEKDAYS[wd] + '</div></th>';
    }
    t += '</tr></thead><tbody>';
    shiftPeople.forEach(function(name, i){
      t += '<tr><th class="name-col" scope="row" data-i="' + i + '"><div class="nm-row"><span class="nm">' + escapeHtml(name) + '</span><span class="off"></span></div></th>';
      for(var dd = 1; dd <= n; dd++){
        var isoD = isoOf(y, m, dd);
        var kind = offKind(name, isoD);   // 休みのマスなら "休" / "有" / "指"
        if(shiftMode === "ot"){
          // 残業の表示: 時間があれば数字、休みの日は薄く休みの種類を出す
          var oh = otHours(name, isoD);
          t += '<td class="shift-cell' + (oh ? ' on ot-on' : (kind ? ' ot-offday' : '')) + (isoD === boardIso ? ' board-col' : '') +
               '" data-i="' + i + '" data-d="' + isoD + '">' + (oh ? fmtHours(oh) : (kind || '')) + '</td>';
          continue;
        }
        var mk = kind ? null : markOf(name, isoD);   // 出勤の記号（「冷」など）
        t += '<td class="shift-cell' + (kind ? ' on' + kindClass(kind) : '') + (mk ? ' work-mark' : '') + (isoD === boardIso ? ' board-col' : '') +
             '" data-i="' + i + '" data-d="' + isoD + '">' + (kind || escapeHtml(mk || '')) + '</td>';
      }
      t += '</tr>';
    });
    t += '</tbody><tfoot><tr><th class="name-col">' + (shiftMode === "ot" ? '残業計' : '出勤') + '</th>';
    for(var c = 1; c <= n; c++){ t += '<td class="cnt" data-d="' + isoOf(y, m, c) + '"></td>'; }
    t += '</tr></tfoot></table></div></div>';

    if(hasDm) t = t.replace('<table class="shift-table">', '<table class="shift-table has-dm">');
    shiftBody.innerHTML = html + t;
    document.getElementById("shiftSheet").classList.toggle("table-fs", shiftFs);
    refreshShiftCounts();
    refreshShiftSelection();

    var scroller = shiftBody.querySelector(".shift-scroll");
    if(keepScroll){
      scroller.scrollLeft = keepL; scroller.scrollTop = keepT;
    } else {
      var target = scroller.querySelector("thead th.board-col");
      scroller.scrollLeft = target ? Math.max(0, target.offsetLeft - 165) : 0;
    }
  }

  // ---------- 個人カレンダー ----------
  // 選んだ1人の、その月の出勤・休み・残業・配置場所を月のカレンダーで見る（閲覧のみ）。
  // 表は shift-table の部品を使うので、休みの色・土日の色はシフト表と同じテーマの見た目になる。
  function myPlacementFinder(name){
    syncPlacementsToDay();
    var ids = Object.create(null), locById = Object.create(null);
    state.nameplates.forEach(function(n){ if(n.name === name) ids[n.id] = true; });
    state.locations.forEach(function(l){ locById[l.id] = l; });
    return function(iso){
      var list = state.dayPlacements[iso];
      if(!Array.isArray(list)) return null;
      for(var i = 0; i < list.length; i++){
        if(ids[list[i][0]] && locById[list[i][1]]) return locById[list[i][1]].name;
      }
      return null;
    };
  }
  function renderMyCalendarHtml(y, m, boardIso){
    var names = shiftPeople;
    var name = (state.myName && names.indexOf(state.myName) !== -1) ? state.myName : null;
    var h = '<div class="my-pick">' +
      '<label class="my-pick-label" for="myCalName">名前</label>' +
      '<select id="myCalName" class="my-pick-select">' +
        (name ? '' : '<option value="" selected>名前を選んでください</option>') +
        names.map(function(nm){ return '<option value="' + escapeHtml(nm) + '"' + (nm === name ? ' selected' : '') + '>' + escapeHtml(nm) + '</option>'; }).join('') +
      '</select></div>';
    if(!name){
      return h + '<p class="menu-empty my-empty">自分の名前を選ぶと、その月のシフトをカレンダーで見られます。選んだ名前は次回も残ります。</p>';
    }
    var n = daysInMonth(y, m), today = todayISO(), locOf = myPlacementFinder(name);
    var work = 0, offs = 0, kinds = Object.create(null), ot = 0;
    var first = new Date(y, m - 1, 1).getDay();
    var t = '<div class="shift-scroll my-cal-wrap"><table class="shift-table my-cal"><thead><tr>';
    WEEKDAYS.forEach(function(w, i){ t += '<th class="' + (i === 0 ? 'sun' : i === 6 ? 'sat' : '') + '">' + w + '</th>'; });
    t += '</tr></thead><tbody><tr>';
    for(var b = 0; b < first; b++) t += '<td class="my-out"></td>';
    for(var d = 1; d <= n; d++){
      var iso = isoOf(y, m, d), wd = (first + d - 1) % 7;
      if(wd === 0 && d !== 1) t += '</tr><tr>';
      var kind = offKind(name, iso), mk = kind ? null : markOf(name, iso), oh = otHours(name, iso), loc = kind ? null : locOf(iso);
      if(kind){ offs++; if(kind !== "休") kinds[kind] = (kinds[kind] || 0) + 1; } else work++;
      ot += oh;
      var cls = 'shift-cell my-day' + (kind ? ' on' + kindClass(kind) : '') + (iso === boardIso ? ' board-col' : '') + (iso === today ? ' my-today' : '') + (mk ? ' work-mark' : '') +
        (wd === 0 ? ' my-sun' : wd === 6 ? ' my-sat' : '');
      t += '<td class="' + cls + '" data-d="' + iso + '">' +
        '<span class="my-d">' + d + '</span>' + (dayMarkOf(iso) ? '<span class="my-dm">' + escapeHtml(dayMarkOf(iso)) + '</span>' : '') +
        '<span class="my-s">' + (kind ? kind : escapeHtml(mk || '出勤')) + '</span>' +
        (loc ? '<span class="my-loc">' + escapeHtml(loc) + '</span>' : '') +
        (oh ? '<span class="my-ot">残' + fmtHours(oh) + '</span>' : '') +
        '</td>';
    }
    var last = (first + n) % 7;
    if(last) for(var a = last; a < 7; a++) t += '<td class="my-out"></td>';
    t += '</tr></tbody></table></div>';
    var kindTxt = Object.keys(kinds).map(function(k){ return k + kinds[k]; }).join('・');
    var sum = '<div class="my-sum">' +
      '<span>出勤 <b>' + work + '</b>日</span>' +
      '<span>休み <b>' + offs + '</b>日' + (kindTxt ? '（うち' + kindTxt + '）' : '') + '</span>' +
      (ot ? '<span>残業 <b>' + fmtHours(ot) + '</b>h</span>' : '') +
    '</div>';
    return h + sum + t + '<p class="shift-note">休みを入れていない日は「出勤」として表示します。配置場所は、その日のボードに置いたときだけ出ます。日付をタップすると、その日のボードを開きます。</p>';
  }

  function kindClass(kind){ return OFF_KIND_CLASS[kind] || ""; }

  function refreshShiftCounts(){
    if(shiftMode === "ot"){
      // 下の行：その日の残業の合計 / 名前の横：その月の残業の合計
      shiftBody.querySelectorAll("td.cnt").forEach(function(cell){
        var sum = 0;
        shiftPeople.forEach(function(name){ sum += otHours(name, cell.dataset.d); });
        cell.textContent = sum ? fmtHours(sum) : "";
      });
      shiftBody.querySelectorAll("tbody th.name-col").forEach(function(th){
        var off = th.querySelector(".off");
        if(!off) return;
        var total = otMonthTotal(shiftPeople[parseInt(th.dataset.i, 10)], shiftMonth.y, shiftMonth.m);
        off.textContent = "残" + fmtHours(total) + "h";
        var lv = otAlertLevel(total);
        if(lv){ off.classList.add("ot-lv", "ot-lv-" + lv); off.title = otAlertLabel(lv); }
      });
      return;
    }
    shiftBody.querySelectorAll("td.cnt").forEach(function(cell){
      var iso = cell.dataset.d, c = 0;
      shiftPeople.forEach(function(name){ if(!isOff(name, iso)) c++; });   // 出勤 = 全員 − 休み
      cell.textContent = c;
    });
    // 名前の横：その月の休みの日数
    var y = shiftMonth.y, m = shiftMonth.m, n = daysInMonth(y, m);
    shiftBody.querySelectorAll("tbody th.name-col").forEach(function(th){
      var off = th.querySelector(".off");
      if(!off) return;
      var name = shiftPeople[parseInt(th.dataset.i, 10)];
      var cnt = 0;
      for(var d = 1; d <= n; d++){ if(isOff(name, isoOf(y, m, d))) cnt++; }
      off.textContent = "休" + cnt;
    });
  }

  function shiftHasSelection(){
    return Object.keys(shiftSelRows).length + Object.keys(shiftSelCols).length > 0;
  }
  function selectedShiftNames(){
    return shiftPeople.filter(function(name){ return !!shiftSelRows[name]; });
  }
  // プレビュー用: 長い一覧は先頭だけ出し、「ほか○件を表示」を押すと全部を表示する（HTMLを返す）
  function expandableList(arr, max, sep){
    sep = sep || "、";
    if(arr.length <= max) return escapeHtml(arr.join(sep));
    return '<span class="imp-list">' + escapeHtml(arr.slice(0, max).join(sep)) +
      ' <button type="button" class="imp-more" data-full="' + escapeHtml(arr.join(sep)) + '">ほか' + (arr.length - max) + '件を表示</button></span>';
  }
  document.addEventListener("click", function(e){
    var btn = e.target && e.target.closest ? e.target.closest(".imp-more") : null;
    if(!btn) return;
    btn.parentNode.textContent = btn.getAttribute("data-full");
  });

  function limitedJoin(arr, max, sep){
    sep = sep || "・";
    if(arr.length <= max) return arr.join(sep);
    return arr.slice(0, max).join(sep) + " ほか" + (arr.length - max);
  }

  // 選択状態を表に反映（再描画せず、クラスとバーだけ更新するのでスクロール位置は保たれる）
  function refreshShiftSelection(){
    var has = shiftHasSelection();
    var tbl = shiftBody.querySelector(".shift-table");
    if(tbl) tbl.classList.toggle("has-sel", has);
    shiftBody.querySelectorAll("tbody th.name-col").forEach(function(th){
      th.classList.toggle("sel", !!shiftSelRows[shiftPeople[parseInt(th.dataset.i, 10)]]);
    });
    shiftBody.querySelectorAll("thead th[data-d]").forEach(function(th){
      th.classList.toggle("sel", !!shiftSelCols[th.dataset.d]);
    });
    shiftBody.querySelectorAll("td.shift-cell").forEach(function(td){
      var inRange = !!shiftSelRows[shiftPeople[parseInt(td.dataset.i, 10)]] || !!shiftSelCols[td.dataset.d];
      td.classList.toggle("in-range", has && inRange);
      td.classList.toggle("locked", !inRange);
    });
    var bar = document.getElementById("shiftRange");
    if(!bar) return;
    if(!has){
      bar.innerHTML = '<span>いまは閲覧のみ。名前か日付をタップすると、その行・列の' + (shiftMode === "ot" ? '残業' : '休み') + 'を入力できます。</span>';
      return;
    }
    var names = selectedShiftNames();
    var days = Object.keys(shiftSelCols).sort().map(function(iso){ return parseInt(iso.slice(8), 10) + "日"; });
    var parts = [];
    if(names.length) parts.push('行 <b>' + escapeHtml(limitedJoin(names, 3)) + '</b>');
    if(days.length) parts.push('列 <b>' + limitedJoin(days, 4) + '</b>');
    bar.innerHTML = '<span>入力範囲：' + parts.join('') + '</span>' +
      '<button type="button" class="btn-secondary btn-sm" id="shiftClearRange">解除</button>' +
      (days.length ? '<button type="button" class="btn-secondary btn-sm" id="shiftDayMarkBtn">日付の印</button>' : '') +
      (names.length && shiftMode === "off" ? '<button type="button" class="btn-secondary btn-sm" id="shiftPatternBtn">曜日でまとめて入力</button>' : '');
  }

  // 選んだ日付に印（短い文字）をつける・消す
  function openDayMarkModal(isos){
    if(!isos.length) return;
    var cur = dayMarkOf(isos[0]) || "";
    var same = isos.every(function(iso){ return (dayMarkOf(iso) || "") === cur; });
    var label = isos.length === 1 ? formatDateJP(isos[0]) : isos.length + "日分（" + limitedJoin(isos.map(mdOfISO), 4) + "）";
    var used = Object.create(null);
    Object.keys(state.dayMarks).forEach(function(iso){ used[state.dayMarks[iso]] = true; });
    var chips = Object.keys(used).slice(0, 8);
    openModal(function(box){
      box.innerHTML =
        '<div class="sheet-header"><span>日付の印</span></div>' +
        '<p class="confirm-msg">' + escapeHtml(label) + 'の日付の上に表示する文字です（' + DAY_MARK_MAX + '文字まで）。</p>' +
        '<input type="text" id="dayMarkInput" maxlength="' + DAY_MARK_MAX + '" autocomplete="off" value="' + escapeHtml(same ? cur : "") + '" placeholder="例: 棚">' +
        (chips.length ? '<div class="dm-chips">' + chips.map(function(c){ return '<button type="button" class="dm-chip" data-v="' + escapeHtml(c) + '">' + escapeHtml(c) + '</button>'; }).join('') + '</div>' : '') +
        '<div class="modal-actions">' +
          '<button class="btn-secondary" id="cancelBtn" type="button">キャンセル</button>' +
          '<button class="btn-secondary" id="clearBtn" type="button">印を消す</button>' +
          '<button class="btn-primary" id="okBtn" type="button">つける</button>' +
        '</div>';
      var input = box.querySelector("#dayMarkInput");
      function done(v){
        isos.forEach(function(iso){ setDayMark(iso, v); });
        scheduleSave(); closeModal(); renderShiftSheet(true); renderDateBar();
      }
      box.querySelectorAll(".dm-chip").forEach(function(b){ b.addEventListener("click", function(){ input.value = b.dataset.v; }); });
      box.querySelector("#cancelBtn").addEventListener("click", closeModal);
      box.querySelector("#clearBtn").addEventListener("click", function(){ done(null); });
      box.querySelector("#okBtn").addEventListener("click", function(){ done(input.value); });
    });
  }

  function openShiftPatternModal(names){
    if(!names.length) return;
    var y = shiftMonth.y, m = shiftMonth.m, n = daysInMonth(y, m);
    var title = names.length === 1 ? names[0] : (names.length + "人");
    openModal(function(box){
      box.innerHTML =
        '<div class="sheet-header"><span>' + escapeHtml(title) + 'のシフト</span></div>' +
        (names.length > 1 ? '<p class="confirm-msg" style="font-size:12px;color:var(--ink-soft);margin:0 0 10px;">' + escapeHtml(limitedJoin(names, 6)) + '</p>' : '') +
        '<label>' + m + '月に休みの曜日</label>' +
        '<div class="choice-row" id="wdChoice">' +
          WEEKDAYS.map(function(w, i){ return '<div class="choice-btn" style="min-width:0;padding:10px 0;" data-wd="' + i + '">' + w + '</div>'; }).join("") +
        '</div>' +
        '<p class="confirm-msg" style="font-size:12px;color:var(--ink-soft);">選んだ曜日で' + m + '月の休みを入れ替えます。何も選ばずに適用すると、' + m + '月の休みがすべて消えます。</p>' +
        '<div class="modal-actions"><button class="btn-danger" id="delShiftBtn" type="button">休みを全削除</button></div>' +
        '<div class="modal-actions">' +
          '<button class="btn-secondary" id="cancelBtn" type="button">キャンセル</button>' +
          '<button class="btn-primary" id="okBtn" type="button">適用</button>' +
        '</div>';
      var chosen = {};
      box.querySelectorAll("#wdChoice .choice-btn").forEach(function(btn){
        btn.addEventListener("click", function(){
          var w = btn.dataset.wd;
          if(chosen[w]){ delete chosen[w]; btn.classList.remove("selected"); }
          else { chosen[w] = true; btn.classList.add("selected"); }
        });
      });
      box.querySelector("#cancelBtn").addEventListener("click", closeModal);
      box.querySelector("#okBtn").addEventListener("click", function(){
        names.forEach(function(name){
          for(var d = 1; d <= n; d++){
            setOff(name, isoOf(y, m, d), !!chosen[new Date(y, m - 1, d).getDay()]);
          }
        });
        scheduleSave(); renderShiftSheet(true); renderAll(); closeModal();
      });
      box.querySelector("#delShiftBtn").addEventListener("click", function(){
        closeModal();
        openConfirmModal('「' + limitedJoin(names, 3) + '」の休みをすべて削除します（全期間）。', function(){
          names.forEach(function(name){ delete state.dayoffs[name]; });
          scheduleSave(); renderShiftSheet(true); renderAll();
        });
      });
    });
  }

  // ---------- Excel / CSV から休みを読み込む ----------
  // 対応: .xlsx（ライブラリなしでブラウザ内で読む）/ .csv / .tsv / Excelからコピーした貼り付け
  function normText(v){ return String(v == null ? "" : v).normalize("NFKC").replace(/\s+/g, ""); }

  function decodeText(buf){
    var text;
    try { text = new TextDecoder("utf-8", { fatal: true }).decode(buf); }
    catch(e){
      try { text = new TextDecoder("shift_jis").decode(buf); }   // ExcelのCSVはShift_JISのことが多い
      catch(e2){ text = new TextDecoder().decode(buf); }
    }
    return text.charCodeAt(0) === 0xFEFF ? text.slice(1) : text;

        if(timeCols && !person.time){
          person.time = normWorkTime(parseWorkTime(row[timeCols.s]), parseWorkTime(row[timeCols.e]));
        }
        // 同じ表記の行が続くのは結合セル（1人2行など）なので正常。表記の違う行が同じ人に当たったときだけ知らせる
        if(person.labels.indexOf(label) === -1){
          person.labels.push(label);
          if(hit.fuzzy) fuzzy.push(label + "→" + hit.name);
          if(person.labels.length === 2) dupNames.push(hit.name + "（" + person.labels.join("・") + "）");
        }
        var offs = person.offs;
        cols.forEach(function(dc){
          // 残業の読み込み: マスの値を時間として読む（休みの記号の代わり）
          if(opts.readValue){
            var rawV = row[dc.c];
            if(normText(rawV) === "") return;
            var hv = opts.readValue(rawV);
            if(hv === null){ var key0 = String(rawV).trim().slice(0, 6); otherMarks[key0] = (otherMarks[key0] || 0) + 1; return; }
            if(hv > 0 && !(dc.iso in offs)){ offs[dc.iso] = hv; offCount++; }
            return;
          }
          var val = normText(row[dc.c]).toLowerCase(), off = false, tk = null;
          if(val === ""){ off = opts.blank; if(off) tk = "空欄"; }
          else {
            opts.tokens.some(function(t){ if(val.indexOf(t) !== -1){ tk = t; return true; } return false; });
            off = !!tk;
            if(!off){
              // 出勤として読む記号（「冷」など）。休みの記号も一緒に書いてあるマスは休みを優先する
              var wk = null;
              (opts.workTokens || []).some(function(t){ if(val.indexOf(t) !== -1){ wk = t; return true; } return false; });
              if(wk){
                workHits[wk] = (workHits[wk] || 0) + 1;
                if(!person.marks[dc.iso]) person.marks[dc.iso] = cleanMark(normText(row[dc.c]));   // シフト表に表示する
              }
              else { var key = String(row[dc.c]).trim().slice(0, 4); otherMarks[key] = (otherMarks[key] || 0) + 1; }
            }
          }
          if(off){
            tokenHits[tk] = (tokenHits[tk] || 0) + 1;
            var kind = tokenKind(tk);
            if(!offs[dc.iso]){ offs[dc.iso] = kind; offCount++; }
            else if(offs[dc.iso] === "休" && kind !== "休") offs[dc.iso] = kind;   // 2段の表などでは有・指を優先
          }
        });
      }
      return { cols: cols, people: people, unmatched: unmatched, fuzzy: fuzzy, offCount: offCount,
               hdr: hdr, nameCol: nameCol, firstDataRow: firstDataRow, sheetMonth: sheetMonth,
               tokenHits: tokenHits, otherMarks: otherMarks, workHits: workHits, dupNames: dupNames };
    }

    var best = null;
    candidates.forEach(function(nc){
      var res = readWithNameCol(nc);
      if(!best || res.offCount > best.offCount ||
         (res.offCount === best.offCount && res.people.length > best.people.length)) best = res;
    });
    if(best){
      best.timeCols = timeCols;
      var dm = detectDayMarks(rows, hdr, cols, monthOf);
      best.dayMarks = dm.marks; best.dayMarkRows = dm.rows; best.dayMarkCell = dm.cell;
    }
    return best;
  }
  // 日付の印は「月の行」（F4 の「9」のように月が書いてあるセルの行）に書いてある文字だけを読む。
  // 月の行は、日付の見出しより上（6行まで）で、日付の列の右端までに月（「9」「9月」「2026年9月」）があるいちばん近い行。
  // 数字だけの月（「9」）は、数字がいくつも並ぶ行（週の番号など）では月とみなさない。
  // 月のセル・年や月の見出し・数字だけのセルは印にしない。
  // 月のセルを探す。日付の見出しより上（10行まで）を下から見て、
  //  1. 数字だけの月（F4 の「9」など）のいちばん近いセル
  //  2. なければ「9月」「2026年9月」のセル
  // の順に選ぶ。数字がたくさん並ぶ行（週の番号など）の数字は月とみなさない。
  function findMonthCell(rows, hdr, lastC, monthOf){
    var labelHit = null;
    for(var r = hdr - 1; r >= Math.max(0, hdr - 10); r--){
      var row = rows[r] || [], nums = 0;
      for(var c0 = 0; c0 <= lastC; c0++){ if(/^\d+$/.test(normText(row[c0]))) nums++; }
      // 「9」と表示されていても中身は日付（2026/9/1 を「m」の書式で表示）のことがあるので、
      // 日付として読めるセルが1〜2個だけの行なら、その日付の月を月のセルとして使う
      var dateCells = [];
      for(var c1 = 0; c1 <= lastC; c1++){ var ph = parseHeaderCell(row[c1]); if(ph && ph.y) dateCells.push({ c: c1, p: ph }); }
      if(dateCells.length >= 1 && dateCells.length <= 2) return { r: r, c: dateCells[0].c, y: dateCells[0].p.y, m: dateCells[0].p.m };
      for(var c = 0; c <= lastC; c++){
        var t = normText(row[c]), mv = t === "" ? null : monthOf(row[c]);
        if(!mv) continue;
        if(/^\d+$/.test(t)){
          if(nums > 5) continue;
          return { r: r, c: c, y: mv.y, m: mv.m };
        }
        if(!labelHit) labelHit = { r: r, c: c, y: mv.y, m: mv.m };
      }
    }
    return labelHit;
  }
  function detectDayMarks(rows, hdr, cols, monthOf){
    var marks = Object.create(null), cell = findMonthCell(rows, hdr, cols[cols.length - 1].c, monthOf);
    if(!cell) return { marks: marks, rows: [], cell: null };
    var mr = cell.r, mc = cell.c;
    var mrow = rows[mr] || [], any = false;
    cols.forEach(function(dc){
      if(dc.c === mc) return;                                                            // 月のセル
      var t = normText(mrow[dc.c]);
      if(t === "" || /^[\d.,:\-\/]+$/.test(t)) return;
      if(/年/.test(t) || /^\d{1,2}月度?$/.test(t) || /^(令和|平成|R)\d/.test(t)) return;  // 年・月の見出し
      var v = cleanDayMark(mrow[dc.c]);
      if(v){ marks[dc.iso] = v; any = true; }
    });
    return { marks: marks, rows: any ? [mr] : [], cell: mc >= 0 ? colLetter(mc) + (mr + 1) : null, row: mr };
  }

  // 読み込んだ休み（Excel/CSV・共有コード共通）をシフト表に反映する。反映直後の画面から元に戻せる。
  // res = { cols:[{iso}], people:[{name, offs:{iso:true}}], offCount }
  // ---------- 残業の表を読む ----------
  // マスの値を時間にする。読めなければ null、0や「-」は 0。
  // 対応: 2 / 1.5 / 1:30 / 1時間30分 / 90分 / 1.5h / Excelの時刻（1日=1の小数。あとでまとめて判定）
  function readOvertimeCell(v){
    var t = normText(v).toLowerCase().replace(/[hｈ]$/, "");
    if(t === "" || t === "-" || t === "ー" || t === "―") return 0;
    var mm;
    if((mm = t.match(/^(\d{1,2}):(\d{1,2})(?::\d{1,2})?$/))) return +mm[1] + (+mm[2]) / 60;
    if((mm = t.match(/^(\d+(?:\.\d+)?)時間(?:(\d{1,2})分)?$/))) return +mm[1] + (mm[2] ? +mm[2] / 60 : 0);
    if((mm = t.match(/^(\d{1,3})分$/))) return +mm[1] / 60;
    // ふつうの数字。Excelのファイルの中では、小さい数が「6.25E-2」（= 0.0625 = 1:30）のような
    // 指数の形で保存されていることがあるので、その形も読む
    if(/^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/.test(t)){ var n = parseFloat(t); return isFinite(n) ? n : null; }
    return null;
  }
  // 読んだ値の仕上げ。すべて1未満で15分単位にならない値があれば「Excelの時刻（1日=1）」とみなして24倍する。
  // そのあと15分単位にそろえ、上限を超える値は読み込まない。
  // Excelの時刻（1:30 と表示されるセル）は、中身が「1日 = 1」の小数（1:30 = 0.0625）。
  // 1マスずつ判定する（「1:30」と文字で書いたマスと、時刻のマスが混ざっていても読めるように）:
  //   1未満で15分単位にならない値 → 時刻なので24倍
  //   1未満で15分単位の値（0.25 / 0.5 / 0.75）→ 表の1未満の値の多くが時刻なら24倍（6:00 / 12:00 / 18:00）、そうでなければ時間のまま
  //   1以上 → 時間のまま
  function finalizeOvertimeResult(res){
    function isQuarter(v){ return Math.abs(v * 4 - Math.round(v * 4)) < 0.01; }
    var small = [];
    res.people.forEach(function(pp){ Object.keys(pp.offs).forEach(function(iso){ if(pp.offs[iso] < 1) small.push(pp.offs[iso]); }); });
    var nonQuarter = small.filter(function(v){ return !isQuarter(v); }).length;
    var serialMode = nonQuarter > 0 && nonQuarter * 2 >= small.length;
    var count = 0, total = 0, over = 0, converted = 0;
    res.people.forEach(function(pp){
      Object.keys(pp.offs).forEach(function(iso){
        var raw = pp.offs[iso], toHours = raw < 1 && (!isQuarter(raw) || serialMode);
        if(toHours) converted++;
        var h = raw * (toHours ? 24 : 1);
        h = Math.round(h / OT_STEP) * OT_STEP;
        if(h > OT_MAX){ over++; delete pp.offs[iso]; return; }
        if(h <= 0){ delete pp.offs[iso]; return; }
        pp.offs[iso] = h; count++; total += h;
      });
    });
    res.offCount = count; res.otTotal = total; res.otSerial = converted > 0; res.otOver = over;
    return res;
  }
  // 読み込んだ残業を反映する。読み込んだ人の、表の日付の範囲は置き換え（表で空のマスは残業なしになる）
  function applyOvertimeImport(res){
    var backup = JSON.parse(JSON.stringify(state.overtime));
    res.people.forEach(function(pp){
      (pp.cols || res.cols).forEach(function(dc){ setOvertime(pp.name, dc.iso, pp.offs[dc.iso] || 0); });
    });
    var first = res.cols[0].iso;
    shiftMonth = { y: parseInt(first.slice(0, 4), 10), m: parseInt(first.slice(5, 7), 10) };
    shiftMode = "ot";
    shiftSelRows = Object.create(null); shiftSelCols = Object.create(null);
    scheduleSave(); renderShiftSheet(false); renderAll();
    closeModal();
    openModal(function(b2){
      b2.innerHTML =
        '<div class="sheet-header"><span>読み込みました</span></div>' +
        '<p class="confirm-msg">' + res.people.length + '人・' + res.cols.length + '日分の残業（' + res.offCount + 'マス・合計' + fmtHours(res.otTotal) + '時間）を反映しました。</p>' +
        '<div class="modal-actions">' +
          '<button class="btn-secondary" id="undoBtn" type="button">元に戻す</button>' +
          '<button class="btn-primary" id="doneBtn" type="button">閉じる</button>' +
        '</div>';
      b2.querySelector("#doneBtn").addEventListener("click", closeModal);
      b2.querySelector("#undoBtn").addEventListener("click", function(){
        state.overtime = backup;
        scheduleSave(); renderShiftSheet(true); renderAll(); closeModal();
      });
    });
  }

  // ---------- 複数ファイルを合わせる ----------
  // 同じ人が複数のファイルに出てくるとき（場所を交代しながら勤務している人など）は
  //   休み: 基準（マスター）のファイルのシフトだけを使う。基準のファイルに載っていなければ、先に選んだファイル。
  //   残業: 値があるファイルの値を使う。複数にあれば大きいほう。
  // parts = [{ label, res, entryIdx }]（res は analyzeShiftRows の結果）、masterEntryIdx = 基準のファイルの番号
  function mergeImportResults(parts, isOT, masterEntryIdx){
    var byName = Object.create(null), order = [], allIso = Object.create(null);
    var unmatched = [], fuzzy = [], dupNames = [], tokenHits = Object.create(null), otherMarks = Object.create(null), workHits = Object.create(null);
    function addCounts(dst, src){ Object.keys(src || {}).forEach(function(k){ dst[k] = (dst[k] || 0) + src[k]; }); }
    var dayMarks = Object.create(null), dayMarkRows = [], dayMarkCell = null;
    // 日付の印は基準のシートからだけ読む（ほかのシートの別の行の文字が混ざらないように）
    var masterPart = parts.filter(function(pt){ return pt.entryIdx === masterEntryIdx; })[0] || parts[0];
    if(masterPart){
      Object.keys(masterPart.res.dayMarks || {}).forEach(function(iso){ dayMarks[iso] = masterPart.res.dayMarks[iso]; });
      dayMarkRows = masterPart.res.dayMarkRows || [];
      dayMarkCell = masterPart.res.dayMarkCell || null;
    }
    parts.forEach(function(part, idx){
      var res = part.res;
      res.cols.forEach(function(dc){ allIso[dc.iso] = true; });
      res.people.forEach(function(pp){
        if(!byName[pp.name]){ byName[pp.name] = []; order.push(pp.name); }
        byName[pp.name].push({ idx: idx, offs: pp.offs, marks: pp.marks, cols: res.cols, time: pp.time || null });
      });
      res.unmatched.forEach(function(n){ if(unmatched.indexOf(n) === -1) unmatched.push(n); });
      res.fuzzy.forEach(function(n){ if(fuzzy.indexOf(n) === -1) fuzzy.push(n); });
      dupNames = dupNames.concat(res.dupNames);
      addCounts(tokenHits, res.tokenHits); addCounts(otherMarks, res.otherMarks); addCounts(workHits, res.workHits);
    });
    var people = [], multiNames = [], conflicts = 0, offCount = 0;
    order.forEach(function(name){
      var list = byName[name];
      if(list.length === 1){
        people.push({ name: name, offs: list[0].offs, marks: list[0].marks, cols: list[0].cols, time: list[0].time });
        offCount += Object.keys(list[0].offs).length;
        return;
      }
      if(!isOT){
        var chosen = list.filter(function(x){ return parts[x.idx].entryIdx === masterEntryIdx; })[0] || list[0];
        multiNames.push(name + "（" + list.map(function(x){ return parts[x.idx].label; }).join("・") + " → " + parts[chosen.idx].label + "を使用）");
        people.push({ name: name, offs: chosen.offs, marks: chosen.marks, cols: chosen.cols, time: chosen.time || (list.filter(function(x){ return x.time; })[0] || {}).time || null });
        offCount += Object.keys(chosen.offs).length;
        return;
      }
      multiNames.push(name + "（" + list.map(function(x){ return parts[x.idx].label; }).join("・") + "）");
      var isoSet = Object.create(null);
      list.forEach(function(x){ x.cols.forEach(function(dc){ isoSet[dc.iso] = true; }); });
      var isos = Object.keys(isoSet).sort(), offs = Object.create(null);
      isos.forEach(function(iso){
        var vals = list.map(function(x){ return x.offs[iso]; }).filter(function(v){ return !!v; });
        if(!vals.length) return;
        if(vals.length > 1) conflicts++;
        offs[iso] = Math.max.apply(null, vals);
        offCount++;
      });
      people.push({ name: name, offs: offs, cols: isos.map(function(iso){ return { iso: iso }; }) });
    });
    return {
      cols: Object.keys(allIso).sort().map(function(iso){ return { iso: iso }; }),
      people: people, offCount: offCount, unmatched: unmatched, fuzzy: fuzzy, dupNames: dupNames,
      tokenHits: tokenHits, otherMarks: otherMarks, workHits: workHits,
      multiNames: multiNames, conflicts: conflicts, multi: true, dayMarks: dayMarks, dayMarkRows: dayMarkRows, dayMarkCell: dayMarkCell
    };
  }

  function applyShiftImport(res){
    syncPlacementsToDay();
    var backup = JSON.parse(JSON.stringify(state.dayoffs)), backupPl = JSON.parse(JSON.stringify(state.dayPlacements)),
        backupMarks = JSON.parse(JSON.stringify(state.workMarks)), backupDayMarks = JSON.parse(JSON.stringify(state.dayMarks));
    // 日付の印は、表に印の行があったときだけ、その日付の範囲を置き換える（印の行がない表で手入力の印を消さないため）
    var dmCount = Object.keys(res.dayMarks || {}).length;
    if(dmCount || res.dayMarksReplace){   // 共有コードに印が入っていたときは、その期間の印をコードの内容にそろえる
      res.cols.forEach(function(dc){ setDayMark(dc.iso, res.dayMarks[dc.iso] || null); });

    res.people.forEach(function(pp){
      (pp.cols || res.cols).forEach(function(dc){   // 複数ファイルのときは、その人が載っていたファイルの日付だけ
        var v = pp.offs[dc.iso];
        setOff(pp.name, dc.iso, !!v, v ? normalizeOffKind(v) : undefined);
        setMark(pp.name, dc.iso, (!v && pp.marks && pp.marks[dc.iso]) || null);
      });
    });
    var first = res.cols[0].iso;
    shiftMonth = { y: parseInt(first.slice(0, 4), 10), m: parseInt(first.slice(5, 7), 10) };
    shiftSelRows = Object.create(null); shiftSelCols = Object.create(null);

    closeModal();
    openModal(function(b2){
      b2.innerHTML =
        '<div class="sheet-header"><span>読み込みました</span></div>' +

          (res.people.filter(function(pp){ return pp.time; }).length ? '・勤務時間' + res.people.filter(function(pp){ return pp.time; }).length + '人分' : '') + 'を反映しました。</p>' +
        '<div class="modal-actions">' +
          '<button class="btn-secondary" id="undoBtn" type="button">元に戻す</button>' +
          '<button class="btn-primary" id="doneBtn" type="button">閉じる</button>' +
        '</div>';
      b2.querySelector("#doneBtn").addEventListener("click", closeModal);
      b2.querySelector("#undoBtn").addEventListener("click", function(){
        state.dayoffs = backup; state.dayPlacements = backupPl; state.workMarks = backupMarks; state.dayMarks = backupDayMarks; state.workTimes = backupTimes;
        loadPlacementsForDay(state.boardDate); renderDateBar();
        scheduleSave(); renderShiftSheet(true); renderAll(); closeModal();
      });
    });
  }

  // ---------- シフト（休み）の共有コード ----------
  // 形式: "P5:" + base64(gzip( 開始日 FS 終了日 GS 名前 FS 休み(開始日からの日数,…) RS … ))
  // 読み込むと、コードに含まれる人の「その期間」の休みが置き換わる（期間の外・コードにない人はそのまま）。
  var SHIFT_CODE_PREFIX = "P5:";
  function isoToDayNum(iso){ var p = iso.split("-"); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000); }
  function dayNumToISO(n){ var d = new Date(n * 86400000); return isoOf(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }

  function allDayoffRange(){
    var min = null, max = null, names = Object.create(null);
    state.nameplates.forEach(function(np){ names[np.name] = true; });
    Object.keys(state.dayoffs).forEach(function(name){
      if(!names[name]) return;
      Object.keys(state.dayoffs[name]).forEach(function(iso){
        if(min === null || iso < min) min = iso;
        if(max === null || iso > max) max = iso;
      });
    });
    return min ? { start: min, end: max } : null;
  }

  // 共有コードに入れる名前（重複なし・番号順）。people を渡すとその人だけに絞れる（人数を分けて共有するため）。
  function distinctShiftNames(){
    var seen = Object.create(null), out = [];
    sortByNumber(state.nameplates).forEach(function(np){
      if(!seen[np.name]){ seen[np.name] = true; out.push(np.name); }
    });
    return out;
  }
  // 共有コードに入れる日付の印（期間内のもの）
  function shiftCodeDayMarks(startISO, endISO){
    return Object.keys(state.dayMarks).filter(function(iso){ return iso >= startISO && iso <= endISO; }).sort()
      .map(function(iso){ return { iso: iso, v: state.dayMarks[iso] }; });
  }
  async function encodeShiftCode(startISO, endISO, people){
    var s = isoToDayNum(startISO), e = isoToDayNum(endISO), recs = [];
    (people || distinctShiftNames()).forEach(function(name){
      var m = getDayoffs(name), offs = [];
      if(m){
        Object.keys(m).forEach(function(iso){
          var n = isoToDayNum(iso);
          if(n >= s && n <= e) offs.push({ n: n - s, k: offKind(name, iso) });
        });
      }
      offs.sort(function(a, b){ return a.n - b.n; });
      // 休は日数だけ、ほかの種類は「3有」「5*」のように後ろに付ける（古い版は数字だけ読むので「休」として取り込める）
      // 出勤の記号は「5=冷」の形で後ろに付ける（古い版はこの形を読み飛ばすので影響しない）
      var mk = Object.prototype.hasOwnProperty.call(state.workMarks, name) ? state.workMarks[name] : null, marks = [];
      if(mk){
        Object.keys(mk).forEach(function(iso){
          var n = isoToDayNum(iso);
          if(n >= s && n <= e && !isOff(name, iso)) marks.push({ n: n - s, t: cleanMark(mk[iso]) });
        });
      }
      marks.sort(function(a, b){ return a.n - b.n; });
      // 勤務時間は3つめの項目に「開始の分-終了の分」で入れる（古い版は2つめまでしか読まないので影響しない）
      var wt = workTimeOf(name);
      recs.push(name + FS + offs.map(function(o){ return o.n + (o.k === "休" ? "" : o.k); })
        .concat(marks.filter(function(o){ return o.t; }).map(function(o){ return o.n + "=" + o.t; })).join(",") +
        (wt ? FS + wt.s + "-" + wt.e : ""));
    });
    var payload = startISO + FS + endISO + GS + recs.join(RS);
    // 日付の印は3つめの区切りに「日数 FS 文字」で入れる（古い版は2つめまでしか読まないので影響しない）
    var dms = shiftCodeDayMarks(startISO, endISO);
    if(dms.length) payload += GS + dms.map(function(d){ return (isoToDayNum(d.iso) - s) + FS + d.v; }).join(RS);
    if(typeof CompressionStream !== "undefined"){
      var stream = new Blob([new TextEncoder().encode(payload)]).stream().pipeThrough(new CompressionStream("gzip"));
      var compressed = new Uint8Array(await new Response(stream).arrayBuffer());

  async function decodeShiftCode(code){
    var trimmed = fixCodePrefix((code || "").replace(/\s+/g, ""));   // チャットで折り返されていても読めるように
    if(trimmed.indexOf("P3:") === 0 || trimmed.indexOf("P4:") === 0 || trimmed.indexOf(PLACEMENT_CODE_PREFIX) === 0){
      throw new Error("これはテンプレート／配置のコードです。シフトの共有コード（P5: で始まる）を貼り付けてください。");
    }
    if(trimmed.indexOf("P6:") === 0){
      throw new Error("これは残業の共有コードです。「残業」に切り替えてから読み込んでください。");
    }
    if(trimmed.indexOf(SHIFT_CODE_PREFIX) !== 0){
      throw new Error("シフトの共有コード（P5: で始まる）を全体貼り付けてください。");
    }
    var payload;
    try{
      var binary = atob(trimmed.slice(SHIFT_CODE_PREFIX.length));

    }

    var iso = /^\d{4}-\d{2}-\d{2}$/;
    if(head.length < 2 || !iso.test(head[0]) || !iso.test(head[1])) throw new Error("コードの中身が正しくありません。");
    var s = isoToDayNum(head[0]), e = isoToDayNum(head[1]);
    if(!(e >= s) || e - s > 800) throw new Error("コードの中身が正しくありません。");

      var f = rec.split(FS), offs = Object.create(null), marks = Object.create(null);
      (f[1] || "").split(",").forEach(function(x){
        var mm = /^(\d+)=(.{1,3})$/.exec(x);
        if(mm){
          var mn = parseInt(mm[1], 10);
          if(mn >= 0 && s + mn <= e) marks[dayNumToISO(s + mn)] = cleanMark(mm[2]);
          return;
        }
        var mt = /^(\d+)(有|指|欠|健|\*)?$/.exec(x);
        if(!mt) return;

  }

  // ---------- 残業の共有コード ----------
  // 形式: "P6:" + base64(gzip( 開始日 FS 終了日 GS 名前 FS 日数:時間,日数:時間… RS … ))

  var OT_CODE_PREFIX = "P6:";

    var min = null, max = null, names = Object.create(null);
    state.nameplates.forEach(function(np){ names[np.name] = true; });
    Object.keys(state.overtime).forEach(function(name){
      if(!names[name]) return;
      Object.keys(state.overtime[name]).forEach(function(iso){
        if(min === null || iso < min) min = iso;

  }
  async function packCode(prefix, payload){
    if(typeof CompressionStream !== "undefined"){
      var stream = new Blob([new TextEncoder().encode(payload)]).stream().pipeThrough(new CompressionStream("gzip"));
      return prefix + bytesToBase64(new Uint8Array(await new Response(stream).arrayBuffer()));

  async function encodeOvertimeCode(startISO, endISO, people){
    var s = isoToDayNum(startISO), e = isoToDayNum(endISO), recs = [];

      if(m){

        });

      items.sort(function(a, b){ return a.n - b.n; });
      recs.push(name + FS + items.map(function(o){ return o.n + ":" + fmtHours(o.h); }).join(","));

    }
    if(trimmed.indexOf("P3:") === 0 || trimmed.indexOf("P4:") === 0 || trimmed.indexOf(PLACEMENT_CODE_PREFIX) === 0){
      throw new Error("これはテンプレート／配置のコードです。残業の共有コード（P6: で始まる）を貼り付けてください。");
    }
    if(trimmed.indexOf(OT_CODE_PREFIX) !== 0){

    }
    var payload;
    try{
      var binary = atob(trimmed.slice(OT_CODE_PREFIX.length));
      var bytes = Uint8Array.from(binary, function(c){ return c.charCodeAt(0); });
      if(bytes.length >= 2 && bytes[0] === 0x1f && bytes[1] === 0x8b && typeof DecompressionStream !== "undefined"){
        var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        payload = new TextDecoder().decode(await new Response(stream).arrayBuffer());
      } else {
        payload = decodeURIComponent(escape(binary));
      }
    }catch(e){
      throw new Error("コードの形式が正しくありません。コピーし直してください。");
    }
    var sections = payload.split(GS), head = sections[0].split(FS);
    var iso = /^\d{4}-\d{2}-\d{2}$/;
    if(head.length < 2 || !iso.test(head[0]) || !iso.test(head[1])) throw new Error("コードの中身が正しくありません。");
    var s = isoToDayNum(head[0]), e = isoToDayNum(head[1]);
    if(!(e >= s) || e - s > 800) throw new Error("コードの中身が正しくありません。");
    var people = (sections[1] || "").length === 0 ? [] : sections[1].split(RS).map(function(rec){
      var f = rec.split(FS), offs = Object.create(null);
      (f[1] || "").split(",").forEach(function(x){
        var mt = /^(\d+):(\d+(?:\.\d+)?)$/.exec(x);
        if(!mt) return;
        var n = parseInt(mt[1], 10), h = Math.round(parseFloat(mt[2]) / OT_STEP) * OT_STEP;
        if(n >= 0 && s + n <= e && h > 0 && h <= OT_MAX) offs[dayNumToISO(s + n)] = h;
      });
      return { name: cleanText(f[0], LIMITS.nameplateName), offs: offs };
    }).filter(function(pp){ return pp.name; });

  }

  // ---------- QRコード（共有コードの表示・読み取り） ----------
  // QRコードを画面いっぱいに表示する。どこかをタップすると閉じる

  function renderShareQR(box, text, label){
    if(!box) return;
    box.innerHTML = "";
    if(!text){ box.hidden = true; return; }
    if(typeof QRCode !== "function"){
      showQRMessage(box, "QRコードを作る部品（qrcode.js）が読み込めていません。コピーか「共有…」で送ってください。");
      return;
    }

    var C = QRCode.CorrectLevel;
    var levels = text.length > 900 ? [C.L] : text.length > 500 ? [C.M, C.L] : [C.Q, C.M, C.L];
    for(var li = 0; li < levels.length; li++){
      if(buildShareQR(box, text, levels[li], label)) return;
    }
    showQRMessage(box, "コードが長すぎてQRコードにできませんでした（" + text.length + "文字）。" +
      "共有する期間を「表示中の月」にすると短くなります。または、コピーか「共有…」で送ってください。");

  // QRの代わりに案内を出す（何も出ないと、表示されていないのか分からないため）

  }
  function buildShareQR(box, text, level, label){
    box.innerHTML = "";

      // 画面外に作ってから、白いクワイエットゾーン（余白）を付けて box に差し込む。
      // ライブラリはモジュールいっぱいに描くだけで余白を付けないため、余白なしの画像を
      // 保存・書き出しすると実機のカメラで読み取れないことがある。
      // 文字数が多い（＝マス目が細かい）ときに潰れないよう、先に小さく作ってマス数を調べ、
      // 1マスが最低4pxになる大きさで作り直す。
      var helper = document.createElement("div");
      var probe = new QRCode(helper, { text: text, width: 64, height: 64, correctLevel: level, colorDark: "#000000", colorLight: "#ffffff" });
      var modules = (probe._oQRCode && probe._oQRCode.getModuleCount) ? probe._oQRCode.getModuleCount() : 21;
      var size = Math.min(640, Math.max(176, modules * 4));
      helper.innerHTML = "";
      var qr = new QRCode(helper, { text: text, width: size, height: size, correctLevel: level, colorDark: "#000000", colorLight: "#ffffff" });
      var srcCanvas = helper.querySelector("canvas");
      var quiet = modules ? Math.ceil(size / modules) * 4 : 16;   // 4モジュール分の余白
      var padded = document.createElement("canvas");
      padded.width = size + quiet * 2; padded.height = size + quiet * 2;
      var ctx = padded.getContext("2d");
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, padded.width, padded.height);
      if(srcCanvas) ctx.drawImage(srcCanvas, quiet, quiet, size, size);
      var img = document.createElement("img");
      img.alt = "QRコード（タップで大きく表示）";
      img.src = padded.toDataURL("image/png");
      img.addEventListener("click", function(){ openQRZoom(img.src, label); });
      box.appendChild(img);

      var zoomBtn = document.createElement("button");

      zoomBtn.textContent = "QRを大きく表示";
      zoomBtn.addEventListener("click", function(){ openQRZoom(img.src, label); });
      box.appendChild(zoomBtn);
      box.hidden = false;
    }catch(e){
      box.innerHTML = "";
      return false;   // 長すぎるなど、このレベルではQRコードにできない
    }
    return true;
  }

  // 選んだ画像ファイル（スクショや保存した写真）からQRコードを探す。見つからなければ null を返す（Promise）
  function loadImageForQR(file){

    }

      var canvas = document.createElement("canvas"), ctx = canvas.getContext("2d", { willReadFrequently: true });

      if(mode === "native"){

        return detector.detect(canvas).then(function(codes){

  var qrScanOverlay = null, qrScanVideo = null, qrScanStatus = null, qrScanStream = null, qrScanRAF = null, qrScanCb = null;

  function addQRScanButton(container, onText){

  // mode: "off"（シフトの休み・既定）/ "ot"（残業）

  function openShiftReceiveModal(mode){
    var isOT = mode === "ot", what = isOT ? "残業" : "休み", kindName = isOT ? "残業" : "シフト";
    var decoded = null, token = 0;
    openModal(function(box){
      box.innerHTML =

        '<div id="shiftScanQRRow"></div>' +

        '<div class="modal-actions">' +

      function setPreview(html, isErr){ pv.innerHTML = html; pv.classList.toggle("err", !!isErr); }

      area.addEventListener("input", async function(){
        var my = ++token;
        decoded = null; okBtn.disabled = true;
        if(!area.value.trim()){ setPreview(kindName + "の共有コードを貼り付けてください。"); return; }
        var code;
        try{ code = await (isOT ? decodeOvertimeCode : decodeShiftCode)(area.value); }
        catch(err){ if(my === token) setPreview(escapeHtml(err.message), true); return; }
        if(my !== token) return;
        var match = buildNameMatcher(), people = [], unmatched = [], fuzzy = [], offCount = 0, otTotal = 0;
        code.people.forEach(function(pp){
          var hit = match(pp.name);
          if(!hit){ unmatched.push(pp.name); return; }
          if(hit.fuzzy) fuzzy.push(pp.name + "→" + hit.name);
          offCount += Object.keys(pp.offs).length;
          if(isOT) Object.keys(pp.offs).forEach(function(k){ otTotal += pp.offs[k]; });
          people.push({ name: hit.name, offs: pp.offs, marks: pp.marks, time: pp.time || null });
        });
        if(!people.length){
          setPreview("ボードの名前と一致する人がいませんでした。" + (unmatched.length ? "<br>コードの名前: <b>" + expandableList(unmatched, 6) + "</b>" : ""), true);
          return;
        }
        var cols = [], s = isoToDayNum(code.start), e = isoToDayNum(code.end);
        for(var n = s; n <= e; n++){ cols.push({ iso: dayNumToISO(n) }); }
        decoded = { cols: cols, people: people, offCount: offCount, otTotal: otTotal };
        if(!isOT && code.hasDayMarks){ decoded.dayMarks = code.dayMarks; decoded.dayMarksReplace = true; }
        okBtn.disabled = false;
        var html = '<b>' + people.length + '人</b> × <b>' + cols.length + '日</b>（' + mdOfISO(code.start) + '〜' + mdOfISO(code.end) + '）／' + what + ' <b>' + offCount + '</b>マス' +
          (isOT ? '・合計 <b>' + fmtHours(otTotal) + '</b>時間' : '');
        if(fuzzy.length) html += '<br>近い名前で照合: ' + expandableList(fuzzy, 3);
        if(unmatched.length) html += '<br>ボードに同じ名前がなく、読み込まない人: ' + expandableList(unmatched, 6);
        var wtN = people.filter(function(pp){ return pp.time; }).length;
        if(!isOT && wtN) html += '<br>勤務時間: <b>' + wtN + '人分</b>（その人の時間が置き換わります）';
        if(decoded.dayMarksReplace){
          var dmN = Object.keys(decoded.dayMarks).length;
          html += '<br>日付の印: <b>' + dmN + '日分</b>（この期間の印は置き換わります）';
        }
        html += '<br>読み込んだ人の、この期間の' + what + 'が置き換わります。';
        setPreview(html, false);
      });
      box.querySelector("#cancelBtn").addEventListener("click", closeModal);
      okBtn.addEventListener("click", function(){ if(decoded){ if(isOT) applyOvertimeImport(decoded); else applyShiftImport(decoded); } });
      // 開いた直後にキーボードが出てQR読み取りボタンが隠れないよう、自動でフォーカスしない
    });
  }

  // スマホでクラウド上のファイル（Googleドライブ、メールやLINEの添付など）を選ぶと、
  // 端末へのダウンロードが終わる前や、読む権限が切れたときに読み取りに失敗することがあるので、少し待って1回だけ読み直す
  async function readFileBuffer(f){
    try{ return await f.arrayBuffer(); }
    catch(err){
      if(err && err.name === "NotReadableError"){
        await new Promise(function(r){ setTimeout(r, 800); });
        return await f.arrayBuffer();
      }
      throw err;
    }
  }
  function fileReadErrorMessage(err){
    if(err && err.name === "NotReadableError"){
      return "ファイルを読み取れませんでした。Googleドライブやメール・LINEなどから直接選ぶと起きることがあります。" +
        "一度スマホに保存（ダウンロード）してから「ファイル」アプリの中から選び直すか、Excelでセルをコピーして下の欄に貼り付けてください。";
    }
    return (err && err.message) || "読み込めませんでした。";
  }

  // mode: "off"（休み・既定）/ "ot"（残業）
  // ファイルは複数選べる（1回でまとめて選ぶか、1つずつ追加）。Excelはシートごと（場所・部署ごと）に読み、
  // ボードの名前が載ったシートをそれぞれ1つの読み込み元にする。2つ以上なら mergeImportResults で合わせる。
  var IMPORT_MAX_FILES = 5, IMPORT_MAX_SOURCES = 20;
  // 休みとして読む記号・出勤として読む記号（画面では変えない。変えるときはここを書き換える）。
  // 休みの記号はマスの中に含まれていれば休み（「健診」「欠勤」なども）。それ以外の記号は出勤
  var IMPORT_OFF_TOKENS = ["休", "有", "指", "*", "健診", "欠"];
  var IMPORT_WORK_TOKENS = ["冷"];   // シフト表にもこの記号を表示する
  var FILE_MARKS = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳".split("");
  function openShiftImportModal(mode){
    var isOT = mode === "ot", what = isOT ? "残業" : "休み";
    var y0 = shiftMonth.y, m0 = shiftMonth.m;
    // 読み込み元（ファイル、Excelならシート1枚ごと）: [{ fileKey, file, sheet, rows, enabled }]
    var entries = [];
    var result = null, loading = 0;
    // 基準（マスター）の読み込み元。交代勤務などで複数に出てくる人は、ここのシフトを使う。
    // 選んでいないときは、ボードの名前と一致した人数がいちばん多いもの
    var masterIdx = null, autoMasterIdx = 0;
    function effectiveMaster(){
      return (masterIdx !== null && entries[masterIdx] && entries[masterIdx].enabled) ? masterIdx : autoMasterIdx;
    }
    openModal(function(box){
      box.innerHTML =
        '<div class="sheet-header"><span>Excel・CSVから' + what + 'を読み込む</span></div>' +
        '<label>ファイル（.xlsx / .csv）… ' + IMPORT_MAX_FILES + 'つまでまとめて読めます</label>' +
        '<input type="file" id="impFile" multiple accept=".xlsx,.xlsm,.csv,.tsv,.txt" style="width:100%;font-size:13px;">' +
        '<div class="imp-file-list" id="impFileList"></div>' +
        '<label>またはExcelでコピーしたセルを貼り付け</label>' +
        '<textarea id="impPaste" rows="3" placeholder="名前と日付の見出しを含めてコピーして貼り付け"></textarea>' +
        (isOT
          ? '<p class="imp-hint">名前の列と、日付（1, 2, 3… や 9/1）の見出しがある表を読みます。マスの値は 2 / 1.5 / 1:30 / 1時間30分 / 90分 のどれでも読めます。</p>'
          : '') +
        '<div class="imp-preview" id="impPreview"></div>' +
        '<div class="modal-actions">' +
          '<button class="btn-secondary" id="cancelBtn" type="button">キャンセル</button>' +
          '<button class="btn-primary" id="okBtn" type="button" disabled>読み込む</button>' +
        '</div>';
      var elFile = box.querySelector("#impFile"), elPaste = box.querySelector("#impPaste"),
          elFileList = box.querySelector("#impFileList"),
          elPreview = box.querySelector("#impPreview"), okBtn = box.querySelector("#okBtn");

      function setPreview(html, isErr){ elPreview.innerHTML = html; elPreview.classList.toggle("err", !!isErr); }
      function getOpts(){
        // 月は表（例: F4）から読む。表に月がないときは、シフト表で表示中の年月として読む
        return {
          y: y0,
          m: m0,
          tokens: IMPORT_OFF_TOKENS,
          workTokens: IMPORT_WORK_TOKENS,
          blank: false,
          readValue: isOT ? readOvertimeCell : null
        };
      }
      function analyzeRows(r, opts, match){
        var res = analyzeShiftRows(r, opts, match), swapped = false;
        if(!res){ res = analyzeShiftRows(transposeRows(r), opts, match); swapped = !!res; }
        if(res) res.swapped = swapped;
        return res;
      }
      function activeEntries(){ return entries.filter(function(e){ return e.enabled; }); }

      // 一覧・確認画面ではシート名で表示する（ファイル名は長くて見分けにくいため）。
      // 別のファイルに同じ名前のシートがあるときだけ、ファイル名を短くして添える
      // ファイル名どうしで共通の先頭・末尾（「2026年9月度_勤務シフト表_」など）を省き、違う部分だけを短く出す
      function shortFileName(name){
        function base(n){ return n.replace(/\.[^.]+$/, ""); }
        var names = [], seen = {};
        entries.forEach(function(o){ if(!seen[o.fileKey]){ seen[o.fileKey] = true; names.push(base(o.file)); } });
        var me = base(name), pre = 0, suf = 0;
        if(names.length > 1){
          var minLen = Math.min.apply(null, names.map(function(n){ return n.length; }));
          while(pre < minLen && names.every(function(n){ return n.charAt(pre) === names[0].charAt(pre); })) pre++;
          while(suf < minLen - pre && names.every(function(n){ return n.charAt(n.length - 1 - suf) === names[0].charAt(names[0].length - 1 - suf); })) suf++;
        }
        var mid = me.slice(pre, me.length - suf).replace(/^[\s_\-・.]+|[\s_\-・.]+$/g, "") || me;
        return mid.length > 12 ? mid.slice(0, 12) + "…" : mid;
      }
      function entryLabel(e, i){
        if(!e.sheet) return FILE_MARKS[i] + " " + e.file;
        var dup = entries.some(function(o, j){ return j !== i && o.sheet === e.sheet && o.fileKey !== e.fileKey; });
        return FILE_MARKS[i] + " " + e.sheet + (dup ? "（" + shortFileName(e.file) + "）" : "");
      }
      function renderFileList(){
        var multi = activeEntries().length > 1, master = effectiveMaster();
        elFileList.innerHTML = entries.map(function(e, i){
          return '<div class="imp-file-item' + (e.enabled ? '' : ' off') + '">' +
