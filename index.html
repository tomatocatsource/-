      for(var r2 = hdr + 1; r2 < rows.length; r2++){
        var cell = rows[r2] && rows[r2][c], nt = normText(cell);
        if(nt === "") continue;
        if(match(cell)){ hits++; score += 1000; }
        else if(!/^\d+$/.test(nt)) score += 1;
      }
      if(hits) candidates.push(c);
      if(score > fallbackScore){ fallbackScore = score; fallbackCol = c; }
    }
    if(!candidates.length){
      if(fallbackCol < 0) return null;
      candidates = [fallbackCol];   // 一致なし: 「読み込まない行」を見せるために、名前らしい列で読む
    }

    function readWithNameCol(nameCol){
      // 同じ人に複数の行が当たったとき（「予定」「実績」の2段や、同じ名字の別人など）は、
      // 後の行で前の行の休みを消さないよう、休みを合わせる
      var people = [], byName = Object.create(null), dupNames = [];
      var unmatched = [], fuzzy = [], offCount = 0, firstDataRow = -1;
      var tokenHits = Object.create(null), otherMarks = Object.create(null);
      for(var r3 = hdr + 1; r3 < rows.length; r3++){
        var row = rows[r3] || [], raw = row[nameCol];
        if(normText(raw) === "") continue;
        var label = String(raw).trim(), hit = match(raw);
        if(firstDataRow < 0) firstDataRow = r3;
        if(!hit){ if(unmatched.indexOf(label) === -1) unmatched.push(label); continue; }
        var person = byName[hit.name];
        if(!person){
          person = byName[hit.name] = { name: hit.name, offs: Object.create(null), labels: [] };
          people.push(person);
        }
        // 同じ表記の行が続くのは結合セル（1人2行など）なので正常。表記の違う行が同じ人に当たったときだけ知らせる
        if(person.labels.indexOf(label) === -1){
          person.labels.push(label);
          if(hit.fuzzy) fuzzy.push(label + "→" + hit.name);
          if(person.labels.length === 2) dupNames.push(hit.name + "（" + person.labels.join("・") + "）");
        }
        var offs = person.offs;
        cols.forEach(function(dc){
          var val = normText(row[dc.c]).toLowerCase(), off = false, tk = null;
          if(val === ""){ off = opts.blank; if(off) tk = "空欄"; }
          else {
            opts.tokens.some(function(t){ if(val.indexOf(t) !== -1){ tk = t; return true; } return false; });
            off = !!tk;
            if(!off){ var key = String(row[dc.c]).trim().slice(0, 4); otherMarks[key] = (otherMarks[key] || 0) + 1; }
          }
          if(off){
            tokenHits[tk] = (tokenHits[tk] || 0) + 1;
            var kind = tokenKind(tk);
            if(!offs[dc.iso]){ offs[dc.iso] = kind; offCount++; }
            else if(offs[dc.iso] === "休" && kind !== "休") offs[dc.iso] = kind;   // 2段の表などでは有・指を優先
          }
        });
      }
      return { cols: cols, people: people, unmatched: unmatched, fuzzy: fuzzy, offCount: offCount,
               hdr: hdr, nameCol: nameCol, firstDataRow: firstDataRow, sheetMonth: sheetMonth,
               tokenHits: tokenHits, otherMarks: otherMarks, dupNames: dupNames };
    }

    var best = null;
    candidates.forEach(function(nc){
      var res = readWithNameCol(nc);
      if(!best || res.offCount > best.offCount ||
         (res.offCount === best.offCount && res.people.length > best.people.length)) best = res;
    });
    return best;
  }

  // 読み込んだ休み（Excel/CSV・共有コード共通）をシフト表に反映する。反映直後の画面から元に戻せる。
  // res = { cols:[{iso}], people:[{name, offs:{iso:true}}], offCount }
  function applyShiftImport(res){
    syncPlacementsToDay();
    var backup = JSON.parse(JSON.stringify(state.dayoffs)), backupPl = JSON.parse(JSON.stringify(state.dayPlacements));
    res.people.forEach(function(pp){
      res.cols.forEach(function(dc){
        var v = pp.offs[dc.iso];
        setOff(pp.name, dc.iso, !!v, v ? normalizeOffKind(v) : undefined);
      });
    });
    var first = res.cols[0].iso;
    shiftMonth = { y: parseInt(first.slice(0, 4), 10), m: parseInt(first.slice(5, 7), 10) };
    shiftSelRows = Object.create(null); shiftSelCols = Object.create(null);
    scheduleSave(); renderShiftSheet(false); renderAll();
    closeModal();
    openModal(function(b2){
      b2.innerHTML =
        '<div class="sheet-header"><span>読み込みました</span></div>' +
        '<p class="confirm-msg">' + res.people.length + '人・' + res.cols.length + '日分の休み（' + res.offCount + 'マス）を反映しました。</p>' +
        '<div class="modal-actions">' +
          '<button class="btn-secondary" id="undoBtn" type="button">元に戻す</button>' +
          '<button class="btn-primary" id="doneBtn" type="button">閉じる</button>' +
        '</div>';
      b2.querySelector("#doneBtn").addEventListener("click", closeModal);
      b2.querySelector("#undoBtn").addEventListener("click", function(){
        state.dayoffs = backup; state.dayPlacements = backupPl;
        loadPlacementsForDay(state.boardDate);
        scheduleSave(); renderShiftSheet(true); renderAll(); closeModal();
      });
    });
  }

  // ---------- シフト（休み）の共有コード ----------
  // 形式: "P5:" + base64(gzip( 開始日 FS 終了日 GS 名前 FS 休み(開始日からの日数,…) RS … ))
  // 読み込むと、コードに含まれる人の「その期間」の休みが置き換わる（期間の外・コードにない人はそのまま）。
  var SHIFT_CODE_PREFIX = "P5:";
  function isoToDayNum(iso){ var p = iso.split("-"); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000); }
  function dayNumToISO(n){ var d = new Date(n * 86400000); return isoOf(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }

  function allDayoffRange(){
    var min = null, max = null, names = Object.create(null);
    state.nameplates.forEach(function(np){ names[np.name] = true; });
    Object.keys(state.dayoffs).forEach(function(name){
      if(!names[name]) return;
      Object.keys(state.dayoffs[name]).forEach(function(iso){
        if(min === null || iso < min) min = iso;
        if(max === null || iso > max) max = iso;
      });
    });
    return min ? { start: min, end: max } : null;
  }

  // 共有コードに入れる名前（重複なし・番号順）。people を渡すとその人だけに絞れる（人数を分けて共有するため）。
  function distinctShiftNames(){
    var seen = Object.create(null), out = [];
    sortByNumber(state.nameplates).forEach(function(np){
      if(!seen[np.name]){ seen[np.name] = true; out.push(np.name); }
    });
    return out;
  }
  async function encodeShiftCode(startISO, endISO, people){
    var s = isoToDayNum(startISO), e = isoToDayNum(endISO), recs = [];
    (people || distinctShiftNames()).forEach(function(name){
      var m = getDayoffs(name), offs = [];
      if(m){
        Object.keys(m).forEach(function(iso){
          var n = isoToDayNum(iso);
          if(n >= s && n <= e) offs.push({ n: n - s, k: offKind(name, iso) });
        });
      }
      offs.sort(function(a, b){ return a.n - b.n; });
      // 休は日数だけ、有・指は「3有」のように種類を後ろに付ける（古い版は数字だけ読むので「休」として取り込める）
      recs.push(name + FS + offs.map(function(o){ return o.n + (o.k === "休" ? "" : o.k); }).join(","));
    });
    var payload = startISO + FS + endISO + GS + recs.join(RS);
    if(typeof CompressionStream !== "undefined"){
      var stream = new Blob([new TextEncoder().encode(payload)]).stream().pipeThrough(new CompressionStream("gzip"));
      var compressed = new Uint8Array(await new Response(stream).arrayBuffer());
      return SHIFT_CODE_PREFIX + bytesToBase64(compressed);
    }
    return SHIFT_CODE_PREFIX + btoa(unescape(encodeURIComponent(payload)));
  }

  async function decodeShiftCode(code){
    var trimmed = (code || "").replace(/\s+/g, "");   // チャットで折り返されていても読めるように
    if(trimmed.indexOf("P3:") === 0 || trimmed.indexOf("P4:") === 0){
      throw new Error("これはテンプレート／配置のコードです。シフトの共有コード（P5: で始まる）を貼り付けてください。");
    }
    if(trimmed.indexOf(SHIFT_CODE_PREFIX) !== 0){
      throw new Error("シフトの共有コード（P5: で始まる）を全体貼り付けてください。");
    }
    var payload;
    try{
      var binary = atob(trimmed.slice(SHIFT_CODE_PREFIX.length));
      var bytes = Uint8Array.from(binary, function(c){ return c.charCodeAt(0); });
      if(bytes.length >= 2 && bytes[0] === 0x1f && bytes[1] === 0x8b && typeof DecompressionStream !== "undefined"){
        var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        payload = new TextDecoder().decode(await new Response(stream).arrayBuffer());
      } else {
        payload = decodeURIComponent(escape(binary));
      }
    }catch(e){
      throw new Error("コードの形式が正しくありません。コピーし直してください。");
    }
    var sections = payload.split(GS), head = sections[0].split(FS);
    var iso = /^\d{4}-\d{2}-\d{2}$/;
    if(head.length < 2 || !iso.test(head[0]) || !iso.test(head[1])) throw new Error("コードの中身が正しくありません。");
    var s = isoToDayNum(head[0]), e = isoToDayNum(head[1]);
    if(!(e >= s) || e - s > 800) throw new Error("コードの中身が正しくありません。");
    var people = (sections[1] || "").length === 0 ? [] : sections[1].split(RS).map(function(rec){
      var f = rec.split(FS), offs = Object.create(null);
      (f[1] || "").split(",").forEach(function(x){
        var mt = /^(\d+)(有|指)?$/.exec(x);
        if(!mt) return;
        var n = parseInt(mt[1], 10);
        if(n >= 0 && s + n <= e) offs[dayNumToISO(s + n)] = mt[2] || "休";
      });
      return { name: f[0], offs: offs };
    }).filter(function(pp){ return pp.name; });
    return { start: head[0], end: head[1], people: people };
  }

  function copyToClipboard(text, area, done){
    function fallback(){ area.focus(); area.select(); try{ document.execCommand("copy"); done(); }catch(e){} }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(fallback); }
    else { fallback(); }
  }
  function flashCopied(btn){
    btn.textContent = "コピーしました";
    setTimeout(function(){ btn.textContent = "コピー"; }, 1500);
  }
  function mdOfISO(iso){ return parseInt(iso.slice(5, 7), 10) + "/" + parseInt(iso.slice(8), 10); }

  // ---------- QRコード（共有コードの表示・読み取り） ----------
  function renderShareQR(box, text){
    if(!box) return;
    box.innerHTML = "";
    if(!text || typeof QRCode !== "function"){ box.hidden = true; return; }
    try{
      var level = text.length > 900 ? QRCode.CorrectLevel.L : text.length > 500 ? QRCode.CorrectLevel.M : QRCode.CorrectLevel.Q;
      // 画面外に作ってから、白いクワイエットゾーン（余白）を付けて box に差し込む。
      // ライブラリはモジュールいっぱいに描くだけで余白を付けないため、余白なしの画像を
      // 保存・書き出しすると実機のカメラで読み取れないことがある。
      // 文字数が多い（＝マス目が細かい）ときに潰れないよう、先に小さく作ってマス数を調べ、
      // 1マスが最低4pxになる大きさで作り直す。
      var helper = document.createElement("div");
      var probe = new QRCode(helper, { text: text, width: 64, height: 64, correctLevel: level, colorDark: "#000000", colorLight: "#ffffff" });
      var modules = (probe._oQRCode && probe._oQRCode.getModuleCount) ? probe._oQRCode.getModuleCount() : 21;
      var size = Math.min(640, Math.max(176, modules * 4));
      helper.innerHTML = "";
      var qr = new QRCode(helper, { text: text, width: size, height: size, correctLevel: level, colorDark: "#000000", colorLight: "#ffffff" });
      var srcCanvas = helper.querySelector("canvas");
      var quiet = modules ? Math.ceil(size / modules) * 4 : 16;   // 4モジュール分の余白
      var padded = document.createElement("canvas");
      padded.width = size + quiet * 2; padded.height = size + quiet * 2;
      var ctx = padded.getContext("2d");
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, padded.width, padded.height);
      if(srcCanvas) ctx.drawImage(srcCanvas, quiet, quiet, size, size);
      var img = document.createElement("img");
      img.alt = "QRコード";
      img.src = padded.toDataURL("image/png");
      box.appendChild(img);
      box.hidden = false;
    }catch(e){
      box.hidden = true;   // 長すぎるなどQRコードにできない場合は、上のテキストのコピーのみ案内する
    }
  }

  var qrDetectorSupport = null;
  function checkQRDetectorSupport(){
    if(qrDetectorSupport !== null) return Promise.resolve(qrDetectorSupport);
    if(typeof window.BarcodeDetector !== "function"){ qrDetectorSupport = false; return Promise.resolve(false); }
    return window.BarcodeDetector.getSupportedFormats().then(function(fmts){
      qrDetectorSupport = fmts.indexOf("qr_code") !== -1;
      return qrDetectorSupport;
    }).catch(function(){ qrDetectorSupport = false; return false; });
  }

  var qrScanOverlay = null, qrScanVideo = null, qrScanStatus = null, qrScanStream = null, qrScanRAF = null, qrScanCb = null;
  function ensureQRScanUI(){
    if(qrScanOverlay) return;
    qrScanOverlay = document.createElement("div");
    qrScanOverlay.className = "overlay qr-scan-overlay";
    qrScanOverlay.innerHTML =
      '<div class="qr-scan-box">' +
        '<div class="qr-scan-header"><span>QRコードを読み取る</span><button type="button" class="icon-btn" id="qrScanCloseBtn">×</button></div>' +
        '<video id="qrScanVideo" playsinline muted></video>' +
        '<p class="qr-scan-status" id="qrScanStatusEl">カメラをQRコードに向けてください。</p>' +
      '</div>';
    document.body.appendChild(qrScanOverlay);
    qrScanVideo = qrScanOverlay.querySelector("#qrScanVideo");
    qrScanStatus = qrScanOverlay.querySelector("#qrScanStatusEl");
    qrScanOverlay.querySelector("#qrScanCloseBtn").addEventListener("click", closeQRScanner);
    qrScanOverlay.addEventListener("pointerdown", function(e){ if(e.target === qrScanOverlay) closeQRScanner(); });
  }
  var qrScanSession = 0;   // 開閉のたびに進める。古い非同期処理を見分けるため
  var QR_SCAN_STALE = {};
  function closeQRScanner(){
    qrScanSession++;
    if(qrScanRAF) cancelAnimationFrame(qrScanRAF);
    qrScanRAF = null;
    if(qrScanStream){ qrScanStream.getTracks().forEach(function(t){ t.stop(); }); qrScanStream = null; }
    if(qrScanVideo) qrScanVideo.srcObject = null;
    if(qrScanOverlay) qrScanOverlay.classList.remove("open");
    qrScanCb = null;
  }
  function openQRScanner(onResult){
    ensureQRScanUI();
    var session = ++qrScanSession;
    qrScanCb = onResult;
    qrScanStatus.textContent = "カメラをQRコードに向けてください。";
    qrScanOverlay.classList.add("open");
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      qrScanStatus.textContent = "この端末ではカメラを使用できません。コードを貼り付けてください。";
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(function(stream){
      // カメラの許可を待つ間に閉じられていたら、すぐに止める
      if(session !== qrScanSession){ stream.getTracks().forEach(function(t){ t.stop(); }); throw QR_SCAN_STALE; }
      qrScanStream = stream;
      qrScanVideo.srcObject = stream;
      return qrScanVideo.play();
    }).then(function(){
      if(session !== qrScanSession) return;
      var detector = new window.BarcodeDetector({ formats: ["qr_code"] });
      var scanning = true;
      var scan = function(){
        if(session !== qrScanSession || !qrScanStream || !scanning) return;
        detector.detect(qrScanVideo).then(function(codes){
          if(codes && codes.length && codes[0].rawValue){
            scanning = false;
            var text = codes[0].rawValue, cb = qrScanCb;
            closeQRScanner();
            if(cb) cb(text);
            return;
          }
          qrScanRAF = requestAnimationFrame(scan);
        }).catch(function(){ qrScanRAF = requestAnimationFrame(scan); });
      };
      qrScanRAF = requestAnimationFrame(scan);
    }).catch(function(err){
      if(err === QR_SCAN_STALE || session !== qrScanSession) return;
      if(qrScanStatus) qrScanStatus.textContent = "カメラを使用できませんでした。設定でカメラへのアクセスを許可するか、コードを貼り付けてください。";
    });
  }
  // 読み込み画面に「QRコードを読み取る」ボタンを追加する。対応していない端末ではボタンを出さない。
  function addQRScanButton(container, onText){
    checkQRDetectorSupport().then(function(ok){
      if(!ok || !container.isConnected) return;
      var row = document.createElement("div");
      row.className = "qr-scan-row";
      row.innerHTML = '<button type="button" class="btn-secondary btn-sm" id="qrScanOpenBtn">📷 QRコードを読み取る</button>';
      container.appendChild(row);
      row.querySelector("#qrScanOpenBtn").addEventListener("click", function(){ openQRScanner(onText); });
    });
  }


  function openShiftShareModal(){
    var y = shiftMonth.y, m = shiftMonth.m, scope = "month", code = "", token = 0;
    openModal(function(box){
      box.innerHTML =
        '<div class="sheet-header"><span>シフトの共有コードを作る</span></div>' +
        '<p class="confirm-msg">休みをコードにします。相手が下のQRを読み取るか、コードを貼り付けると取り込めます。</p>' +
        '<label class="lbl-tight">共有する期間</label>' +
        '<div class="choice-row" id="scopeChoice">' +
          '<div class="choice-btn selected" data-scope="month">表示中の月（' + y + '年' + m + '月）</div>' +
          '<div class="choice-btn" data-scope="all">入力済みのすべて</div>' +
        '</div>' +
        '<label class="lbl-tight">共有コード</label>' +
        '<textarea id="shiftShareArea" class="ta-sm" readonly rows="2"></textarea>' +
        '<div class="imp-hint" id="shiftShareInfo"></div>' +
        '<div class="qr-share-wrap">' +
          '<div class="qr-share-box" id="shiftShareQRBox" hidden></div>' +
          '<p class="qr-share-note">相手がこの画面をカメラで読み取ると取り込めます</p>' +
        '</div>' +
        '<div class="modal-actions">' +
          '<button class="btn-secondary" id="closeBtn" type="button">閉じる</button>' +
          (navigator.share ? '<button class="btn-secondary" id="sendBtn" type="button">共有…</button>' : '') +
          '<button class="btn-primary" id="copyBtn" type="button">コピー</button>' +
        '</div>';
      var area = box.querySelector("#shiftShareArea"), info = box.querySelector("#shiftShareInfo"),
          qrBox = box.querySelector("#shiftShareQRBox"),
          copyBtn = box.querySelector("#copyBtn"), sendBtn = box.querySelector("#sendBtn");

      function setActionsEnabled(on){ copyBtn.disabled = !on; if(sendBtn) sendBtn.disabled = !on; }
      function showEmpty(message){ code = ""; area.value = ""; info.textContent = message; renderShareQR(qrBox, ""); }

      async function refresh(){
        var my = ++token;
        var range = scope === "month" ? { start: isoOf(y, m, 1), end: isoOf(y, m, daysInMonth(y, m)) } : allDayoffRange();
        setActionsEnabled(false);
        if(!range){ showEmpty("共有できる休みの入力がまだありません。"); return; }
        var people = distinctShiftNames(), c;
        try{ c = await encodeShiftCode(range.start, range.end, people); }
        catch(err){ if(my === token) showEmpty("共有コードの作成に失敗しました。"); return; }
        if(my !== token) return;
        code = c; area.value = c;
        info.textContent = people.length + "人分・" + mdOfISO(range.start) + "〜" + mdOfISO(range.end) + "（コードの長さ " + c.length + "文字）";
        renderShareQR(qrBox, c);
        setActionsEnabled(true);
      }
      box.querySelectorAll("#scopeChoice .choice-btn").forEach(function(btn){
        btn.addEventListener("click", function(){
          scope = btn.dataset.scope;

          refresh();
        });
      });
      box.querySelector("#closeBtn").addEventListener("click", closeModal);
      copyBtn.addEventListener("click", function(){
        if(!code) return;
        copyToClipboard(code, area, function(){ flashCopied(copyBtn); });
      });
      if(sendBtn){
        sendBtn.addEventListener("click", function(){
          if(!code) return;
          navigator.share({ title: "シフトの共有コード", text: code }).catch(function(){ /* キャンセルなど */ });
        });
      }
      refresh();
    });
  }

  function openShiftReceiveModal(){
    var decoded = null, token = 0;
    openModal(function(box){
      box.innerHTML =
        '<div class="sheet-header"><span>共有コードから休みを読み込む</span></div>' +
        '<label>共有コードを貼り付け</label>' +
        '<textarea id="shiftCodeArea" rows="5" placeholder="P5: で始まるコード"></textarea>' +
        '<div id="shiftScanQRRow"></div>' +
        '<div class="imp-preview" id="shiftCodePreview">シフトの共有コードを貼り付けてください。</div>' +
        '<div class="modal-actions">' +
          '<button class="btn-secondary" id="cancelBtn" type="button">キャンセル</button>' +
          '<button class="btn-primary" id="okBtn" type="button" disabled>読み込む</button>' +
        '</div>';
      var area = box.querySelector("#shiftCodeArea"), pv = box.querySelector("#shiftCodePreview"), okBtn = box.querySelector("#okBtn");
      addQRScanButton(box.querySelector("#shiftScanQRRow"), function(text){ area.value = text; area.dispatchEvent(new Event("input")); });
      function setPreview(html, isErr){ pv.innerHTML = html; pv.classList.toggle("err", !!isErr); }

      area.addEventListener("input", async function(){
        var my = ++token;
        decoded = null; okBtn.disabled = true;
        if(!area.value.trim()){ setPreview("シフトの共有コードを貼り付けてください。"); return; }
        var code;
        try{ code = await decodeShiftCode(area.value); }
        catch(err){ if(my === token) setPreview(escapeHtml(err.message), true); return; }
        if(my !== token) return;
        var match = buildNameMatcher(), people = [], unmatched = [], fuzzy = [], offCount = 0;
        code.people.forEach(function(pp){
          var hit = match(pp.name);
          if(!hit){ unmatched.push(pp.name); return; }
          if(hit.fuzzy) fuzzy.push(pp.name + "→" + hit.name);
          offCount += Object.keys(pp.offs).length;
          people.push({ name: hit.name, offs: pp.offs });
        });
        if(!people.length){
          setPreview("ボードの名前と一致する人がいませんでした。" + (unmatched.length ? "<br>コードの名前: <b>" + expandableList(unmatched, 6) + "</b>" : ""), true);
          return;
        }
        var cols = [], s = isoToDayNum(code.start), e = isoToDayNum(code.end);
        for(var n = s; n <= e; n++){ cols.push({ iso: dayNumToISO(n) }); }
        decoded = { cols: cols, people: people, offCount: offCount };
        okBtn.disabled = false;

        if(fuzzy.length) html += '<br>近い名前で照合: ' + expandableList(fuzzy, 3);
        if(unmatched.length) html += '<br>ボードに同じ名前がなく、読み込まない人: ' + expandableList(unmatched, 6);
        html += '<br>読み込んだ人の、この期間の休みが置き換わります。';

  // スマホでクラウド上のファイル（Googleドライブ、メールやLINEの添付など）を選ぶと、
  // 端末へのダウンロードが終わる前や、読む権限が切れたときに読み取りに失敗することがあるので、少し待って1回だけ読み直す
  async function readFileBuffer(f){
    try{ return await f.arrayBuffer(); }
    catch(err){
      if(err && err.name === "NotReadableError"){
        await new Promise(function(r){ setTimeout(r, 800); });
        return await f.arrayBuffer();
      }
      throw err;
    }
  }
  function fileReadErrorMessage(err){
    if(err && err.name === "NotReadableError"){
      return "ファイルを読み取れませんでした。Googleドライブやメール・LINEなどから直接選ぶと起きることがあります。" +
        "一度スマホに保存（ダウンロード）してから「ファイル」アプリの中から選び直すか、Excelでセルをコピーして下の欄に貼り付けてください。";
    }
    return (err && err.message) || "読み込めませんでした。";
  }

  function openShiftImportModal(){
    var y0 = shiftMonth.y, m0 = shiftMonth.m;
    var workbook = null, rows = null, result = null;
    openModal(function(box){
      box.innerHTML =
        '<div class="sheet-header"><span>Excel・CSVから休みを読み込む</span></div>' +
        '<label>ファイル（.xlsx / .csv）</label>' +
        '<input type="file" id="impFile" accept=".xlsx,.xlsm,.xls,.csv,.tsv,.txt" style="width:100%;font-size:13px;">' +
        '<div id="impSheetRow" style="display:none;"><label>シート</label><select id="impSheet" class="imp-select"></select></div>' +
        '<label>またはExcelでコピーしたセルを貼り付け</label>' +
        '<textarea id="impPaste" rows="3" placeholder="名前と日付の見出しを含めてコピーして貼り付け"></textarea>' +
        '<label>休みとして読む記号（カンマ区切り）</label>' +
        '<input type="text" id="impTokens" value="休,公,×,有,希,指">' +
        '<div class="imp-preview" id="impPreview"></div>' +
        '<div class="modal-actions">' +
          '<button class="btn-secondary" id="cancelBtn" type="button">キャンセル</button>' +
          '<button class="btn-primary" id="okBtn" type="button" disabled>読み込む</button>' +
        '</div>';
      var elFile = box.querySelector("#impFile"), elPaste = box.querySelector("#impPaste"),
          elSheetRow = box.querySelector("#impSheetRow"), elSheet = box.querySelector("#impSheet"),
          elTokens = box.querySelector("#impTokens"),
          elPreview = box.querySelector("#impPreview"), okBtn = box.querySelector("#okBtn");

      function setPreview(html, isErr){ elPreview.innerHTML = html; elPreview.classList.toggle("err", !!isErr); }
      function getOpts(){
        // 月は表（例: F4）から読む。表に月がないときは、シフト表で表示中の年月として読む
        return {
          y: y0,
          m: m0,
          tokens: elTokens.value.split(/[,、，\s]+/).map(function(t){ return normText(t).toLowerCase(); }).filter(Boolean),
          blank: false
        };
      }

      // シートが複数あるときは、全部を試しに読んで、休みが最も多く読めたシートを選ぶ
      // （勤務時間の計算用など、同じ形の別シートを間違えて読まないように）。
      // 休みの数が同じなら、ボードの名前と一致した人数 → シート名に「9月」を含む → 左にあるシートの順。
      async function pickShiftSheet(wb){
        var opts = getOpts(), match = buildNameMatcher(), best = null;
        for(var i = 0; i < wb.names.length && i < 40; i++){
          var r;
          try{ r = await wb.getRows(i); }catch(e){ continue; }
          var res = analyzeShiftRows(r, opts, match) || analyzeShiftRows(transposeRows(r), opts, match);
          var score = [
            res ? res.offCount : -1,
            res ? res.people.length : -1,
            normText(wb.names[i]).indexOf(m0 + "月") !== -1 ? 1 : 0
          ];
          var better = !best;
          for(var k = 0; !better && k < score.length; k++){
            if(score[k] !== best.score[k]){ better = score[k] > best.score[k]; break; }
          }
          if(better) best = { index: i, rows: r, score: score };
        }
        if(!best) throw new Error("シートを読み込めませんでした。");
        return best;
      }

      function recompute(){
        result = null; okBtn.disabled = true;
        if(!rows){ setPreview("ファイルを選ぶか、Excelでコピーしたセルを貼り付けてください。"); return; }
        var opts = getOpts(), match = buildNameMatcher();
        var res = analyzeShiftRows(rows, opts, match), swapped = false;
        if(!res){ res = analyzeShiftRows(transposeRows(rows), opts, match); swapped = !!res; }
        if(!res){
          setPreview("日付の並び（1, 2, 3… や 9/1 など）が5日分以上ある行が見つかりませんでした。日付の見出しを含めてください。", true);
          return;
        }
        if(!res.people.length){
          setPreview("ボードの名前と一致する行がありませんでした。" +
            "<br>名前は " + colLetter(res.nameCol) + "列から読みました。" +
            (res.unmatched.length ? "<br>表の名前: <b>" + expandableList(res.unmatched, 6) + "</b>" : ""), true);
          return;
        }
        result = res; okBtn.disabled = false;
        var html = '';
        if(workbook && workbook.names.length > 1){
          html += 'シート「' + escapeHtml(workbook.names[parseInt(elSheet.value, 10)] || "") + '」を読みました（違うときは上で選び直し）<br>';
        }
        html += '<b>' + res.people.length + '人</b> × <b>' + res.cols.length + '日</b>（' + mdOfISO(res.cols[0].iso) + '〜' + mdOfISO(res.cols[res.cols.length - 1].iso) +
          '）／休み <b>' + res.offCount + '</b>マス' + (swapped ? '<br>縦横を入れ替えて読みました。' : '');
        if(!swapped){
          html += '<br>読み取り位置: 日付 ' + (res.hdr + 1) + '行目（' + colLetter(res.cols[0].c) + '〜' + colLetter(res.cols[res.cols.length - 1].c) + '列）・名前 ' +
            colLetter(res.nameCol) + '列' + (res.firstDataRow >= 0 ? '（' + (res.firstDataRow + 1) + '行目から）' : '');
          if(res.sheetMonth) html += '<br>月: ' + res.sheetMonth.m + '月（' + colLetter(res.sheetMonth.c) + (res.sheetMonth.r + 1) + 'から判定）';
        }
        var hitKeys = Object.keys(res.tokenHits);
        html += '<br>休みとして読んだ記号: ' + (hitKeys.length ? escapeHtml(hitKeys.map(function(k){ return k + ' ' + res.tokenHits[k]; }).join('・')) : '<b>なし</b>');
        var otherKeys = Object.keys(res.otherMarks).sort(function(a, b){ return res.otherMarks[b] - res.otherMarks[a]; });
        if(otherKeys.length) html += '<br>休みにしなかった記号: ' + expandableList(otherKeys.map(function(k){ return k + ' ' + res.otherMarks[k]; }), 6, '・') +
          '（休みにするなら下の記号欄に追加）';
        if(res.fuzzy.length) html += '<br>近い名前で照合: ' + expandableList(res.fuzzy, 3);
        if(res.dupNames.length) html += '<br><b>別々の名前の行が同じ人に当たりました（休みを合わせて読みます）:</b> ' + expandableList(res.dupNames, 6) +
          '（別の人が混ざっていないか確認してください）';
        if(res.unmatched.length) html += '<br>ボードに同じ名前がなく、読み込まない行: ' + expandableList(res.unmatched, 6);
        html += '<br>読み込んだ人の、この日付の範囲の休みが置き換わります。';
        setPreview(html, false);
      }

      elFile.addEventListener("change", async function(){
        var f = elFile.files && elFile.files[0];
        if(!f) return;
        setPreview("読み込み中…"); okBtn.disabled = true;
        try{
          var buf = await readFileBuffer(f), head = new Uint8Array(buf.slice(0, 4));
          if(head[0] === 0x50 && head[1] === 0x4B){                       // zip = xlsx
            workbook = await openXlsx(buf);
            elSheet.innerHTML = workbook.names.map(function(n, i){ return '<option value="' + i + '">' + escapeHtml(n) + '</option>'; }).join("");
            setPreview("シートを確認中…");
            var best = await pickShiftSheet(workbook);
            elSheet.value = String(best.index);
            elSheetRow.style.display = workbook.names.length > 1 ? "block" : "none";
            rows = best.rows;
          } else if(head[0] === 0xD0 && head[1] === 0xCF){                // 旧 .xls
            throw new Error("古い形式（.xls）は読めません。Excelで「.xlsx」か「CSV」で保存し直してください。");
          } else {
            workbook = null; elSheetRow.style.display = "none";
            rows = parseDelimited(decodeText(buf));
          }
          elPaste.value = "";
        }catch(err){
          rows = null; workbook = null;
          elFile.value = "";   // 同じファイルを選び直しても反応するように
          setPreview(escapeHtml(fileReadErrorMessage(err)), true);
          return;
        }
        recompute();
      });
      elSheet.addEventListener("change", async function(){
        try{ rows = await workbook.getRows(parseInt(elSheet.value, 10)); }
        catch(err){ rows = null; setPreview(escapeHtml(err.message), true); return; }
        recompute();
      });
      elPaste.addEventListener("input", function(){
        workbook = null; elSheetRow.style.display = "none"; elFile.value = "";
        rows = elPaste.value.trim() ? parseDelimited(elPaste.value) : null;
        recompute();
      });
      elTokens.addEventListener("input", recompute);
      box.querySelector("#cancelBtn").addEventListener("click", closeModal);

      okBtn.addEventListener("click", function(){ if(result) applyShiftImport(result); });
      recompute();
    });
  }

  function triggerPhysicsCollapse(){
    // 動きを減らす設定の端末では演出しない
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if(document.body.classList.contains("physics-active")) return;
    if(modalOverlay.classList.contains("open")) return;
    if(templateOverlay.classList.contains("open")) return;
    if(document.getElementById("shiftOverlay").classList.contains("open")) return;
    var themeOverlayEl = document.getElementById("themeOverlay");
    if(themeOverlayEl && themeOverlayEl.classList.contains("open")) return;

    var chips = Array.prototype.slice.call(document.querySelectorAll(".location-card .nameplate-chip"));
    if(chips.length === 0) return;

    document.body.classList.add("physics-active");
    document.body.classList.add("physics-shake");
    setTimeout(function(){ document.body.classList.remove("physics-shake"); }, 350);

    var layer = document.createElement("div");
    layer.id = "physicsLayer";
    layer.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;";
    document.body.appendChild(layer);

    var poolTop = poolBarEl ? poolBarEl.getBoundingClientRect().top : window.innerHeight;
    var floor = Math.min(poolTop, window.innerHeight) - 6;
    var wallLeft = 4, wallRight = window.innerWidth - 4;
    var gravity = 2600;
    var boardRect = boardGrid.getBoundingClientRect();
    var centerX = boardRect.left + boardRect.width / 2;
    var centerY = boardRect.top + boardRect.height / 2;
    var bodies = chips.map(function(chip){
      var rect = chip.getBoundingClientRect();
      chip.style.visibility = "hidden";
      var clone = document.createElement("div");
      clone.className = chip.className;
      clone.textContent = chip.textContent;
      clone.style.cssText = "position:absolute;left:" + rect.left + "px;top:" + rect.top + "px;width:" + rect.width + "px;height:" + rect.height + "px;margin:0;box-sizing:border-box;display:flex;align-items:center;justify-content:center;will-change:transform;";
      layer.appendChild(clone);
      var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
      var dx = cx - centerX, dy = cy - centerY;
      var dist = Math.sqrt(dx * dx + dy * dy) || 1;
      var dirX = dx / dist, dirY = dy / dist;
      var burst = 650 + Math.random() * 500;
      return {
        el: clone,
        x: rect.left, y: rect.top, w: rect.width, h: rect.height,
        vx: dirX * burst + (Math.random() - 0.5) * 220,
        vy: dirY * burst - 380 - Math.random() * 260,
        rot: 0,
        vrot: (Math.random() - 0.5) * 900
      };
    });

    var last = null;
    var startedAt = null;
    var totalDuration = 3500;

    function step(now){
      if(last === null){ last = now; startedAt = now; }
      var dt = Math.min((now - last) / 1000, 0.032);
      last = now;
      bodies.forEach(function(b){
        b.vy += gravity * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.rot += b.vrot * dt;

        var restY = floor - b.h;
        if(b.y > restY){
          b.y = restY;
          b.vy = -b.vy * 0.42;
          b.vx *= 0.68;
          b.vrot *= 0.5;
          if(Math.abs(b.vy) < 45){ b.vy = 0; }
        }
        if(b.x < wallLeft){ b.x = wallLeft; b.vx = -b.vx * 0.5; }
        if(b.x + b.w > wallRight){ b.x = wallRight - b.w; b.vx = -b.vx * 0.5; }
        b.vx *= (1 - Math.min(dt * 1.4, 1));

        b.el.style.left = b.x + "px";
        b.el.style.top = b.y + "px";
        b.el.style.transform = "rotate(" + b.rot.toFixed(1) + "deg)";
      });
      if((now - startedAt) < totalDuration){
        requestAnimationFrame(step);
      } else {
        finishPhysicsCollapse(layer, chips);
      }
    }
    requestAnimationFrame(step);
  }

  function finishPhysicsCollapse(layer, chips){
    layer.style.transition = "opacity .25s ease";
    layer.style.opacity = "0";
    setTimeout(function(){
      layer.remove();
      chips.forEach(function(c){ c.style.visibility = ""; });
      document.body.classList.remove("physics-active");
    }, 260);
  }

  // ---------- init ----------
  window.addEventListener("DOMContentLoaded", loadState);
  // オフラインでも開けるように Service Worker を登録する（https か localhost のときだけ動く）
  if("serviceWorker" in navigator && window.isSecureContext){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(e){ console.warn("Service Worker の登録に失敗しました", e); });
    });
  }
  document.getElementById("saveWarnClose").addEventListener("click", function(){
    document.getElementById("saveWarn").hidden = true; saveWarnDismissed = true;
  });
  document.addEventListener("visibilitychange", function(){
    if(!loaded) return;
    if(document.visibilityState === "hidden"){ clearTimeout(saveTimer); saveState(); return; }
    var today = todayISO();
    if(today !== sessionDay){
      sessionDay = today;
      if(state.boardDate !== today) setBoardDate(today);
    }
  });
  window.addEventListener("pagehide", function(){ if(loaded){ clearTimeout(saveTimer); saveState(); } });
})();
</script>
</body>
</html>
