<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>配置ボード</title>
<style>
  :root{
    --bg:#EDEBE3;
    --surface:#FFFFFF;
    --ink:#23241F;
    --ink-soft:#6B6C5F;
    --line:#D9D6C9;
    --accent:#2F6B5E;
    --accent-dark:#20493F;
    --danger:#B23B32;
    --plate-red:#C6423A;
    --plate-blue:#2E5C93;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Meiryo",sans-serif;
    background:var(--bg);
    color:var(--ink);
    height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:contain;
  }

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:9px 16px;
    display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0;
  }
  .title-main{font-size:17px;font-weight:700;letter-spacing:-.01em;}
  .title-sub{font-size:12px;color:var(--ink-soft);margin-left:6px;}
  .btn-ghost{
    background:transparent;border:1px solid var(--line);border-radius:8px;
    padding:7px 13px;font-size:13px;color:var(--ink);cursor:pointer;
  }
  .btn-ghost:active{background:var(--bg);}
  .top-icon-btn{width:38px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:18px;border-radius:9px;}

  /* ---------- info bar (date + headcount, compact) ---------- */
  .info-bar{
    flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--line);
    padding:6px 16px;display:flex;align-items:center;justify-content:space-between;
    gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);
  }
  .info-date{font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;flex-shrink:0;}
  .info-date:active{opacity:.6;}
  .info-stats b{color:var(--ink);font-weight:700;}
  .stat-cat{display:inline-block;margin:-5px 0;padding:5px 3px;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;-webkit-tap-highlight-color:transparent;}
  .stat-cat:active{opacity:.55;}
  .stat-sep{margin-left:8px;}
  .cat-row-loc{font-size:12px;color:var(--ink-soft);flex-shrink:0;}

  /* ---------- board ---------- */
  .board-wrap{flex:1;overflow-y:auto;padding:12px;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
  .board-grid{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .location-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:7px 10px;
    min-height:42px;
    display:flex;flex-direction:column;gap:4px;
    transition:box-shadow .15s, border-color .15s;
  }
  .location-card.drag-over{
    border-color:var(--accent);
    box-shadow:0 0 0 2px rgba(47,107,94,.25) inset;
  }
  .location-name-row{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;}
  .location-name{font-weight:600;font-size:13px;line-height:1.25;word-break:break-word;}
  .location-edit-btn{
    flex-shrink:0;background:none;border:none;color:var(--ink-soft);
    font-size:13px;cursor:pointer;padding:2px 4px;line-height:1;
  }
  .location-body{flex:1;display:flex;flex-direction:column;gap:2px;}
  .location-half{
    display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;
    gap:5px;min-height:20px;border-radius:6px;transition:background-color .12s;
  }
  .location-half.location-row{
    flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;padding-bottom:1px;
  }
  .location-half.drag-over-half{background:rgba(47,107,94,.14);}
  .location-divider{border-top:1px dashed var(--line);margin:3px 0;}
  .location-empty-hint{font-size:11px;color:var(--ink-soft);margin:auto;}
  .add-location-card{
    border:1.5px dashed var(--line);background:transparent;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);font-size:13px;min-height:38px;
    border-radius:var(--radius);cursor:pointer;
  }
  .empty-board-msg{text-align:center;color:var(--ink-soft);font-size:13px;padding:24px 8px;}
  .location-pair-row{display:flex;align-items:stretch;gap:0;}
  .location-pair-row .location-card{flex:1;min-width:0;}
  .location-pair-row .location-card:not(:first-child){border-top-left-radius:0;border-bottom-left-radius:0;}
  .location-pair-row .location-card:not(:last-child){border-top-right-radius:0;border-bottom-right-radius:0;border-right:none;}
  .location-pair-divider{width:0;border-left:1px dashed var(--line);flex-shrink:0;}
  .location-body-split{flex-direction:row;gap:0;}
  .location-left-slot{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    flex:0 0 26px;gap:4px;min-height:100%;
  }
  .location-left-slot .nameplate-chip{
    writing-mode:vertical-rl;text-orientation:upright;padding:5px 3px;letter-spacing:1px;
  }
  .location-left-divider{width:0;border-left:1px dashed var(--line);margin:0 6px;flex-shrink:0;}
  .location-right-area{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
  .checkbox-label{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12.5px;color:var(--ink);}
  .checkbox-label input{width:auto;flex-shrink:0;}

  /* ---------- nameplate chips ---------- */
  .nameplate-chip{
    position:relative;flex-shrink:0;
    display:inline-flex;align-items:center;
    padding:3px 7px;border-radius:6px;font-size:11px;font-weight:500;
    background:#fff;border:1.5px solid var(--ink);white-space:nowrap;color:var(--ink);
    max-width:100%;overflow:hidden;text-overflow:ellipsis;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    cursor:grab;
    transition:transform .1s;
  }
  .nameplate-chip::before{
    content:"";position:absolute;inset:-6px;
  }
  .nameplate-chip:active{transform:scale(.94);}
  .nameplate-chip.plate-red{border-color:var(--plate-red);}
  .nameplate-chip.plate-blue{border-color:var(--plate-blue);}
  .nameplate-chip.plate-white{border-color:var(--ink);}
  .chip-dragging-source{opacity:.35;}
  .drag-ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:9999;box-shadow:0 8px 20px rgba(0,0,0,.28);}

  /* ---------- pool bar ---------- */
  .pool-bar{
    position:sticky;bottom:0;z-index:20;flex-shrink:0;
    background:var(--surface);border-top:1px solid var(--line);
    padding:8px 16px calc(18px + env(safe-area-inset-bottom));
  }
  .pool-label{font-size:12px;color:var(--ink-soft);margin-bottom:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;}
  .pool-label b{color:var(--ink);font-weight:600;}
  .pool-row{display:flex;align-items:center;gap:8px;}
  .pool-add-btn{
    flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1.5px dashed var(--line);
    background:transparent;color:var(--ink-soft);font-size:17px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  }
  .pool-add-btn:active{background:var(--bg);}
  .pool-scroller{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;touch-action:pan-x;flex:1;min-width:0;}
  .pool-bar.drag-over-pool{background:rgba(47,107,94,.10);}
  .pool-bar.drag-over-pool .pool-scroller{outline:2px dashed var(--accent);outline-offset:2px;border-radius:8px;}


  /* ---------- overlays / modal / sheet ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(35,36,31,.45);
    display:none;align-items:flex-end;justify-content:center;z-index:100;
  }
  .overlay.open{display:flex;}
  #templateOverlay{z-index:90;}
  #modalOverlay{z-index:110;}
  .modal,.sheet{
    background:var(--surface);width:100%;max-width:420px;
    border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    max-height:82vh;overflow-y:auto;
  }
  .sheet-header{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:16px;margin-bottom:12px;}
  .icon-btn{background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;line-height:1;padding:4px;}
  label{display:block;font-size:12px;color:var(--ink-soft);margin:14px 0 4px;}
  label.lbl-tight{margin:8px 0 4px;}
  label:first-of-type{margin-top:0;}
  input[type="text"], input[type="date"]{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;
    font-size:15px;background:var(--bg);color:var(--ink);
  }
  input[type="text"]:focus, input[type="date"]:focus{outline:2px solid var(--accent);outline-offset:1px;}
  textarea{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;
    font-size:13px;background:var(--bg);color:var(--ink);font-family:inherit;
    resize:none;min-height:90px;line-height:1.5;word-break:break-all;
  }
  textarea.ta-sm{min-height:44px;}
  textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .swatch-row{display:flex;gap:12px;margin-top:6px;}
  .swatch{
    width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer;
  }
  .swatch.selected{box-shadow:0 0 0 3px rgba(47,107,94,.35);border-color:var(--accent);}
  .swatch.plate-white-sw{background:#fff;border-color:var(--ink);}
  .swatch.plate-red-sw{background:var(--plate-red);border-color:var(--plate-red);}
  .swatch.plate-blue-sw{background:var(--plate-blue);border-color:var(--plate-blue);}
  .choice-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
  .choice-btn{
    flex:1;min-width:52px;padding:10px 8px;border:1px solid var(--line);border-radius:8px;
    text-align:center;font-size:13px;font-weight:600;cursor:pointer;
    background:var(--bg);color:var(--ink-soft);
  }
  .choice-btn.selected{background:var(--accent);color:#fff;border-color:var(--accent);}
  .modal-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
  .btn-primary{
    flex:1;background:var(--accent);color:#fff;border:none;border-radius:8px;
    padding:12px 14px;font-size:14px;font-weight:600;cursor:pointer;
  }
  .btn-primary:active{background:var(--accent-dark);}
  .btn-secondary{
    flex:1;background:transparent;border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:12px 14px;font-size:14px;cursor:pointer;
  }
  .btn-danger{
    flex:1;background:transparent;border:1px solid var(--danger);color:var(--danger);
    border-radius:8px;padding:12px 14px;font-size:14px;cursor:pointer;
  }
  .btn-sm{flex:none;padding:6px 9px;font-size:12px;}
  .confirm-msg{font-size:14px;line-height:1.7;color:var(--ink);margin:6px 0 0;}
  .sheet-section-title{
    font-size:11px;font-weight:700;color:var(--ink-soft);letter-spacing:.03em;
    margin-top:16px;margin-bottom:8px;
  }
  .sheet-collapse-toggle{
    display:flex;align-items:center;justify-content:space-between;width:100%;
    background:none;border:none;padding:0;cursor:pointer;font:inherit;text-align:left;
  }
  @keyframes physicsShake{
    0%,100%{transform:translate(0,0);}
    20%{transform:translate(-4px,2px);}
    40%{transform:translate(4px,-2px);}
    60%{transform:translate(-3px,-2px);}
    80%{transform:translate(3px,2px);}
  }
  body.physics-shake .board-wrap,body.physics-shake .topbar{animation:physicsShake .35s ease;}
  .collapse-arrow{
    display:inline-block;font-size:34px;line-height:1;color:var(--ink-soft);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
  }
  .sheet-collapse-toggle[aria-expanded="true"] .collapse-arrow{transform:rotate(180deg);}
  .sheet-section.collapsible{
    display:grid;grid-template-rows:0fr;
    transition:grid-template-rows .3s cubic-bezier(.4,0,.2,1);
  }
  .sheet-section.collapsible.open{grid-template-rows:1fr;}
  .collapsible-inner{overflow:hidden;min-height:0;}
  .sheet-section:first-of-type{margin-top:0;}
  .sheet-btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .sheet-btn-row .btn-primary, .sheet-btn-row .btn-secondary{flex:1;min-width:120px;}
  .sheet-divider{border-top:1px solid var(--line);margin-top:18px;}
  .template-list{margin-top:10px;}
  .template-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .template-name{font-size:14px;font-weight:600;flex:1;word-break:break-word;}
  .template-actions{display:flex;gap:6px;flex-shrink:0;}


  /* ---------- themes ---------- */
  /* 以前作成した各デザインを、そのまま現在の配置ボードへ移植 */
  @keyframes toyBounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-3px);}
  }
  @keyframes toyConfettiDrift{
    0%{background-position:0 0, 40px 20px, 10px 50px;}
    100%{background-position:0 40px, 40px 60px, 10px 90px;}
  }
  body[data-theme="play"]{
    --bg:#FFF3C8;--surface:#FFFFFF;--ink:#171717;--ink-soft:#5A5A5A;--line:#171717;
    --accent:#FF3D71;--accent-dark:#D51F4F;--danger:#E5395F;--plate-red:#FF6688;--plate-blue:#66D9FF;
    --radius:14px;
    background-color:#FFF3C8;
    background-image:
      radial-gradient(circle 5px at 12% 18%,rgba(255,61,113,.35),transparent 60%),
      radial-gradient(circle 4px at 78% 12%,rgba(45,91,255,.3),transparent 60%),
      radial-gradient(circle 6px at 88% 72%,rgba(255,217,40,.4),transparent 60%),
      radial-gradient(circle 4px at 22% 78%,rgba(183,243,107,.4),transparent 60%),
      radial-gradient(circle 5px at 55% 40%,rgba(102,217,255,.28),transparent 60%),
      linear-gradient(135deg,#FFF4D6 0 46%,#FFE0EB 46% 100%);
    background-size:auto,auto,auto,auto,auto,100% 100%;
    animation:toyConfettiDrift 18s linear infinite;
    overflow-x:hidden;
  }
  body[data-theme="play"]::before{
    content:"";position:fixed;top:12%;left:-20px;width:70px;height:70px;z-index:-1;pointer-events:none;
    border-radius:50%;background:#FFD928;border:3px solid #171717;
    box-shadow:4px 4px 0 #171717, 90px 120px 0 -18px #66D9FF, 90px 120px 0 -15px #171717,
      40px 200px 0 -22px #FF6688, 40px 200px 0 -19px #171717;
    opacity:.55;
  }
  body[data-theme="play"]::after{
    content:"";position:fixed;bottom:18%;right:-10px;width:54px;height:54px;z-index:-1;pointer-events:none;
    border-radius:12px;background:#B7F36B;border:3px solid #171717;transform:rotate(18deg);
    box-shadow:3px 3px 0 #171717;opacity:.5;
  }
  body[data-theme="play"] .topbar{
    background:#2D5BFF;border-bottom:4px solid #171717;box-shadow:0 5px 0 #171717;
  }
  body[data-theme="play"] .title-main{
    color:#FFF;font-weight:900;letter-spacing:.02em;
    text-shadow:3px 3px 0 #171717,-1px -1px 0 #171717;
  }
  body[data-theme="play"] .title-sub{color:#FFE566;opacity:.95;font-weight:700}
  body[data-theme="play"] .btn-ghost{
    background:#FFD928;border:3px solid #171717;color:#171717;border-radius:10px;
    font-weight:800;box-shadow:3px 3px 0 #171717;
  }
  body[data-theme="play"] .btn-ghost:active{
    transform:translate(2px,2px);box-shadow:1px 1px 0 #171717;
  }
  body[data-theme="play"] .info-bar{
    background:#FFFFFF;border-bottom:3px solid #171717;color:#555;
  }
  body[data-theme="play"] .info-date{color:#171717;font-weight:800}
  body[data-theme="play"] .info-stats b{color:#FF3D71}
  body[data-theme="play"] .location-card{
    position:relative;overflow:hidden;
    background:#FFFFFF;border:3px solid #171717;border-radius:14px;
    box-shadow:4px 4px 0 #171717;
  }
  body[data-theme="play"] .location-card::before{
    content:"";position:absolute;top:6px;right:8px;width:10px;height:10px;border-radius:50%;
    background:#FFD928;border:2px solid #171717;pointer-events:none;
  }
  body[data-theme="play"] .location-card.drag-over{
    border-color:#FF3D71;
    box-shadow:0 0 0 3px #FF3D71 inset,4px 4px 0 #171717;
  }
  body[data-theme="play"] .location-name{color:#171717;font-weight:800}
  body[data-theme="play"] .location-edit-btn{color:#555}
  body[data-theme="play"] .add-location-card{
    border:3px dashed #171717;background:#FFF9ED;color:#555;border-radius:14px;
    box-shadow:3px 3px 0 #171717;
  }
  body[data-theme="play"] .nameplate-chip{
    background:#FFEC57;color:#171717;border:3px solid #171717;border-radius:12px;
    font-weight:900;box-shadow:3px 3px 0 #171717;
  }
  body[data-theme="play"] .nameplate-chip.plate-red{
    background:#FF6688;color:#fff;border-color:#171717;
  }
  body[data-theme="play"] .nameplate-chip.plate-blue{
    background:#66D9FF;color:#171717;border-color:#171717;
  }
  body[data-theme="play"] .nameplate-chip.plate-white{
    background:#B7F36B;color:#171717;border-color:#171717;
  }
  body[data-theme="play"] .pool-bar{
    background:#FFEA66;border-top:4px solid #171717;box-shadow:0 -4px 0 rgba(23,23,23,.15);
  }
  body[data-theme="play"] .pool-label{color:#444}
  body[data-theme="play"] .pool-label b{color:#E52B22;font-weight:900}
  body[data-theme="play"] .pool-add-btn{
    border:3px solid #171717;background:#FFFFFF;color:#171717;border-radius:10px;
    font-weight:900;box-shadow:2px 2px 0 #171717;
  }
  body[data-theme="play"] .overlay{background:rgba(23,23,23,.5)}
  body[data-theme="play"] .modal,body[data-theme="play"] .sheet{
    background:#FFF8EF;border-top:4px solid #171717;box-shadow:0 -8px 0 rgba(23,23,23,.18);
  }
  body[data-theme="play"] input[type="text"],body[data-theme="play"] input[type="date"],
  body[data-theme="play"] textarea{
    background:#fff;color:#111;border:3px solid #171717;border-radius:8px;
  }
  body[data-theme="play"] .btn-primary{
    background:#FF3D71;border:3px solid #171717;color:#fff;font-weight:900;
    box-shadow:3px 3px 0 #171717;
  }
  body[data-theme="play"] .btn-secondary{
    background:#FFD928;border:3px solid #171717;color:#171717;font-weight:800;
    box-shadow:3px 3px 0 #171717;
  }

  @keyframes neonPulse{
    0%,100%{opacity:.7;filter:brightness(1);}
    50%{opacity:1;filter:brightness(1.15);}
  }
  @keyframes neonFlicker{
    0%,100%{opacity:1;}
    92%{opacity:1;}
    93%{opacity:.7;}
    94%{opacity:1;}
    96%{opacity:.85;}
    97%{opacity:1;}
  }
  body[data-theme="neon"]{
    --bg:#080014;--surface:#160A28;--ink:#FEF4FF;--ink-soft:#B48FD1;--line:#4A2A6A;
    --accent:#FF2EC4;--accent-dark:#C400A0;--danger:#FF3860;--plate-red:#FF3860;--plate-blue:#05F2FF;
    --radius:18px;
    background-color:#080014;
    background-image:
      radial-gradient(circle at 10% 0%,rgba(255,46,196,.28),transparent 32%),
      radial-gradient(circle at 90% 100%,rgba(5,242,255,.22),transparent 34%),
      radial-gradient(circle at 50% 45%,rgba(139,92,246,.12),transparent 50%);
    overflow-x:hidden;
  }
  body[data-theme="neon"]::before{
    content:"";position:fixed;top:0;left:10%;right:10%;height:2px;z-index:25;pointer-events:none;
    background:linear-gradient(90deg,transparent,#FF2EC4,#05F2FF,#FF2EC4,transparent);
    box-shadow:0 0 16px rgba(255,46,196,.6),0 0 28px rgba(5,242,255,.3);
    animation:neonPulse 2.8s ease-in-out infinite;
  }
  body[data-theme="neon"]::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(ellipse 80% 40% at 50% 100%,rgba(255,46,196,.08),transparent 60%);
  }
  body[data-theme="neon"] .topbar{
    background:rgba(12,4,24,.9);
    border-bottom:2px solid #FF2EC4;
    box-shadow:0 0 28px rgba(255,46,196,.3),0 2px 30px rgba(5,242,255,.12);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  body[data-theme="neon"] .title-main{
    letter-spacing:.1em;font-weight:800;color:#FEF4FF;
    text-shadow:0 0 10px #FF2EC4,0 0 24px rgba(255,46,196,.65),0 0 40px rgba(5,242,255,.35);
    animation:neonFlicker 5s steps(1) infinite;
  }
  body[data-theme="neon"] .title-sub{color:#C9A3E0}
  body[data-theme="neon"] .btn-ghost{
    background:#160A28;border:2px solid #05F2FF;color:#8FF9FF;border-radius:999px;

<script>
(function(){

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function todayISO(){
    var d = new Date();
    var m = (d.getMonth() + 1).toString().padStart(2, "0");
    var day = d.getDate().toString().padStart(2, "0");

  function pad2(n){ return (n < 10 ? "0" : "") + n; }
  function isoOf(y, m, d){ return y + "-" + pad2(m) + "-" + pad2(d); }
  function daysInMonth(y, m){ return new Date(y, m, 0).getDate(); }
  function formatDateJP(iso){
    var parts = iso.split("-");
    var y = parseInt(parts[0], 10), m = parseInt(parts[1], 10), d = parseInt(parts[2], 10);
    var weekdays = ["日","月","火","水","木","金","土"];
    var w = weekdays[new Date(y, m - 1, d).getDay()];

  function bytesToBase64(bytes){
    var bin = "", CHUNK = 0x8000;

    });

  // ---------- template share codes ----------
  var TEMPLATE_CODE_PREFIX = "P3:";
  var TYPE_CODES = ["2行", "2人", "3人"];
  var COLOR_CODES = ["white", "red", "blue"];
  var CATEGORY_LETTERS = ["S", "M", "L"];

  function typeToCode(t){ var i = TYPE_CODES.indexOf(t); return i === -1 ? 0 : i; }

  function codeToColor(c){ return COLOR_CODES[c] || "white"; }
  // categories are a small set (S/M/L) that can be combined, so we pack them

  function categoriesToCode(arr){

  }
  function slotToCode(s){ var i = SLOT_CODES.indexOf(s || ""); return i === -1 ? 0 : i; }
  function codeToSlot(c){ var v = SLOT_CODES[c]; return v ? v : null; }

  // Plain control characters as delimiters: never appear in normal typed
  // names, so no escaping is needed and no JSON punctuation overhead either.
  var FS = "\u001F"; // between fields within one record
  var RS = "\u001E"; // between records in a list
  var GS = "\u001D"; // between the name / locations / nameplates sections

  async function encodeTemplateCode(tpl){
    var locStr = tpl.locationNames.map(function(item){
      var name = (typeof item === "string") ? item : item.name;
      var type = (typeof item === "string" || !item.type) ? "2行" : item.type;
      var leftSlot = (typeof item === "string") ? 0 : (item.leftSlot ? 1 : 0);
      return name + FS + typeToCode(type) + FS + leftSlot;
    }).join(RS);
    var npStr = (tpl.nameplates || []).map(function(np){
      var number = (np.number === null || np.number === undefined) ? "" : np.number;
      var time = (np.time === null || np.time === undefined) ? "" : np.time;
      return np.name + FS + number + FS + time + FS + colorToCode(np.color) + FS + categoriesToCode(np.categories);
    }).join(RS);
    var payload = tpl.name + GS + locStr + GS + npStr;
    var bytes = new TextEncoder().encode(payload);
    if(typeof CompressionStream !== "undefined"){
      var stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
      var compressed = new Uint8Array(await new Response(stream).arrayBuffer());
      var b64 = bytesToBase64(compressed);
      return TEMPLATE_CODE_PREFIX + b64;
    }
    // Older browsers: keep the same P3 format without compression.
    var b64plain = btoa(unescape(encodeURIComponent(payload)));
    return TEMPLATE_CODE_PREFIX + b64plain;
  }

  async function decodeTemplateCode(code){
    var trimmed = (code || "").trim();
    if(trimmed.indexOf(TEMPLATE_CODE_PREFIX) !== 0){
      throw new Error("このコードは読み込めませんでした。コピーした共有コード全体を貼り付けてください。");
    }
    var b64 = trimmed.slice(TEMPLATE_CODE_PREFIX.length);
    var payload;
    try{
      var binary = atob(b64);
      var bytes = Uint8Array.from(binary, function(c){ return c.charCodeAt(0); });
      // P3 compressed format (gzip). If it isn't gzip, accept legacy P3 codes.
      if(bytes.length >= 2 && bytes[0] === 0x1f && bytes[1] === 0x8b && typeof DecompressionStream !== "undefined"){
        var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        payload = new TextDecoder().decode(await new Response(stream).arrayBuffer());
      }else{
        payload = decodeURIComponent(escape(binary));
      }
    }catch(e){
      throw new Error("コードの形式が正しくありません。");
    }
    var sections = payload.split(GS);
    var name = sections[0];
    if(!name){
      throw new Error("コードの中身が正しくありません。");
    }
    var locStr = sections[1] || "";
    var npStr = sections[2] || "";
    var locationNames = locStr.length === 0 ? [] : locStr.split(RS).map(function(rec){
      var f = rec.split(FS);
      return { name: f[0], type: codeToType(parseInt(f[1], 10)), leftSlot: f[2] === "1" };
    });
    var nameplates = npStr.length === 0 ? [] : npStr.split(RS).map(function(rec){
      var f = rec.split(FS);
      return {
        name: f[0],
        number: f[1] === "" ? null : parseInt(f[1], 10),
        time: f[2] === "" ? null : parseInt(f[2], 10),
        color: codeToColor(parseInt(f[3], 10)),
        categories: codeToCategories(parseInt(f[4], 10))
      };
    });
    return { name: name, locationNames: locationNames, nameplates: nameplates };
  }

  // ---------- persistence ----------
  // Fully offline: persistence uses localStorage only. No network or cloud
  // storage of any kind is used by this tool.
  var saveTimer = null;
  var loaded = false;          // 読み込みが終わるまで保存しない（空のデータで上書きしないため）
  var loadProblem = null;      // 読み込めなかった保存データの情報
  var saveBlocked = false;     // 元データを退避できなかったとき、上書きしないよう保存を止める
  var storageBroken = false;   // 保存領域が使えない
  var saveWarnDismissed = false;
  var sessionDay = null;       // このセッションで「今日」だと思っている日付

  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveState, 150);
  }
  function setSaveWarning(on, message){
    var el = document.getElementById("saveWarn");
    if(!el) return;
    if(on){
      if(message) document.getElementById("saveWarnText").textContent = message;
      if(!saveWarnDismissed) el.hidden = false;
    } else {
      el.hidden = true; saveWarnDismissed = false;
    }
  }
  var SAVE_FAIL_MESSAGE = "⚠ 保存できていません。保存領域がいっぱいか、保存が許可されていない可能性があります。このまま閉じると入力した内容が消えます。";
  function saveState(){
    if(!loaded) return;
    if(saveBlocked){ setSaveWarning(true, "⚠ 元のデータを守るため、保存を止めています。このまま閉じると入力した内容が消えます。"); return; }
    syncPlacementsToDay();
    var json = JSON.stringify(state);
    try{
      localStorage.setItem(STORAGE_KEY, json);
      setSaveWarning(false);
    }catch(e){
      console.error("localStorage save failed", e);
      setSaveWarning(true, SAVE_FAIL_MESSAGE);
    }
  }

  // ---------- 日付ごとの配置 ----------
  // ネームプレートの locationId / slot は「表示中の日付の配置」。
  // 日付を切り替えるときに state.dayPlacements[日付] = [[id, 配置場所id, slot], …]（並び順つき）へ
  // 保存し、切り替え先の配置を復元する。まだ配置していない日付は全員が未配置から始まる。
  function syncPlacementsToDay(){
    var iso = state.boardDate;
    if(!iso) return;
    var list = [];
    state.nameplates.forEach(function(n){ if(n.locationId) list.push([n.id, n.locationId, n.slot || null]); });
    if(list.length) state.dayPlacements[iso] = list; else delete state.dayPlacements[iso];
    pruneDayPlacements();
  }
  function pruneDayPlacements(){
    var npIds = Object.create(null), locIds = Object.create(null);
    state.nameplates.forEach(function(n){ npIds[n.id] = true; });
    state.locations.forEach(function(l){ locIds[l.id] = true; });
    var limit = dayNumToISO(isoToDayNum(todayISO()) - 370);
    Object.keys(state.dayPlacements).forEach(function(iso){
      var list = state.dayPlacements[iso];
      if(iso < limit || !Array.isArray(list)){ delete state.dayPlacements[iso]; return; }
      list = list.filter(function(p){ return Array.isArray(p) && npIds[p[0]] && locIds[p[1]]; });
      if(list.length) state.dayPlacements[iso] = list; else delete state.dayPlacements[iso];
    });
  }
  function loadPlacementsForDay(iso){
    var list = state.dayPlacements[iso];
    if(!Array.isArray(list)) list = [];
    var locIds = Object.create(null), byId = Object.create(null);
    state.locations.forEach(function(l){ locIds[l.id] = true; });
    list.forEach(function(p, idx){
      if(Array.isArray(p) && locIds[p[1]]) byId[p[0]] = { loc: p[1], slot: p[2] || null, idx: idx };
    });
    var placed = [], rest = [];
    state.nameplates.forEach(function(n){
      var q = byId[n.id];
      if(q){ n.locationId = q.loc; n.slot = q.slot; placed.push(n); }
      else { n.locationId = null; n.slot = null; rest.push(n); }
    });
    placed.sort(function(a, b){ return byId[a.id].idx - byId[b.id].idx; });   // 同じ場所での並び順を復元
    state.nameplates = placed.concat(rest);
    sanitizeOffPlacements();
  }
  // 休みの人は配置しない（表示中の日付で休みになっている人を未配置に戻す）
  function sanitizeOffPlacements(){
    var iso = state.boardDate;
    state.nameplates.forEach(function(n){
      if(n.locationId && isOff(n.name, iso)){ n.locationId = null; n.slot = null; }
    });
  }
  // 指定した日付でその人の配置を外す（休みを入れたとき）
  function unplaceOnDate(name, iso){
    var ids = Object.create(null);
    state.nameplates.forEach(function(n){
      if(n.name !== name) return;
      ids[n.id] = true;
      if(iso === state.boardDate){ n.locationId = null; n.slot = null; }
    });
    var list = state.dayPlacements[iso];
    if(Array.isArray(list)){
      list = list.filter(function(p){ return !ids[p[0]]; });
      if(list.length) state.dayPlacements[iso] = list; else delete state.dayPlacements[iso];
    }
  }
  function setBoardDate(iso){
    if(!iso) return;
    if(iso !== state.boardDate){
      syncPlacementsToDay();
      state.boardDate = iso;
      loadPlacementsForDay(iso);
      scheduleSave();
    }
    renderDateBar(); renderAll();
  }

  // ---------- 保存データが壊れていたとき ----------
  function resetStateToDefaults(){
    state.locations = []; state.nameplates = []; state.templates = []; state.boards = [];
    state.currentTemplateName = null; state.boardDate = null; state.theme = "default";
    state.dayoffs = {}; state.dayPlacements = {}; state.shiftFilter = false;
  }
  // 読めなかった元データを別のキーへ退避する（最新の2件だけ残す）。失敗したら null。
  function backupCorruptData(raw){
    var prefix = STORAGE_KEY + "-corrupt-", key = prefix + Date.now();
    try{
      localStorage.setItem(key, raw);
      var olds = [];
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(k && k.indexOf(prefix) === 0) olds.push(k);
      }
      olds.sort();
      while(olds.length > 2){ localStorage.removeItem(olds.shift()); }
      return key;
    }catch(e){ return null; }
  }
  function showLoadProblem(){
    var p = loadProblem;
    openModal(function(box){
      box.innerHTML =
        '<div class="sheet-header"><span>保存データを読み込めませんでした</span></div>' +
        '<p class="confirm-msg">' + (p.backupKey
          ? '元のデータは端末の中に退避してあり、消してはいません。いまは空の状態で始めます。'
          : '元のデータを退避できなかったため、上書きしないように保存を止めています。') + '</p>' +
        '<p class="confirm-msg" style="font-size:12px;color:var(--ink-soft);">「壊れたデータをコピー」でメモアプリなどに控えておくと、あとで復旧する手がかりになります。</p>' +
        '<textarea id="brokenArea" readonly rows="1" style="position:absolute;left:-9999px;"></textarea>' +
        '<div class="modal-actions">' +
          '<button class="btn-secondary" id="copyBrokenBtn" type="button">壊れたデータをコピー</button>' +
          (p.backupKey ? '<button class="btn-primary" id="closeBtn" type="button">閉じる</button>'
                       : '<button class="btn-danger" id="discardBtn" type="button">破棄して新しく始める</button>') +
        '</div>';
      var area = box.querySelector("#brokenArea"), copyBtn = box.querySelector("#copyBrokenBtn");
      area.value = p.raw;
      copyBtn.addEventListener("click", function(){
        copyToClipboard(p.raw, area, function(){ copyBtn.textContent = "コピーしました"; });
      });
      var closeBtn = box.querySelector("#closeBtn");
      if(closeBtn) closeBtn.addEventListener("click", closeModal);
      var discardBtn = box.querySelector("#discardBtn");
      if(discardBtn) discardBtn.addEventListener("click", function(){
        saveBlocked = false; setSaveWarning(false); scheduleSave(); closeModal();
      });
    });
  }

  function loadState(){
    var raw = null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }
    catch(e){ storageBroken = true; }
    if(raw){
      try{
        var parsed = JSON.parse(raw);
        if(!parsed || typeof parsed !== "object" || Array.isArray(parsed)) throw new Error("invalid");
        ["locations", "nameplates", "templates", "boards"].forEach(function(k){
          if(parsed[k] != null && !Array.isArray(parsed[k])) throw new Error("invalid " + k);
        });
        state.locations = parsed.locations || [];
        state.nameplates = parsed.nameplates || [];
        state.templates = parsed.templates || [];
        state.boards = parsed.boards || [];
        state.currentTemplateName = parsed.currentTemplateName || null;
        state.boardDate = parsed.boardDate || null;
        state.theme = parsed.theme || "default";
        if(state.theme === "mono") state.theme = "default";   // 削除したテーマ
        if(parsed.dayoffs && typeof parsed.dayoffs === "object"){
          state.dayoffs = parsed.dayoffs;
        } else if(parsed.shifts && typeof parsed.shifts === "object"){
          state.dayoffs = convertWorkdaysToDayoffs(parsed.shifts);   // 旧形式（出勤日を入力）から変換
        } else {
          state.dayoffs = {};
        }
        state.dayPlacements = (parsed.dayPlacements && typeof parsed.dayPlacements === "object" && !Array.isArray(parsed.dayPlacements)) ? parsed.dayPlacements : {};
        state.shiftFilter = parsed.shiftFilter === true;   // 初期状態はオフ
      }catch(e){
        // 読めないデータを空の状態で上書きしてしまわないよう、先に退避する
        resetStateToDefaults();
        var backupKey = backupCorruptData(raw);
        loadProblem = { raw: raw, backupKey: backupKey };
        if(!backupKey) saveBlocked = true;
      }
    }
    // migrate legacy single "category" (string, incl. old "W") -> "categories" array
    function migrateCategory(n){
      if(Array.isArray(n.categories)) return;
      var c = n.category;
      if(c === "W") c = "M";
      n.categories = c ? [c] : [];
      delete n.category;
    }
    (state.nameplates || []).forEach(migrateCategory);
    (state.templates || []).forEach(function(t){ (t.nameplates || []).forEach(migrateCategory); });
    (state.boards || []).forEach(function(b){ (b.nameplates || []).forEach(migrateCategory); });

    // 開くたびに日付を今日に合わせる。前の日付の配置は日付ごとに保存しておく（◀▶や日付指定で見返せる）
    var today = todayISO();
    sessionDay = today;
    if(!state.boardDate) state.boardDate = today;
    if(state.boardDate !== today){
      syncPlacementsToDay();
      state.boardDate = today;
      loadPlacementsForDay(today);
      if(!loadProblem) scheduleSave();
    } else {
      sanitizeOffPlacements();
    }
    document.body.dataset.theme = state.theme || "default";
    updateTemplateLabel();
    renderDateBar();
    renderAll();
    loaded = true;
    if(storageBroken) setSaveWarning(true, SAVE_FAIL_MESSAGE);
    else if(saveBlocked) setSaveWarning(true, "⚠ 元のデータを守るため、保存を止めています。このまま閉じると入力した内容が消えます。");
    if(loadProblem) showLoadProblem();
  }

  // ---------- DOM refs ----------
  var boardGrid = document.getElementById("boardGrid");
  var poolScroller = document.getElementById("poolScroller");
  var poolBarEl = document.querySelector(".pool-bar");
  var modalOverlay = document.getElementById("modalOverlay");
  var modalBox = document.getElementById("modalBox");
  var templateOverlay = document.getElementById("templateOverlay");

  // ---------- render ----------
  function renderAll(){ renderBoard(); renderPool(); renderStats(); }

  function renderStats(){
    var statsBar = document.getElementById("statsBar");
    var placed = state.nameplates.filter(function(n){ return !!n.locationId && isVisibleOnBoard(n); });
    var hiddenCount = state.nameplates.filter(function(n){ return !isVisibleOnBoard(n); }).length;
    var counts = { S:0, M:0, L:0 };
    placed.forEach(function(n){
      (n.categories || []).forEach(function(c){
        if(Object.prototype.hasOwnProperty.call(counts, c)) counts[c]++;
      });
    });
    statsBar.innerHTML =
      '<span class="stat-cat" data-cat="S">S:<b>' + counts.S + '</b></span>' +
      '<span class="stat-cat" data-cat="M">M:<b>' + counts.M + '</b></span>' +
      '<span class="stat-cat" data-cat="L">L:<b>' + counts.L + '</b></span>' +
      '<span class="stat-sep">合計<b>' + placed.length + '</b>人</span>' +
      (hiddenCount > 0 ? '<span class="stat-sep">休み<b>' + hiddenCount + '</b>人</span>' : '');
  }

  function colorClass(color){
    return color === "red" ? "plate-red" : color === "blue" ? "plate-blue" : "plate-white";
  }

  function sortByNumber(arr){
    return arr.slice().sort(function(a, b){
      var an = (a.number === null || a.number === undefined) ? null : a.number;
      var bn = (b.number === null || b.number === undefined) ? null : b.number;
      if(an !== null && bn !== null) return an - bn;
      if(an !== null) return -1;
      if(bn !== null) return 1;
      return 0;
    });
  }

  function sortByTimeField(arr){
    return arr.slice().sort(function(a, b){
      var at = (a.time === null || a.time === undefined) ? null : a.time;
      var bt = (b.time === null || b.time === undefined) ? null : b.time;
      if(at !== null && bt !== null) return at - bt;
      if(at !== null) return -1;
      if(bt !== null) return 1;
      return 0;
    });
  }

  // If another nameplate already holds `newNumber`, push it (and everything
  // after it) back by one to make room, so numbers never collide.
  function insertNumberIfColliding(newNumber, excludeId){
    if(newNumber === null || newNumber === undefined) return;
    var collision = state.nameplates.some(function(n){
      return n.id !== excludeId && n.number === newNumber;
    });
    if(!collision) return;
    state.nameplates.forEach(function(n){
      if(n.id !== excludeId && n.number !== null && n.number !== undefined && n.number >= newNumber){
        n.number = n.number + 1;
      }
    });
  }

  function createChip(np){
    var chip = document.createElement("div");
    chip.className = "nameplate-chip " + colorClass(np.color);
    chip.textContent = np.name;
    chip.dataset.nameplateId = np.id;
    // タップ編集はclickでも受ける。pointerイベントがOS/ブラウザ側で
    // キャンセルされた場合でも、通常のタップなら編集を開けるようにする。
    chip.addEventListener("click", function(e){
      if(chip.dataset.suppressClick === "1"){
        chip.dataset.suppressClick = "0";
        return;
      }
      openEditNameplateModal(np.id);
    });
    makeDraggable(chip, np.id);
    return chip;
  }

  function createEmptyHint(){
    var hint = document.createElement("div");
    hint.className = "location-empty-hint";
    hint.textContent = "ここに配置";
    return hint;
  }

  function buildLocationCard(loc){
    var card = document.createElement("div");
    card.className = "location-card";
    card.dataset.locationId = loc.id;
    var type = loc.type || "2行";
    card.dataset.locType = type;
    var hasLeftSlot = !!(loc.leftSlot && type === "2行");
    card.dataset.leftSlot = hasLeftSlot ? "1" : "0";

    var nameRow = document.createElement("div");
    nameRow.className = "location-name-row";
    var nameSpan = document.createElement("span");
    nameSpan.className = "location-name";
    nameSpan.textContent = loc.name;
    var editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.className = "location-edit-btn";
    editBtn.textContent = "✎";
    editBtn.addEventListener("click", function(e){
      e.stopPropagation();
      openEditLocationModal(loc.id);
    });
    nameRow.appendChild(nameSpan);
    nameRow.appendChild(editBtn);
    card.appendChild(nameRow);

    var body = document.createElement("div");
    body.className = "location-body";
    var placedAll = state.nameplates.filter(function(n){ return n.locationId === loc.id && isVisibleOnBoard(n); });

    if(type === "2人" || type === "3人"){
      if(placedAll.length === 0){
        body.appendChild(createEmptyHint());
      } else {
        var singleHalf = document.createElement("div");
        singleHalf.className = "location-half";
        singleHalf.dataset.slot = "top";
        placedAll = sortByTimeField(placedAll);
        placedAll.forEach(function(np){ singleHalf.appendChild(createChip(np)); });
        body.appendChild(singleHalf);
      }
    } else if(hasLeftSlot){
      body.classList.add("location-body-split");
      var leftItems = sortByTimeField(placedAll.filter(function(n){ return n.slot === "left"; }));
      var rightItems = sortByTimeField(placedAll.filter(function(n){ return n.slot !== "left"; }));

      var leftSlotEl = document.createElement("div");
      leftSlotEl.className = "location-half location-left-slot";
      leftSlotEl.dataset.slot = "left";
      leftItems.forEach(function(np){ leftSlotEl.appendChild(createChip(np)); });

      var leftDivider = document.createElement("div");
      leftDivider.className = "location-left-divider";

      var rightArea = document.createElement("div");
      rightArea.className = "location-right-area";
      if(rightItems.length === 0 && leftItems.length === 0){
        rightArea.appendChild(createEmptyHint());
      } else {
        var rTop = sortByTimeField(rightItems.filter(function(n){ return (n.slot || "top") === "top"; }));
        var rBottom = sortByTimeField(rightItems.filter(function(n){ return n.slot === "bottom"; }));

        var rTopHalf = document.createElement("div");
        rTopHalf.className = "location-half location-row";
        rTopHalf.dataset.slot = "top";
        rTop.forEach(function(np){ rTopHalf.appendChild(createChip(np)); });

        var rDivider = document.createElement("div");
        rDivider.className = "location-divider";

        var rBottomHalf = document.createElement("div");
        rBottomHalf.className = "location-half location-row";
        rBottomHalf.dataset.slot = "bottom";
        rBottom.forEach(function(np){ rBottomHalf.appendChild(createChip(np)); });

        rightArea.appendChild(rTopHalf);
        rightArea.appendChild(rDivider);
        rightArea.appendChild(rBottomHalf);
      }

      body.appendChild(leftSlotEl);
      body.appendChild(leftDivider);
      body.appendChild(rightArea);
    } else {
      if(placedAll.length === 0){
        body.appendChild(createEmptyHint());
      } else {
        var topItems = sortByTimeField(placedAll.filter(function(n){ return (n.slot || "top") === "top"; }));
        var bottomItems = sortByTimeField(placedAll.filter(function(n){ return n.slot === "bottom"; }));

        var topHalf = document.createElement("div");
        topHalf.className = "location-half location-row";
        topHalf.dataset.slot = "top";
        topItems.forEach(function(np){ topHalf.appendChild(createChip(np)); });

        var divider = document.createElement("div");
        divider.className = "location-divider";

        var bottomHalf = document.createElement("div");
        bottomHalf.className = "location-half location-row";
        bottomHalf.dataset.slot = "bottom";
        bottomItems.forEach(function(np){ bottomHalf.appendChild(createChip(np)); });

        body.appendChild(topHalf);
        body.appendChild(divider);
        body.appendChild(bottomHalf);
      }
    }
    card.appendChild(body);
    return card;
  }

  function renderBoard(){
    boardGrid.innerHTML = "";
    if(state.locations.length === 0){
      var empty = document.createElement("div");
      empty.className = "empty-board-msg";
      empty.textContent = "まだ配置場所がありません。下の「＋ 配置場所を追加」から作成してください。";
      boardGrid.appendChild(empty);
    }
    for(var idx = 0; idx < state.locations.length; idx++){
      var loc = state.locations[idx];
      var type = loc.type || "2行";
      var isSmall = (type === "2人" || type === "3人");

      if(isSmall){
        var group = [loc];
        while(group.length < 3){
          var next = state.locations[idx + group.length];
          if(!next) break;
          var nextType = next.type || "2行";
          if(nextType === "2人" || nextType === "3人"){ group.push(next); }
          else break;
        }
        if(group.length > 1){
          var pairRow = document.createElement("div");
          pairRow.className = "location-pair-row";
          group.forEach(function(g, gi){
            pairRow.appendChild(buildLocationCard(g));
            if(gi < group.length - 1){
              var pairDivider = document.createElement("div");

        } else {

  // ---------- drag & drop (long press then move) ----------
  function findScrollAncestor(el){
    return el.closest(".pool-scroller, .location-row, .board-wrap");
  }

  function cancelMomentum(el){
    if(el._momentumRAF){
      cancelAnimationFrame(el._momentumRAF);
      el._momentumRAF = null;
    }
  }
  function startMomentum(el, velX, velY){
    cancelMomentum(el);
    if(Math.abs(velX) < 0.03 && Math.abs(velY) < 0.03) return;
    var lastTime = performance.now();
    function step(now){
      var dt = now - lastTime;
      lastTime = now;
      if(dt > 100) dt = 100;
      el.scrollLeft += -velX * dt;
      el.scrollTop += -velY * dt;
      var decay = Math.pow(0.94, dt / 16);
      velX *= decay; velY *= decay;
      if(Math.abs(velX) > 0.02 || Math.abs(velY) > 0.02){
        el._momentumRAF = requestAnimationFrame(step);
      } else {
        el._momentumRAF = null;
      }
    }
    el._momentumRAF = requestAnimationFrame(step);
  }

  function makeDraggable(chipEl, nameplateId){
    chipEl.addEventListener("pointerdown", function(e){
      if(e.pointerType === "mouse" && e.button !== 0) return;

      var ctx = {
        id: nameplateId,
        startX: e.clientX, startY: e.clientY,
        lastX: e.clientX, lastY: e.clientY,
        dragging: false,
        scrolling: false,
        scrollEl: null,
        scrollStartLeft: 0,
        scrollStartTop: 0,
        history: [{ x:e.clientX, y:e.clientY, t:performance.now() }],
        pointerId: e.pointerId,
        origEl: chipEl,
        ghost: null, ghostW: 0, ghostH: 0,
        lastTarget: null,
        dropSlot: null,
        timer: null
      };

      chipEl.classList.add("chip-pressing");
      ctx.timer = setTimeout(function(){ beginDrag(ctx, ctx.lastX, ctx.lastY); }, 220);

      function onMove(ev){
        if(ev.pointerId !== ctx.pointerId) return;
        ctx.lastX = ev.clientX; ctx.lastY = ev.clientY;
        ctx.history.push({x:ev.clientX,y:ev.clientY,t:performance.now()});
        if(ctx.history.length > 6) ctx.history.shift();

        if(ctx.scrolling){
          ev.preventDefault();
          var dxs = ev.clientX - ctx.startX, dys = ev.clientY - ctx.startY;
          ctx.scrollEl.scrollLeft = ctx.scrollStartLeft - dxs;
          ctx.scrollEl.scrollTop = ctx.scrollStartTop - dys;
          return;
        }

        if(!ctx.dragging){
          var dx = ev.clientX - ctx.startX, dy = ev.clientY - ctx.startY;
          // A small finger wobble is still a tap. Only turn it into scrolling/dragging
          // after a clearly intentional movement.
          if(Math.abs(dx) > 28 || Math.abs(dy) > 28){
            clearTimeout(ctx.timer);
            chipEl.classList.remove("chip-pressing");
            var scrollEl = findScrollAncestor(chipEl);
            if(scrollEl){
              cancelMomentum(scrollEl);
              ctx.scrolling = true;
              ctx.scrollEl = scrollEl;
              ctx.scrollStartLeft = scrollEl.scrollLeft;
              ctx.scrollStartTop = scrollEl.scrollTop;
              ev.preventDefault();
            } else {
              cleanup();
            }
          }
          return;
        }

        ev.preventDefault();
        moveGhost(ctx, ev.clientX, ev.clientY);
        updateDropTarget(ctx, ev.clientX, ev.clientY);
      }

      function onUp(ev){
        if(ev.pointerId !== ctx.pointerId) return;
        clearTimeout(ctx.timer);
        chipEl.classList.remove("chip-pressing");

        var totalDx = Math.abs(ctx.lastX - ctx.startX);
        var totalDy = Math.abs(ctx.lastY - ctx.startY);

        if(ctx.dragging){
          if(totalDx < 12 && totalDy < 12){
            cancelDragVisuals(ctx);
            ev.preventDefault();
            openEditNameplateModal(nameplateId);
          } else {
            chipEl.dataset.suppressClick = "1";
            finishDrag(ctx);
          }
        } else if(ctx.scrolling){
          if(totalDx < 20 && totalDy < 20){
            ctx.scrollEl.scrollLeft = ctx.scrollStartLeft;
            ctx.scrollEl.scrollTop = ctx.scrollStartTop;
            ev.preventDefault();
            openEditNameplateModal(nameplateId);
          } else {
            chipEl.dataset.suppressClick = "1";
            var first = ctx.history[0], last = ctx.history[ctx.history.length - 1];
            var dt = last.t - first.t;
            if(dt > 0){
              startMomentum(ctx.scrollEl, (last.x-first.x)/dt, (last.y-first.y)/dt);
            }
          }
        } else {
          // 普通のタップはclick側で編集を開く。
          // pointerupでpreventDefaultしないことで、Androidのclickフォールバックを確実に発火させる。
        }
        cleanup();
      }

      function cleanup(){
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        document.removeEventListener("pointercancel", onUp);
      }

      document.addEventListener("pointermove", onMove, {passive:false});
      document.addEventListener("pointerup", onUp);
      document.addEventListener("pointercancel", onUp);
    });
  }

  function cancelDragVisuals(ctx){
    if(ctx.ghost) ctx.ghost.remove();
    ctx.origEl.classList.remove("chip-dragging-source");
    if(ctx.lastTarget){
      ctx.lastTarget.classList.remove("drag-over");
      clearHalfHighlight(ctx.lastTarget);
    }
    poolBarEl.classList.remove("drag-over-pool");
  }

  function beginDrag(ctx, clientX, clientY){
    ctx.dragging = true;
    ctx.origEl.classList.add("chip-dragging-source");
    var ghost = ctx.origEl.cloneNode(true);
    ghost.classList.add("drag-ghost");
    document.body.appendChild(ghost);
    ctx.ghost = ghost;
    ctx.ghostW = ghost.offsetWidth;
    ctx.ghostH = ghost.offsetHeight;
    moveGhost(ctx, clientX, clientY);
    if(navigator.vibrate){ navigator.vibrate(8); }
  }


  function moveGhost(ctx, x, y){
    if(!ctx.ghost) return;
    ctx.ghost.style.transform = "translate(" + (x - ctx.ghostW/2) + "px," + (y - ctx.ghostH/2) + "px) scale(1.05)";
  }

  function clearHalfHighlight(card){
    if(!card) return;
    card.querySelectorAll(".location-half").forEach(function(h){ h.classList.remove("drag-over-half"); });
  }
  function highlightHalf(card, slot){
    card.querySelectorAll(".location-half").forEach(function(h){
      h.classList.toggle("drag-over-half", h.dataset.slot === slot);
    });
  }

  function updateDropTarget(ctx, x, y){
    if(ctx.ghost) ctx.ghost.style.display = "none";
    var elUnder = document.elementFromPoint(x, y);
    if(ctx.ghost) ctx.ghost.style.display = "";
    var card = elUnder ? elUnder.closest(".location-card") : null;
    var overPool = !!(elUnder && elUnder.closest(".pool-bar"));
    if(overPool) card = null;

    if(ctx.lastTarget && ctx.lastTarget !== card){
      ctx.lastTarget.classList.remove("drag-over");
      clearHalfHighlight(ctx.lastTarget);
    }
    if(card){ card.classList.add("drag-over"); }
    ctx.lastTarget = card;
    poolBarEl.classList.toggle("drag-over-pool", overPool);

    ctx.dropSlot = null;
    if(card){
      if(card.dataset.locType !== "2行"){
        ctx.dropSlot = "top";
        highlightHalf(card, "top");
      } else if(card.dataset.leftSlot === "1"){
        var bodyElL = card.querySelector(".location-body");
        var rectL = bodyElL.getBoundingClientRect();
        var leftBoundary = rectL.left + Math.min(84, rectL.width * 0.4);
        if(x < leftBoundary){
          ctx.dropSlot = "left";
          highlightHalf(card, "left");
        } else {
          var midL = rectL.top + rectL.height / 2;
          ctx.dropSlot = (y < midL) ? "top" : "bottom";
          highlightHalf(card, ctx.dropSlot);
        }
      } else {
        var bodyEl = card.querySelector(".location-body");
        var rect = bodyEl.getBoundingClientRect();
        var mid = rect.top + rect.height / 2;
        ctx.dropSlot = (y < mid) ? "top" : "bottom";
        highlightHalf(card, ctx.dropSlot);
      }
    }
  }

  function finishDrag(ctx){
    if(ctx.ghost) ctx.ghost.remove();
    ctx.origEl.classList.remove("chip-dragging-source");
    if(ctx.lastTarget){
      ctx.lastTarget.classList.remove("drag-over");
      clearHalfHighlight(ctx.lastTarget);
    }
    poolBarEl.classList.remove("drag-over-pool");

    var fromIdx = state.nameplates.findIndex(function(n){ return n.id === ctx.id; });
    if(fromIdx === -1) return;
    var np = state.nameplates.splice(fromIdx, 1)[0];

    var locId = ctx.lastTarget ? ctx.lastTarget.dataset.locationId : null;
    np.locationId = locId || null;
    np.slot = locId ? (ctx.dropSlot || "top") : null;

    var insertIndex = state.nameplates.length;
    if(locId){
      var lastIdx = -1;
      for(var i = 0; i < state.nameplates.length; i++){
        var n = state.nameplates[i];
        if(n.locationId === locId && (n.slot || "top") === np.slot) lastIdx = i;
      }
      insertIndex = (lastIdx === -1) ? state.nameplates.length : lastIdx + 1;
    }
    state.nameplates.splice(insertIndex, 0, np);

    scheduleSave();
    renderAll();
  }

        '</div>';

      var input = box.querySelector("#npNameInput");
      var numberInput = box.querySelector("#npNumberInput");
      var timeInput = box.querySelector("#npTimeInput");
      function toField(v){ return (v === null || v === undefined) ? "" : v; }
      function fromField(el){ return el.value !== "" ? parseInt(el.value, 10) : null; }
      if(isEdit){
        input.value = np.name;
        numberInput.value = toField(np.number);
        timeInput.value = toField(np.time);
      }

      var selectedColor = isEdit ? np.color : "white";
      var selectedCategories = (isEdit && Array.isArray(np.categories)) ? np.categories.slice() : [];
      var swatches = box.querySelectorAll(".swatch");

        swatches.forEach(function(sw){ sw.classList.toggle("selected", sw.dataset.color === selectedColor); });
      }
      function refreshCategories(){
        catBtns.forEach(function(b){
          var cat = b.dataset.cat;
          b.classList.toggle("selected", cat === "" ? selectedCategories.length === 0 : selectedCategories.indexOf(cat) !== -1);
        });

        sw.addEventListener("click", function(){ selectedColor = sw.dataset.color; refreshSwatches(); });
      });
      catBtns.forEach(function(btn){

          var cat = btn.dataset.cat;

            selectedCategories = [];

            if(idx === -1){ selectedCategories.push(cat); } else { selectedCategories.splice(idx, 1); }

          refreshCategories();

      refreshCategories();

        var name = input.value.trim();

        var newNumber = fromField(numberInput), time = fromField(timeInput);

  // 新しい一覧の各要素に、同じ名前の古い要素のIDを先頭から順に割り当てる（同名が複数あっても1対1）
  function reuseIdsByName(newItems, oldItems){

    oldItems.forEach(function(o){ (pool[o.name] = pool[o.name] || []).push(o.id); });

  // ---------- shift (休みシフト) ----------
  // state.dayoffs = { "<名前>": { "YYYY-MM-DD": 1 | "有" | "指", ... } }   ← 休みの日を入力する
  //   1 = 休（手入力はこれだけ）、"有" = 有給、"指" = 指定休（Excel・共有コードから読み込んだとき）
  // 名前をキーにしているので、テンプレート適用や配置コードの読み込みで
  // ネームプレートが作り直されても、休みはそのまま残る。
  // 絞り込みがオンのときは、ボードの日付が休みになっている人が
  // ボード・未配置の両方から外れる（休みを入力していない日は出勤扱い）。
  function getDayoffs(name){
    return Object.prototype.hasOwnProperty.call(state.dayoffs, name) ? state.dayoffs[name] : null;
  }
  function isOff(name, iso){
    var m = getDayoffs(name);
    return !!(m && m[iso]);
  }
  // 休みの種類: "休" / "有" / "指"。休みでなければ null
  function offKind(name, iso){
    var m = getDayoffs(name), v = m && m[iso];
    if(!v) return null;
    return (v === "有" || v === "指") ? v : "休";
  }
  function normalizeOffKind(k){ return (k === "有" || k === "指") ? k : "休"; }
  // kind を省くと、すでに休みの日は種類をそのまま残す（週の休みパターンで「有」を「休」に変えないため）
  function setOff(name, iso, on, kind){
    var m = getDayoffs(name);
    if(on){
      if(!m){ m = {}; state.dayoffs[name] = m; }
      if(kind !== undefined) m[iso] = normalizeOffKind(kind) === "休" ? 1 : kind;
      else if(!m[iso]) m[iso] = 1;
      unplaceOnDate(name, iso);   // 休みの人は未配置に戻す
    } else if(m){
      delete m[iso];
      if(Object.keys(m).length === 0) delete state.dayoffs[name];
    }
  }
  function isVisibleOnBoard(np){
    if(!state.shiftFilter) return true;
    return !isOff(np.name, state.boardDate || todayISO());
  }
  function migrateShiftName(oldName, newName){
    var m = getDayoffs(oldName);
    if(!m) return;
    if(getDayoffs(newName) === null) state.dayoffs[newName] = JSON.parse(JSON.stringify(m));
    var stillUsed = state.nameplates.some(function(n){ return n.name === oldName; });
    if(!stillUsed) delete state.dayoffs[oldName];
  }
  // 旧バージョン（出勤日を入力）のデータを休みの形式に変換する。
  // 出勤日が1日でも入力されていた月は、その月の出勤日以外を休みとして引き継ぐ。
  function convertWorkdaysToDayoffs(old){
    var out = {};
    Object.keys(old).forEach(function(name){
      var m = old[name];
      if(!m || typeof m !== "object") return;
      var months = {};
      Object.keys(m).forEach(function(iso){ if(m[iso]) months[iso.slice(0, 7)] = true; });
      var off = {}, any = false;
      Object.keys(months).forEach(function(ym){
        var y = parseInt(ym.slice(0, 4), 10), mo = parseInt(ym.slice(5, 7), 10);
        for(var d = 1, n = daysInMonth(y, mo); d <= n; d++){
          var iso = isoOf(y, mo, d);
          if(!m[iso]){ off[iso] = 1; any = true; }
        }
      });
      if(any) out[name] = off;
    });
    return out;
  }

  var WEEKDAYS = ["日","月","火","水","木","金","土"];
  var shiftOverlay = document.getElementById("shiftOverlay");
  var shiftBody = document.getElementById("shiftBody");
  var shiftMonth = null;   // { y, m }  m は 1〜12
  var shiftPeople = [];    // 表の行に対応する名前（重複なし）
  // 入力範囲の指定。行（名前）・列（日付）を選ぶと、選んだ行と列のマスだけ入力できる。
  // 何も選んでいないときは全マス入力可能。
  var shiftSelRows = Object.create(null);  // { 名前: true }
  var shiftSelCols = Object.create(null);  // { "YYYY-MM-DD": true }

  function stepBoardDate(delta){
    var p = (state.boardDate || todayISO()).split("-");
    var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10) + delta);
    setBoardDate(isoOf(d.getFullYear(), d.getMonth() + 1, d.getDate()));
  }

  function openShiftSheet(){

  function closeShiftSheet(){ shiftOverlay.classList.remove("open"); }

  function renderShiftSheet(keepScroll){
    var y = shiftMonth.y, m = shiftMonth.m, n = daysInMonth(y, m);
    var boardIso = state.boardDate || todayISO();
    var oldScroll = shiftBody.querySelector(".shift-scroll");
    var keepL = oldScroll ? oldScroll.scrollLeft : 0, keepT = oldScroll ? oldScroll.scrollTop : 0;

    var seen = Object.create(null);
    shiftPeople = [];
    sortByNumber(state.nameplates).forEach(function(np){
      if(!seen[np.name]){ seen[np.name] = true; shiftPeople.push(np.name); }
    });

    var html =
      '<div class="shift-toggle-row">' +
        '<div class="shift-toggle-title">出勤者だけをボードに表示</div>' +
        '<button type="button" class="switch-btn" id="shiftFilterSwitch" role="switch" aria-checked="' + (state.shiftFilter ? "true" : "false") + '"><i></i></button>' +
      '</div>' +
      '<div class="shift-toolbar">' +
        '<button type="button" class="date-step lg" id="shiftPrevMonth" aria-label="前の月">◀</button>' +
        '<span class="shift-month">' + y + '年' + m + '月</span>' +
        '<button type="button" class="date-step lg" id="shiftNextMonth" aria-label="次の月">▶</button>' +
      '</div>' +
      '<div class="shift-import-row"><button type="button" class="btn-secondary btn-sm" id="shiftImportBtn">Excel・CSV読み込み</button>' +
      '<button type="button" class="btn-secondary btn-sm" id="shiftShareBtn">共有コード作成</button>' +
      '<button type="button" class="btn-secondary btn-sm" id="shiftReceiveBtn">共有コード読み込み</button></div>';

    if(shiftPeople.length === 0){
      html += '<p class="confirm-msg">ネームプレートがありません。先に「＋」から追加してください。</p>';
      shiftBody.innerHTML = html;
      return;
    }

    var t = '<div class="shift-range" id="shiftRange"></div><div class="shift-scroll"><table class="shift-table"><thead><tr><th class="name-col">名前</th>';
    for(var d = 1; d <= n; d++){
      var wd = new Date(y, m - 1, d).getDay();
      var iso = isoOf(y, m, d);
      var cls = (wd === 0 ? "sun" : wd === 6 ? "sat" : "") + (iso === boardIso ? " board-col" : "");
      t += '<th class="' + cls + '" data-d="' + iso + '"><div>' + d + '</div><div class="wd">' + WEEKDAYS[wd] + '</div></th>';
    }
    t += '</tr></thead><tbody>';
    shiftPeople.forEach(function(name, i){
      t += '<tr><th class="name-col" scope="row" data-i="' + i + '"><div class="nm-row"><span class="nm">' + escapeHtml(name) + '</span><span class="off"></span></div></th>';
      for(var dd = 1; dd <= n; dd++){
        var isoD = isoOf(y, m, dd);
        var kind = offKind(name, isoD);   // 休みのマスなら "休" / "有" / "指"
        t += '<td class="shift-cell' + (kind ? ' on' + kindClass(kind) : '') + (isoD === boardIso ? ' board-col' : '') +
             '" data-i="' + i + '" data-d="' + isoD + '">' + (kind || '') + '</td>';
      }
      t += '</tr>';
    });
    t += '</tbody><tfoot><tr><th class="name-col">出勤</th>';
    for(var c = 1; c <= n; c++){ t += '<td class="cnt" data-d="' + isoOf(y, m, c) + '"></td>'; }
    t += '</tr></tfoot></table></div>';

    shiftBody.innerHTML = html + t;
    refreshShiftCounts();
    refreshShiftSelection();

    var scroller = shiftBody.querySelector(".shift-scroll");
    if(keepScroll){
      scroller.scrollLeft = keepL; scroller.scrollTop = keepT;
    } else {
      var target = scroller.querySelector("thead th.board-col");
      scroller.scrollLeft = target ? Math.max(0, target.offsetLeft - 165) : 0;
    }
  }

  function kindClass(kind){ return kind === "有" ? " k-yu" : kind === "指" ? " k-shi" : ""; }

  function refreshShiftCounts(){
    shiftBody.querySelectorAll("td.cnt").forEach(function(cell){
      var iso = cell.dataset.d, c = 0;
      shiftPeople.forEach(function(name){ if(!isOff(name, iso)) c++; });   // 出勤 = 全員 − 休み
      cell.textContent = c;
    });
    // 名前の横：その月の休みの日数
    var y = shiftMonth.y, m = shiftMonth.m, n = daysInMonth(y, m);
    shiftBody.querySelectorAll("tbody th.name-col").forEach(function(th){
      var off = th.querySelector(".off");
      if(!off) return;
      var name = shiftPeople[parseInt(th.dataset.i, 10)];
      var cnt = 0;
      for(var d = 1; d <= n; d++){ if(isOff(name, isoOf(y, m, d))) cnt++; }
      off.textContent = "休" + cnt;
    });
  }

  function shiftHasSelection(){
    return Object.keys(shiftSelRows).length + Object.keys(shiftSelCols).length > 0;
  }
  function selectedShiftNames(){
    return shiftPeople.filter(function(name){ return !!shiftSelRows[name]; });
  }
  // プレビュー用: 長い一覧は先頭だけ出し、「ほか○件を表示」を押すと全部を表示する（HTMLを返す）
  function expandableList(arr, max, sep){
    sep = sep || "、";
    if(arr.length <= max) return escapeHtml(arr.join(sep));
    return '<span class="imp-list">' + escapeHtml(arr.slice(0, max).join(sep)) +
      ' <button type="button" class="imp-more" data-full="' + escapeHtml(arr.join(sep)) + '">ほか' + (arr.length - max) + '件を表示</button></span>';
  }
  document.addEventListener("click", function(e){
    var btn = e.target && e.target.closest ? e.target.closest(".imp-more") : null;
    if(!btn) return;
    btn.parentNode.textContent = btn.getAttribute("data-full");
  });

  function limitedJoin(arr, max, sep){
    sep = sep || "・";
    if(arr.length <= max) return arr.join(sep);
    return arr.slice(0, max).join(sep) + " ほか" + (arr.length - max);
  }

  // 選択状態を表に反映（再描画せず、クラスとバーだけ更新するのでスクロール位置は保たれる）
  function refreshShiftSelection(){
    var has = shiftHasSelection();
    var tbl = shiftBody.querySelector(".shift-table");
    if(tbl) tbl.classList.toggle("has-sel", has);
    shiftBody.querySelectorAll("tbody th.name-col").forEach(function(th){
      th.classList.toggle("sel", !!shiftSelRows[shiftPeople[parseInt(th.dataset.i, 10)]]);
    });
    shiftBody.querySelectorAll("thead th[data-d]").forEach(function(th){
      th.classList.toggle("sel", !!shiftSelCols[th.dataset.d]);
    });
    shiftBody.querySelectorAll("td.shift-cell").forEach(function(td){
      var inRange = !!shiftSelRows[shiftPeople[parseInt(td.dataset.i, 10)]] || !!shiftSelCols[td.dataset.d];
      td.classList.toggle("in-range", has && inRange);
      td.classList.toggle("locked", !inRange);
    });
    var bar = document.getElementById("shiftRange");
    if(!bar) return;
    if(!has){
      bar.innerHTML = '<span>いまは閲覧のみ。名前か日付をタップすると、その行・列に入力できます。</span>';
      return;
    }
    var names = selectedShiftNames();
    var days = Object.keys(shiftSelCols).sort().map(function(iso){ return parseInt(iso.slice(8), 10) + "日"; });
    var parts = [];
    if(names.length) parts.push('行 <b>' + escapeHtml(limitedJoin(names, 3)) + '</b>');
    if(days.length) parts.push('列 <b>' + limitedJoin(days, 4) + '</b>');
    bar.innerHTML = '<span>入力範囲：' + parts.join('') + '</span>' +
      '<button type="button" class="btn-secondary btn-sm" id="shiftClearRange">解除</button>' +
      (names.length ? '<button type="button" class="btn-secondary btn-sm" id="shiftPatternBtn">曜日でまとめて入力</button>' : '');
  }

  function openShiftPatternModal(names){
    if(!names.length) return;
    var y = shiftMonth.y, m = shiftMonth.m, n = daysInMonth(y, m);
    var title = names.length === 1 ? names[0] : (names.length + "人");
    openModal(function(box){

  // 見出しのセルを日付として読む。1〜31 / 1日 / 1(月) / 9/1 / 9月1日 / 2026/9/1 / Excelの日付
  function parseHeaderCell(v){

      return (+mm[2] >= 1 && +mm[2] <= 12 && +mm[3] >= 1 && +mm[3] <= 31) ? { y: +mm[1], m: +mm[2], d: +mm[3] } : null;
