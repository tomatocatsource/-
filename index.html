            '<span title="' + escapeHtml(e.file + (e.sheet ? "／" + e.sheet : "")) + '">' + escapeHtml(entryLabel(e, i)) + '</span>' +
            (!isOT && multi && e.enabled ? '<button type="button" class="imp-file-master' + (i === master ? ' on' : '') + '" data-i="' + i + '">' +
              (i === master ? '★基準' : '基準にする') + '</button>' : '') +
            '<button type="button" class="imp-file-del" data-i="' + i + '" aria-label="外す">×</button></div>';
        }).join("");
      }
      elFileList.addEventListener("click", function(e){
        var ub = e.target.closest(".imp-file-use");
        if(ub){ var ui = parseInt(ub.dataset.i, 10); entries[ui].enabled = !entries[ui].enabled; recompute(); renderFileList(); return; }
        var mb = e.target.closest(".imp-file-master");
        if(mb){ masterIdx = parseInt(mb.dataset.i, 10); recompute(); renderFileList(); return; }
        var b = e.target.closest(".imp-file-del");
        if(!b) return;
        var di = parseInt(b.dataset.i, 10);
        entries.splice(di, 1);
        if(masterIdx !== null){ if(masterIdx === di) masterIdx = null; else if(masterIdx > di) masterIdx--; }
        recompute(); renderFileList();
      });

      // 記号・名前の照合など、1つでも複数でも共通の説明
      function detailLines(res){
        var html = '';
        var hitKeys = Object.keys(res.tokenHits);
        if(!isOT) html += '<br>休みとして読んだ記号: ' + (hitKeys.length ? escapeHtml(hitKeys.map(function(k){ return k + ' ' + res.tokenHits[k]; }).join('・')) : '<b>なし</b>');
        var workKeys = Object.keys(res.workHits || {});
        if(!isOT && workKeys.length) html += '<br>出勤として読んだ記号: ' + escapeHtml(workKeys.map(function(k){ return k + ' ' + res.workHits[k]; }).join('・'));
        var otherKeys = Object.keys(res.otherMarks).sort(function(a, b){ return res.otherMarks[b] - res.otherMarks[a]; });
        if(otherKeys.length) html += (isOT ? '<br>数字として読めなかった値: ' : '<br>そのほかの記号（出勤として読みます）: ') +
          expandableList(otherKeys.map(function(k){ return k + ' ' + res.otherMarks[k]; }), 6, '・');
        if(res.fuzzy.length) html += '<br>近い名前で照合: ' + expandableList(res.fuzzy, 3);
        if(res.dupNames.length) html += '<br><b>別々の名前の行が同じ人に当たりました（' + (isOT ? '先に出てきた行の値を使います' : '休みを合わせて読みます') + '）:</b> ' + expandableList(res.dupNames, 6) +
          '（別の人が混ざっていないか確認してください）';
        if(res.unmatched.length) html += '<br>ボードに同じ名前がなく、読み込まない行: ' + expandableList(res.unmatched, 6);
        var withTime = (res.people || []).filter(function(pp){ return pp.time; });
        if(!isOT && withTime.length){
          html += '<br>勤務時間: <b>' + withTime.length + '人分</b>' +
            (res.timeCols && !res.swapped ? '（開始 ' + colLetter(res.timeCols.s) + '列・終了 ' + colLetter(res.timeCols.e) + '列）' : '');
        }
        var dmKeys = Object.keys(res.dayMarks || {}).sort();
        if(!isOT && dmKeys.length){
          var dmTypes = Object.create(null);
          dmKeys.forEach(function(iso){ dmTypes[res.dayMarks[iso]] = (dmTypes[res.dayMarks[iso]] || 0) + 1; });
          html += '<br>日付の印: <b>' + dmKeys.length + '日分</b>（' + escapeHtml(Object.keys(dmTypes).map(function(k){ return k + ' ' + dmTypes[k]; }).join('・')) + '）' +
            (res.dayMarkRows && res.dayMarkRows.length && !res.swapped ? '・' + res.dayMarkRows.map(function(r){ return (res.dayMarkCell ? res.dayMarkCell + 'の行' : (r + 1) + '行目'); }).join('・') + 'から' : '') +
            '<br>この日付の範囲の印も置き換わります。';
        }
        html += '<br>読み込んだ人の、この日付の範囲の' + what + 'が置き換わります。';
        return html;
      }
      function summaryLine(res){
        return '<b>' + res.people.length + '人</b> × <b>' + res.cols.length + '日</b>（' + mdOfISO(res.cols[0].iso) + '〜' + mdOfISO(res.cols[res.cols.length - 1].iso) +
          '）／' + (isOT ? '残業 <b>' + res.offCount + '</b>マス・合計 <b>' + fmtHours(res.otTotal) + '</b>時間' : '休み <b>' + res.offCount + '</b>マス');
      }
      function otLines(res){
        var html = '';
        if(isOT && res.otSerial) html += '<br>Excelの時刻（1:30 など）の形式として読み、時間に直しました。';
        if(isOT && res.otOver) html += '<br><b>' + fmtHours(OT_MAX) + '時間を超える値が' + res.otOver + 'マスあり、読み込みません</b>（分で書かれた表かもしれません）。';
        return html;
      }
      function otEmptyMessage(res){
        return "残業の時間として読める値がありませんでした。" +
          (res.otOver ? "<br>" + fmtHours(OT_MAX) + "時間を超える値が" + res.otOver + "マスありました（分で書かれた表かもしれません）。" : "") +
          (Object.keys(res.otherMarks).length ? "<br>読めなかった値: " + expandableList(Object.keys(res.otherMarks), 6, "・") : "");
      }

      function recompute(){
        result = null; okBtn.disabled = true;
        if(loading) return;
        if(elPaste.value.trim()){ recomputeSingle(parseDelimited(elPaste.value), ""); return; }
        var act = activeEntries();
        if(entries.length && !act.length){ setPreview("「使う」になっているファイル・シートがありません。一覧で選んでください。", true); return; }
        if(act.length > 1){ recomputeMulti(); return; }
        if(act.length === 1){ var only = act[0]; recomputeSingle(only.rows, only.sheet ? 'シート「' + escapeHtml(only.sheet) + '」を読みました<br>' : ''); return; }
        recomputeSingle(null, "");
      }

      function recomputeSingle(rows, headHtml){
        if(!rows){ setPreview("ファイルを選ぶか、Excelでコピーしたセルを貼り付けてください。"); return; }
        var opts = getOpts(), match = buildNameMatcher();
        var res = analyzeRows(rows, opts, match);
        if(!res){
          setPreview(headHtml + "日付の並び（1, 2, 3… や 9/1 など）が5日分以上ある行が見つかりませんでした。日付の見出しを含めてください。", true);
          return;
        }
        if(!res.people.length){
          setPreview(headHtml + "ボードの名前と一致する行がありませんでした。" +
            "<br>名前は " + colLetter(res.nameCol) + "列から読みました。" +
            (res.unmatched.length ? "<br>表の名前: <b>" + expandableList(res.unmatched, 6) + "</b>" : ""), true);
          return;
        }
        if(isOT){
          finalizeOvertimeResult(res);
          if(!res.offCount){ setPreview(headHtml + "表は見つかりましたが、" + otEmptyMessage(res), true); return; }
        }
        result = res; okBtn.disabled = false;
        var html = headHtml + summaryLine(res) + (res.swapped ? '<br>縦横を入れ替えて読みました。' : '') + otLines(res);
        if(!res.swapped){
          html += '<br>読み取り位置: 日付 ' + (res.hdr + 1) + '行目（' + colLetter(res.cols[0].c) + '〜' + colLetter(res.cols[res.cols.length - 1].c) + '列）・名前 ' +
            colLetter(res.nameCol) + '列' + (res.firstDataRow >= 0 ? '（' + (res.firstDataRow + 1) + '行目から）' : '');
          if(res.sheetMonth) html += '<br>月: ' + res.sheetMonth.m + '月（' + colLetter(res.sheetMonth.c) + (res.sheetMonth.r + 1) + 'から判定）';
        }
        setPreview(html + detailLines(res), false);
      }

      function recomputeMulti(){
        var opts = getOpts(), match = buildNameMatcher(), parts = [], lines = [];
        entries.forEach(function(e, i){
          if(!e.enabled) return;
          var res = analyzeRows(e.rows, opts, match);
          var line = escapeHtml(entryLabel(e, i)) + '：';
          if(!res) line += '<span class="imp-bad">日付の見出しが見つからず、読みません</span>';
          else if(!res.people.length) line += '<span class="imp-bad">ボードの名前と一致する行がなく、読みません</span>';
          else {
            line += res.people.length + '人・' + mdOfISO(res.cols[0].iso) + '〜' + mdOfISO(res.cols[res.cols.length - 1].iso) +
              (isOT ? '' : '・休み' + res.offCount + 'マス');
            parts.push({ label: FILE_MARKS[i], res: res, entryIdx: i });
          }
          lines.push(line);
        });
        var filesHtml = '<div class="imp-files-sum">' + lines.join('<br>') + '</div>';
        if(!parts.length){ setPreview(filesHtml + 'どこからも読み込めませんでした。', true); return; }
        // 基準を選んでいなければ、一致した人数がいちばん多いもの
        autoMasterIdx = parts.slice().sort(function(a, b){ return b.res.people.length - a.res.people.length || a.entryIdx - b.entryIdx; })[0].entryIdx;
        var res = mergeImportResults(parts, isOT, effectiveMaster());
        if(isOT){
          finalizeOvertimeResult(res);
          if(!res.offCount){ setPreview(filesHtml + otEmptyMessage(res), true); return; }
        }
        result = res; okBtn.disabled = false;
        var html = filesHtml + '<b>まとめると</b> ' + summaryLine(res) + otLines(res);
        if(!isOT){
          var mi = effectiveMaster();
          html += '<br><b>基準: ' + escapeHtml(entryLabel(entries[mi], mi)) + '</b>' +
            (masterIdx === null || masterIdx !== mi ? '（人数がいちばん多いもの。上の一覧で変えられます）' : '');
        }
        if(res.multiNames.length){
          html += '<br><b>複数に出てくる人:</b> ' + expandableList(res.multiNames, 4) +
            (isOT ? '（値があるほうの時間を使います）' : '（基準のシフトを使います）');
          if(isOT && res.conflicts) html += '<br>2つ以上に時間がある日が ' + res.conflicts + ' 日あり、大きいほうを使いました。';
        }
        setPreview(html + detailLines(res), false);
      }

      // ファイルを読み込み元に分ける。Excelは表があってボードの名前が載ったシートをすべて取り出す。
      // 休みが1つも読めないシート（勤務時間の計算用など）は「使わない」で追加する。
      async function loadFile(f){
        var fileKey = f.name + "|" + f.size;
        var buf = await readFileBuffer(f), head = new Uint8Array(buf.slice(0, 4));
        if(head[0] === 0xD0 && head[1] === 0xCF){                         // 旧 .xls
          throw new Error("古い形式（.xls）は読めません。Excelで「.xlsx」か「CSV」で保存し直してください。");
        }
        if(!(head[0] === 0x50 && head[1] === 0x4B)){                      // CSV / TSV
          return [{ fileKey: fileKey, file: f.name, sheet: null, rows: parseDelimited(decodeText(buf)), enabled: true }];
        }
        var wb = await openXlsx(buf), opts = getOpts(), match = buildNameMatcher(), found = [], fallback = null;
        for(var i = 0; i < wb.names.length && i < 40; i++){
          var r;
          try{ r = await wb.getRows(i); }catch(e){ continue; }
          var res = analyzeRows(r, opts, match);
          if(!res) continue;
          if(res.people.length) found.push({ fileKey: fileKey, file: f.name, sheet: wb.names[i], rows: r, enabled: res.offCount > 0 });
          else if(!fallback) fallback = { fileKey: fileKey, file: f.name, sheet: wb.names[i], rows: r, enabled: true };
        }
        if(found.length){
          // 1枚だけならシート名は出さなくてよい
          if(wb.names.length === 1) found[0].sheet = null;
          return found;
        }
        if(fallback) return [fallback];   // 名前が一致しない表でも、確認画面で「表の名前」を見せるために入れる
        throw new Error("日付の見出しがあるシートが見つかりませんでした。");
      }

      elFile.addEventListener("change", async function(){
        var files = Array.prototype.slice.call(elFile.files || []);
        elFile.value = "";   // 同じファイルを選び直しても・続けて追加しても反応するように
        if(!files.length) return;
        elPaste.value = "";
        loading++; okBtn.disabled = true;
        setPreview("読み込み中…");
        var errors = [], fileCount = {};
        entries.forEach(function(e){ fileCount[e.fileKey] = true; });
        for(var i = 0; i < files.length; i++){
          var f = files[i], key = f.name + "|" + f.size;
          if(fileCount[key]) continue;   // 同じファイルは1回だけ
          if(Object.keys(fileCount).length >= IMPORT_MAX_FILES){ errors.push(IMPORT_MAX_FILES + "つまでです。「" + f.name + "」は読みません。"); continue; }
          try{
            var got = await loadFile(f);
            fileCount[key] = true;
            got.forEach(function(e){
              if(entries.length < IMPORT_MAX_SOURCES) entries.push(e);
              else if(errors.indexOf("シートは" + IMPORT_MAX_SOURCES + "枚までです。") === -1) errors.push("シートは" + IMPORT_MAX_SOURCES + "枚までです。");
            });
          }catch(err){ errors.push("「" + f.name + "」: " + fileReadErrorMessage(err)); }
        }
        loading--;
        recompute();
        renderFileList();
        if(errors.length){
          setPreview(escapeHtml(errors.join("\n")).replace(/\n/g, "<br>") + (elPreview.innerHTML ? "<br>" + elPreview.innerHTML : ""), true);
        }
      });
      elPaste.addEventListener("input", function(){
        if(elPaste.value.trim() && entries.length){ entries = []; masterIdx = null; renderFileList(); }   // 貼り付けを使うときはファイルを外す
        recompute();
      });
      box.querySelector("#cancelBtn").addEventListener("click", closeModal);

      okBtn.addEventListener("click", function(){ if(result){ if(isOT) applyOvertimeImport(result); else applyShiftImport(result); } });
      recompute();
    });
  }

      return;
    }
    if(t.closest("#shiftImportBtn")){ openShiftImportModal("off"); return; }

    if(t.closest("#shiftReceiveBtn")){ openShiftReceiveModal(shiftMode); return; }
    var myDay = t.closest(".my-cal td.my-day");
    if(myDay){ setBoardDate(myDay.dataset.d); closeShiftSheet(); return; }   // 個人カレンダー：その日のボードへ
    if(t.closest(".my-cal")) return;
    var cell = t.closest(".shift-cell");
    if(cell){
      if(cell.classList.contains("locked")){          // 入力範囲の外は変更しない
        var hint = document.getElementById("shiftRange");
        if(hint){ hint.classList.add("flash"); setTimeout(function(){ hint.classList.remove("flash"); }, 900); }
        return;
      }
      var name = shiftPeople[parseInt(cell.dataset.i, 10)];
      if(shiftMode === "ot"){ openOvertimeModal(name, cell.dataset.d); return; }
      var on = !isOff(name, cell.dataset.d);   // 手入力は「休」だけ。有・指のマスをタップすると空に戻る
      setOff(name, cell.dataset.d, on, "休");
      cell.classList.toggle("on", on);
      cell.classList.remove("k-yu", "k-shi", "k-ketsu", "k-ken", "k-ast", "work-mark");
      cell.textContent = on ? "休" : "";
      refreshShiftCounts();
      scheduleSave(); renderAll();
      return;
    }
    var nameTh = t.closest("tbody .name-col");
    if(nameTh){
      var rowName = shiftPeople[parseInt(nameTh.dataset.i, 10)];
      // 名前か日付のどちらか1つだけ選べる（名前を選ぶと日付の選択は外れる。同じ名前をもう一度タップで解除）
      var rowWasOn = !!shiftSelRows[rowName];
      shiftSelRows = Object.create(null); shiftSelCols = Object.create(null);
      if(!rowWasOn) shiftSelRows[rowName] = true;
      refreshShiftSelection();
      return;
    }
    var colTh = t.closest("thead th[data-d]");
    if(colTh){
      var colIso = colTh.dataset.d;
      // 日付を選ぶと名前の選択は外れる
      var colWasOn = !!shiftSelCols[colIso];
      shiftSelRows = Object.create(null); shiftSelCols = Object.create(null);
      if(!colWasOn) shiftSelCols[colIso] = true;
      refreshShiftSelection();
      return;
    }
    if(t.closest("#shiftClearRange")){
      shiftSelRows = Object.create(null); shiftSelCols = Object.create(null);
      refreshShiftSelection();
      return;
    }
    if(t.closest("#shiftPatternBtn")){ openShiftPatternModal(selectedShiftNames()); return; }
    if(t.closest("#shiftDayMarkBtn")){ openDayMarkModal(Object.keys(shiftSelCols).sort()); return; }
    if(t.closest("#shiftFilterSwitch")){
      state.shiftFilter = !state.shiftFilter;
      if(state.shiftFilter) sanitizeOffPlacements();
      t.closest("#shiftFilterSwitch").setAttribute("aria-checked", state.shiftFilter ? "true" : "false");
      scheduleSave(); renderAll();
      return;
    }
    if(t.closest("#shiftPrevMonth") || t.closest("#shiftNextMonth")){
      var delta = t.closest("#shiftPrevMonth") ? -1 : 1;
      var nm = shiftMonth.m + delta, ny = shiftMonth.y;
      if(nm < 1){ nm = 12; ny--; } else if(nm > 12){ nm = 1; ny++; }
      shiftMonth = { y: ny, m: nm };
      shiftSelCols = Object.create(null);   // 日付の選択は月をまたがない
      renderShiftSheet(false);
    }
  });

  // ---------- S/M/L の該当者を表示 ----------
  // 「合計」を押したとき: ボードに配置した人が、何時に何人出勤するか（と時間帯ごとの人数）
  function openWorkTimeModal(){
    var iso = state.boardDate || todayISO(), seen = Object.create(null), names = [];
    state.nameplates.forEach(function(n){
      if(n.locationId && isVisibleOnBoard(n) && !seen[n.name]){ seen[n.name] = true; names.push(n.name); }
    });
    openModal(function(box){
      function render(){
        var withT = [], noT = [];
        names.forEach(function(nm){ var t = workTimeOf(nm); if(t) withT.push({ name: nm, s: t.s, e: t.e }); else noT.push(nm); });
        var h = '<div class="sheet-header"><span>' + escapeHtml(formatDateJP(iso)) + 'の出勤時間</span></div>';
        if(!names.length){
          h += '<p class="confirm-msg">ボードにまだ誰も配置されていません。</p>';
        } else {
          h += '<p class="wt-sub">ボードに配置した ' + names.length + '人（名前を押すと時間を変えられます）</p>';
          if(withT.length){
            // 出勤時刻ごと
            var groups = Object.create(null), keys = [];
            withT.sort(function(a, b){ return a.s - b.s || a.e - b.e; }).forEach(function(p){
              if(!groups[p.s]){ groups[p.s] = []; keys.push(p.s); }
              groups[p.s].push(p);
            });
            h += '<div class="wt-groups">' + keys.map(function(k){
              return '<div class="wt-group"><div class="wt-time">' + fmtClock(k) + '<small>〜</small></div><div class="wt-count"><b>' + groups[k].length + '</b>人</div>' +
                '<div class="wt-names">' + groups[k].map(function(p){
                  return '<button type="button" class="wt-name" data-name="' + escapeHtml(p.name) + '">' + escapeHtml(p.name) + '<small>〜' + fmtEndClock(p.e) + '</small></button>';
                }).join('') + '</div></div>';
            }).join('') + '</div>';
            // 時間帯ごとの人数
            var minH = Math.floor(Math.min.apply(null, withT.map(function(p){ return p.s; })) / 60);
            var maxH = Math.ceil(Math.max.apply(null, withT.map(function(p){ return p.e; })) / 60);
            var rowsH = [], peak = 0;
            for(var hh = minH; hh < maxH; hh++){
              var c = withT.filter(function(p){ return p.s < (hh + 1) * 60 && p.e > hh * 60; }).length;
              rowsH.push({ h: hh, c: c }); if(c > peak) peak = c;
            }
            h += '<div class="wt-title">時間帯ごとの人数</div><div class="wt-bars">' + rowsH.map(function(r){
              return '<div class="wt-bar-row"><span class="wt-bar-h">' + (r.h % 24) + '時</span>' +
                '<span class="wt-bar"><span style="width:' + (peak ? Math.round(r.c / peak * 100) : 0) + '%"></span></span>' +
                '<span class="wt-bar-c">' + r.c + '</span></div>';
            }).join('') + '</div>';
          }
          if(noT.length){
            h += '<div class="wt-title">時間が未設定（' + noT.length + '人）</div><div class="wt-names wt-unset">' +
              noT.map(function(nm){ return '<button type="button" class="wt-name" data-name="' + escapeHtml(nm) + '">' + escapeHtml(nm) + '<small>設定</small></button>'; }).join('') +
              '</div><p class="wt-sub">シフト表の「ファイル読込」でExcelの「開始」「終了」の列から読み込むか、名前を押して設定します。</p>';
          }
        }
        h += '<div class="modal-actions"><button class="btn-primary" id="closeBtn" type="button">閉じる</button></div>';
        box.innerHTML = h;
        box.querySelector("#closeBtn").addEventListener("click", closeModal);
        box.querySelectorAll(".wt-name").forEach(function(b){
          b.addEventListener("click", function(){ editTime(b.dataset.name); });
        });
      }
      function editTime(name){
        var t = workTimeOf(name);
        box.innerHTML =
          '<div class="sheet-header"><span>' + escapeHtml(name) + 'の勤務時間</span></div>' +
          '<div class="wt-edit"><label>開始<input type="time" id="wtS" step="300" value="' + (t ? pad2(Math.floor(t.s / 60) % 24) + ':' + pad2(t.s % 60) : '') + '"></label>' +
          '<span class="wt-dash">〜</span>' +
          '<label>終了<input type="time" id="wtE" step="300" value="' + (t ? pad2(Math.floor(t.e / 60) % 24) + ':' + pad2(t.e % 60) : '') + '"></label></div>' +
          '<p class="wt-sub">終了が開始より前なら、日をまたぐ勤務として扱います。</p>' +
          '<p class="any-err" id="wtErr" hidden></p>' +
          '<div class="modal-actions">' +
            '<button class="btn-secondary" id="backBtn" type="button">戻る</button>' +
            (t ? '<button class="btn-secondary" id="clearBtn" type="button">未設定にする</button>' : '') +
            '<button class="btn-primary" id="okBtn" type="button">保存</button>' +
          '</div>';
        box.querySelector("#backBtn").addEventListener("click", render);
        var cb = box.querySelector("#clearBtn");
        if(cb) cb.addEventListener("click", function(){ delete state.workTimes[name]; scheduleSave(); render(); });
        box.querySelector("#okBtn").addEventListener("click", function(){
          var wt = normWorkTime(parseWorkTime(box.querySelector("#wtS").value), parseWorkTime(box.querySelector("#wtE").value));
          var err = box.querySelector("#wtErr");
          if(!wt){ err.textContent = "開始と終了の時刻を入れてください。"; err.hidden = false; return; }
          state.workTimes[name] = wt; scheduleSave(); render();
        });
      }
      function pad2(n){ return (n < 10 ? "0" : "") + n; }
      render();
    });
  }

  document.getElementById("statsBar").addEventListener("click", function(e){
    var el = e.target.closest(".stat-cat");
    if(e.target.closest(".stat-total")){ openWorkTimeModal(); return; }
    if(el) openCategoryMembersModal(el.dataset.cat);
  });

  // ---------- themes ----------
  var THEMES = [
    {id:"default", name:"標準", colors:["#EDEBE3","#FFFFFF","#2F6B5E"]},
    {id:"apple", name:"シンプル", colors:["#F5F5F7","#FFFFFF","#007AFF"]},
    {id:"play", name:"トイポップ", colors:["#FFF3C8","#2D5BFF","#FF3D71"]},
    {id:"neon", name:"ネオン", colors:["#080014","#160A28","#FF2EC4"]},
    {id:"cyber", name:"クリプトパンク", colors:["#0B0A12","#FF3B7F","#F3E600"]},
    {id:"hud", name:"サイバー", colors:["#050a10","#0a121c","#00e5ff"]},
    {id:"retro", name:"レトロゲーム", colors:["#1A1233","#FFF6D6","#FFD34E"]},
    {id:"sakura", name:"サクラ", colors:["#FFEAF1","#F7BCCD","#E85D8A"]},
    {id:"midnight", name:"ミッドナイト", colors:["#05070E","#0D1120","#C9AE6A"]},
    {id:"citrus", name:"シトラス", colors:["#FFF0CC","#F5D000","#FF8A00"]},
    {id:"ink", name:"墨", colors:["#F6F2E8","#1A1A1A","#B71C1C"]},
    {id:"coral", name:"コーラルリーフ", colors:["#BFEDEA","#2C8F92","#FF6F59"]},
    {id:"forest", name:"フォレスト", colors:["#E6EFD9","#2F4A2A","#7FB069"]},
    {id:"aurora", name:"オーロラ", colors:["#040812","#0E1628","#5EEAD4"]},
    {id:"carbon", name:"カーボンレーシング", colors:["#0B0B0D","#F4F4F4","#E10600"]},
    {id:"desert", name:"デザート", colors:["#FBE3C6","#E0AE77","#C1592B"]},
    {id:"rosegold", name:"ローズゴールド", colors:["#FBF2EE","#F0CBBE","#B06F62"]},
    {id:"galaxy", name:"ギャラクシー", colors:["#09091F","#14142E","#8B5CF6"]},
    {id:"steampunk", name:"スチームパンク", colors:["#17110C","#B5703F","#C9A45A"]},
    {id:"shonen", name:"バトルオーラ", colors:["#07080F","#1F2235","#FFC21A"]},
  ];
  function applyTheme(id){
    state.theme = THEMES.some(function(t){return t.id===id;}) ? id : "default";
    document.body.dataset.theme = state.theme;
    scheduleSave();
    renderThemeChoices();
  }
  function openThemeSheet(){ closeModal(); renderThemeChoices(); document.getElementById("themeOverlay").classList.add("open"); }
  function closeThemeSheet(){ document.getElementById("themeOverlay").classList.remove("open"); }
  function renderThemeChoices(){
    var grid=document.getElementById("themeGrid"); if(!grid) return; grid.innerHTML="";
    THEMES.forEach(function(t){
      var b=document.createElement("button"); b.type="button"; b.className="theme-choice"+(state.theme===t.id?" selected":"");
      b.innerHTML="<b>"+escapeHtml(t.name)+"</b><div class=\"theme-preview\"><i style=\"background:"+t.colors[0]+"\"></i><i style=\"background:"+t.colors[1]+"\"></i><i style=\"background:"+t.colors[2]+"\"></i></div>";
      b.addEventListener("click",function(){ applyTheme(t.id); closeThemeSheet(); }); grid.appendChild(b);
    });
  }

  // ---------- hidden command: physics collapse ----------
  // secret trigger: tap the app title 5 times quickly
  (function(){
    var titleEl = document.querySelector(".title-main");
    if(!titleEl) return;
    var tapCount = 0;
    var tapTimer = null;
    titleEl.addEventListener("click", function(){
      tapCount++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(function(){ tapCount = 0; }, 1200);
      if(tapCount >= 5){
        tapCount = 0;
        clearTimeout(tapTimer);
        triggerPhysicsCollapse();
      }
    });
  })();

  function triggerPhysicsCollapse(){
    // 動きを減らす設定の端末では演出しない
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if(document.body.classList.contains("physics-active")) return;
    if(modalOverlay.classList.contains("open")) return;
    if(templateOverlay.classList.contains("open")) return;
    if(document.getElementById("shiftOverlay").classList.contains("open")) return;
    var themeOverlayEl = document.getElementById("themeOverlay");
    if(themeOverlayEl && themeOverlayEl.classList.contains("open")) return;

    var chips = Array.prototype.slice.call(document.querySelectorAll(".location-card .nameplate-chip"));
    if(chips.length === 0) return;

    document.body.classList.add("physics-active");
    document.body.classList.add("physics-shake");
    setTimeout(function(){ document.body.classList.remove("physics-shake"); }, 350);

    var layer = document.createElement("div");
    layer.id = "physicsLayer";
    layer.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;";
    document.body.appendChild(layer);

    var poolTop = poolBarEl ? poolBarEl.getBoundingClientRect().top : window.innerHeight;
    var floor = Math.min(poolTop, window.innerHeight) - 6;
    var wallLeft = 4, wallRight = window.innerWidth - 4;
    var gravity = 2600;
    var boardRect = boardGrid.getBoundingClientRect();
    var centerX = boardRect.left + boardRect.width / 2;
    var centerY = boardRect.top + boardRect.height / 2;
    var bodies = chips.map(function(chip){
      var rect = chip.getBoundingClientRect();
      chip.style.visibility = "hidden";
      var clone = document.createElement("div");
      clone.className = chip.className;
      clone.textContent = chip.textContent;
      clone.style.cssText = "position:absolute;left:" + rect.left + "px;top:" + rect.top + "px;width:" + rect.width + "px;height:" + rect.height + "px;margin:0;box-sizing:border-box;display:flex;align-items:center;justify-content:center;will-change:transform;";
      layer.appendChild(clone);
      var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
      var dx = cx - centerX, dy = cy - centerY;
      var dist = Math.sqrt(dx * dx + dy * dy) || 1;
      var dirX = dx / dist, dirY = dy / dist;
      var burst = 650 + Math.random() * 500;
      return {
        el: clone,
        x: rect.left, y: rect.top, w: rect.width, h: rect.height,
        vx: dirX * burst + (Math.random() - 0.5) * 220,
        vy: dirY * burst - 380 - Math.random() * 260,
        rot: 0,
        vrot: (Math.random() - 0.5) * 900
      };
    });

    var last = null;
    var startedAt = null;
    var totalDuration = 3500;

    function step(now){
      if(last === null){ last = now; startedAt = now; }
      var dt = Math.min((now - last) / 1000, 0.032);
      last = now;
      bodies.forEach(function(b){
        b.vy += gravity * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.rot += b.vrot * dt;

        var restY = floor - b.h;
        if(b.y > restY){
          b.y = restY;
          b.vy = -b.vy * 0.42;
          b.vx *= 0.68;
          b.vrot *= 0.5;
          if(Math.abs(b.vy) < 45){ b.vy = 0; }
        }
        if(b.x < wallLeft){ b.x = wallLeft; b.vx = -b.vx * 0.5; }
        if(b.x + b.w > wallRight){ b.x = wallRight - b.w; b.vx = -b.vx * 0.5; }
        b.vx *= (1 - Math.min(dt * 1.4, 1));

        b.el.style.left = b.x + "px";
        b.el.style.top = b.y + "px";
        b.el.style.transform = "rotate(" + b.rot.toFixed(1) + "deg)";
      });
      if((now - startedAt) < totalDuration){
        requestAnimationFrame(step);
      } else {
        finishPhysicsCollapse(layer, chips);
      }
    }
    requestAnimationFrame(step);
  }

  function finishPhysicsCollapse(layer, chips){
    layer.style.transition = "opacity .25s ease";
    layer.style.opacity = "0";
    setTimeout(function(){
      layer.remove();
      chips.forEach(function(c){ c.style.visibility = ""; });
      document.body.classList.remove("physics-active");
    }, 260);
  }

  // ---------- init ----------
  window.addEventListener("DOMContentLoaded", loadState);
  // オフラインでも開けるように Service Worker を登録する（https か localhost のときだけ動く）
  // オフライン用の Service Worker は、GitHub Pages などで普通に開いたときだけ登録する。
  // Claude のプレビューのように別の画面の中（iframe）で開いたときは sw.js が無いので登録しない。
  // 登録できなくてもアプリは普通に動くので、失敗してもメッセージは出さない。
  var isTopLevel = true;
  try{ isTopLevel = window.self === window.top; }catch(e){ isTopLevel = false; }
  if("serviceWorker" in navigator && window.isSecureContext && isTopLevel){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
  document.getElementById("saveWarnClose").addEventListener("click", function(){
    document.getElementById("saveWarn").hidden = true; saveWarnDismissed = true;
  });
  document.addEventListener("visibilitychange", function(){
    if(!loaded) return;
    if(document.visibilityState === "hidden"){ clearTimeout(saveTimer); saveState(); return; }
    if(changedInOtherTab){ reloadFromStorage(); return; }
    checkDayChange();
  });
  // 日付が変わっていたら今日に切り替える。画面を開いたまま0時を越えたときのため、1分ごとにも確認する
  function checkDayChange(){
    if(!loaded || changedInOtherTab) return;
    var today = todayISO();
    if(today !== sessionDay){
      sessionDay = today;
      if(state.boardDate !== today) setBoardDate(today);
    }
  }
  setInterval(function(){
    if(document.visibilityState === "visible") checkDayChange();
  }, 60000);
  window.addEventListener("pagehide", function(){ if(loaded){ clearTimeout(saveTimer); saveState(); } });

  // ほかのタブで保存されたら、この画面の保存を止めて読み直してもらう。
  // （そのまま保存を続けると、後から保存した側が相手の変更を丸ごと消してしまうため）
  function reloadFromStorage(){
    loaded = false;   // 読み直す直前の pagehide で古い内容を保存しないように
    location.reload();
  }
  window.addEventListener("storage", function(e){
    if(e.storageArea !== localStorage) return;
    if(e.key !== STORAGE_KEY && e.key !== null) return;   // null = 全消去
    if(!loaded || changedInOtherTab) return;
    changedInOtherTab = true;
    clearTimeout(saveTimer);
    // 見えていない画面は、そのまま読み直せばよい
    if(document.visibilityState === "hidden"){ reloadFromStorage(); return; }
    setSaveWarning(true, "⚠ ほかの画面で内容が変更されました。この画面での変更は保存されません。読み直してください。");
    openModal(function(box){
      box.innerHTML =
        '<div class="sheet-header"><span>ほかの画面で変更されました</span></div>' +
        '<p class="confirm-msg">このボードは別のタブやアプリでも開かれていて、そちらで内容が保存されました。' +
        '上書きしてしまわないよう、この画面での保存を止めています。読み直すと最新の内容になります。</p>' +
        '<div class="modal-actions"><button class="btn-primary" id="reloadBtn" type="button">読み直す</button></div>';
      box.querySelector("#reloadBtn").addEventListener("click", reloadFromStorage);
    });
  });
})();
</script>
